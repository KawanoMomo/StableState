<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src https://fonts.gstatic.com;">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #1a1a2e; --editor: #0f0f23; --panel: #16213e; --border: #2a2a4a;
  --text: #E2E8F0; --muted: #64748B; --dim: #475569;
  --accent: #818CF8; --accent2: #4338CA; --accent-bg: #312E81;
  --green: #22C55E; --amber: #F59E0B; --red: #EF4444;
}
body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans','Noto Sans JP',sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* Header */
#header { display:flex; align-items:center; justify-content:space-between; padding:6px 12px; border-bottom:1px solid var(--border); flex-shrink:0; background:var(--panel); }
#header .logo { display:flex; align-items:center; gap:8px; }
#header .logo-icon { width:24px; height:24px; border-radius:5px; background:linear-gradient(135deg,#818CF8,#4338CA); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#fff; }
#header .logo-text { font-weight:700; font-size:14px; }
#header .badge { font-size:9px; color:#A5B4FC; font-weight:600; background:var(--accent-bg); padding:2px 7px; border-radius:10px; }

.tab-group { display:flex; gap:2px; margin:0 12px; }
.tab-btn { padding:4px 14px; font-size:11px; font-weight:600; border:1px solid var(--border); border-radius:5px; cursor:pointer; background:transparent; color:var(--muted); font-family:inherit; transition:all 0.15s; }
.tab-btn:hover { background:var(--accent-bg); color:#A5B4FC; }
.tab-btn.active { background:var(--accent2); color:#fff; border-color:var(--accent); }

.toolbar { display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
.tb { padding:4px 10px; font-size:11px; font-weight:600; border:1px solid var(--border); border-radius:5px; cursor:pointer; background:transparent; color:#94A3B8; font-family:inherit; transition:all 0.15s; }
.tb:hover { background:#334155; }
.tb.active { background:var(--accent2); color:#fff; border-color:var(--accent); }
.tb-accent { border-color:var(--accent); color:#A5B4FC; }
.sep { width:1px; height:14px; background:var(--border); margin:0 4px; }

#body { flex:1; display:flex; overflow:hidden; }

#center-panel { flex:1; display:flex; flex-direction:column; overflow:hidden; }
#diagram-view { flex:1; display:flex; flex-direction:column; overflow:hidden; }
#diagram-area { flex:1; overflow:auto; padding:12px; background:repeating-conic-gradient(var(--panel) 0% 25%, var(--bg) 0% 50%) 0 0/24px 24px; }
#svg-wrap { background:#fff; border-radius:8px; display:inline-block; line-height:0; }
#svg-wrap svg { cursor:default; }

#table-view { flex:1; display:none; flex-direction:column; overflow:hidden; }
#table-area { flex:1; overflow:auto; padding:12px; }
#state-table { width:100%; border-collapse:collapse; font-size:12px; }
#state-table th, #state-table td { border:1px solid var(--border); padding:4px 8px; text-align:left; }
#state-table th { background:var(--panel); color:var(--accent); font-weight:600; font-size:10px; text-transform:uppercase; }
#state-table td { background:var(--editor); color:var(--text); }
#table-empty { display:flex; align-items:center; justify-content:center; height:100%; color:var(--muted); font-size:13px; }

#prop-panel { width:220px; min-width:220px; border-left:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; background:var(--panel); }
#prop-content { flex:1; overflow-y:auto; padding:12px; }
.prop-section { margin-bottom:12px; }
.prop-label { font-size:10px; color:var(--muted); font-weight:600; margin-bottom:2px; text-transform:uppercase; letter-spacing:0.05em; }
.prop-row { display:flex; gap:6px; margin-bottom:6px; }
.prop-input { background:var(--editor); border:1px solid var(--border); border-radius:4px; color:var(--text); padding:4px 8px; font-size:12px; width:100%; outline:none; font-family:'IBM Plex Mono',monospace; }
.prop-input:focus { border-color:var(--accent); }
.prop-sub { font-size:9px; color:var(--dim); }
.prop-select { background:var(--editor); border:1px solid var(--border); border-radius:4px; color:var(--text); padding:4px 8px; font-size:12px; width:100%; outline:none; font-family:'IBM Plex Mono',monospace; }
.prop-select:focus { border-color:var(--accent); }
.prop-checkbox { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
.prop-checkbox input[type="checkbox"] { accent-color:var(--accent); }
.prop-checkbox label { font-size:11px; color:var(--text); }
.prop-warning { font-size:10px; color:var(--amber); background:#422006; border:1px solid var(--amber); border-radius:4px; padding:4px 8px; margin-top:4px; }

.color-grid { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px; }
.color-dot { width:20px; height:20px; border-radius:4px; cursor:pointer; border:2px solid transparent; }
.color-dot.active { border-color:#fff; box-shadow:0 0 0 1px var(--accent); }

.style-btn { padding:3px 10px; font-size:11px; font-weight:600; border:1px solid var(--border); border-radius:5px; cursor:pointer; background:transparent; color:#94A3B8; font-family:inherit; }
.style-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }

#error-bar { padding:4px 10px; background:#7F1D1D; color:#FCA5A5; font-size:10px; display:none; border-top:1px solid #DC2626; max-height:60px; overflow-y:auto; font-family:'IBM Plex Mono',monospace; flex-shrink:0; }

#status { display:flex; gap:14px; padding:3px 12px; border-top:1px solid var(--border); font-size:10px; color:var(--dim); flex-shrink:0; background:var(--panel); }

.panel-label { padding:4px 10px; font-size:10px; font-weight:600; color:var(--muted); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:4px; text-transform:uppercase; letter-spacing:0.05em; }
.panel-label .dot { font-size:10px; }

input[type=number] { -moz-appearance:textfield; }
input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; }
</style>
</head>
<body>

<div id="header">
  <div class="logo">
    <div class="logo-icon">S</div>
    <span class="logo-text">StableState</span>
    <span class="badge">VSCode</span>
  </div>
  <div class="tab-group">
    <button class="tab-btn active" id="tab-diagram" onclick="switchTab('diagram')">Diagram</button>
    <button class="tab-btn" id="tab-table" onclick="switchTab('table')">Table</button>
  </div>
  <div class="toolbar" id="diagram-toolbar">
    <button class="tb active" id="tool-select" onclick="setTool('select')">Select</button>
    <button class="tb" id="tool-state" onclick="setTool('state')">+State</button>
    <button class="tb" id="tool-group" onclick="setTool('group')">+Group</button>
    <button class="tb" id="tool-initial" onclick="setTool('initial')">&#9679;Initial</button>
    <button class="tb" id="tool-final" onclick="setTool('final')">&#9678;Final</button>
    <button class="tb" id="tool-connect" onclick="setTool('connect')">&#8599;Connect</button>
    <div class="sep"></div>
    <button class="tb" id="btn-actions" onclick="toggleActions()">Actions</button>
    <button class="tb" id="btn-annotations" onclick="toggleAnnotations()">Notes</button>
    <div class="sep"></div>
    <button class="tb tb-accent" onclick="doExportSVG()">SVG</button>
    <button class="tb tb-accent" onclick="doExportPNG()">PNG</button>
    <div class="sep"></div>
    <button class="tb" onclick="setZoom(-1)">&minus;</button>
    <span id="zoom-label" style="font-size:11px;color:#94A3B8;min-width:36px;text-align:center">100%</span>
    <button class="tb" onclick="setZoom(1)">+</button>
  </div>
  <div class="toolbar" id="table-toolbar" style="display:none">
    <button class="tb" onclick="addEvent()">+Event</button>
    <div class="sep"></div>
    <button class="tb tb-accent" onclick="doExportSVG()">SVG</button>
    <button class="tb tb-accent" onclick="doExportPNG()">PNG</button>
  </div>
</div>

<div id="body">
  <div id="center-panel">
    <div id="diagram-view">
      <div class="panel-label">
        <span class="dot" style="color:var(--green)">&#9679;</span> DIAGRAM
        <span style="margin-left:auto;color:var(--dim);font-weight:400">Drag to move / resize</span>
      </div>
      <div id="diagram-area"><div id="svg-wrap"></div></div>
    </div>
    <div id="table-view">
      <div class="panel-label">
        <span class="dot" style="color:var(--green)">&#9679;</span> TABLE
        <span style="margin-left:auto;color:var(--dim);font-weight:400">Double-click cell to edit</span>
      </div>
      <div id="table-area">
        <div id="table-empty">Parse DSL to generate state transition table</div>
        <table id="state-table"></table>
      </div>
    </div>
  </div>

  <div id="prop-panel">
    <div class="panel-label"><span class="dot" style="color:var(--amber)">&#9679;</span> <span id="prop-title">Properties</span></div>
    <div id="prop-content"></div>
  </div>
</div>

<div id="error-bar"></div>

<div id="status">
  <span id="status-states">States: 0</span>
  <span id="status-transitions">Transitions: 0</span>
  <span id="status-errors">Errors: 0</span>
</div>

<script>
// ===============================================
// VSCode API
// ===============================================
var vscodeApi = acquireVsCodeApi();

// ===============================================
// State
// ===============================================
var dsl = __INITIAL_DSL__;
var parsed = null;
var currentTab = 'diagram';
var currentTool = 'select';
var showActions = false;
var selection = new Set();
function isSelected(id) { return selection.has(id); }

var annotationMode = false;
var dragState = null;
var resizeState = null;
var undoHistory = [];
var redoFuture = [];
var MAX_HISTORY = 100;
var clipboard = null;
var zoom = 1.0;
var snapGuides = [];
var suppressWebviewSync = false;

// ===============================================
// DSL accessors
// ===============================================
function getDsl() { return dsl; }
function setDsl(text) {
  dsl = text;
  if (!suppressWebviewSync) {
    vscodeApi.postMessage({ type: 'dslUpdate', dsl: dsl });
  }
}

// ===============================================
// Receive messages from VSCode
// ===============================================
window.addEventListener('message', function(e) {
  var msg = e.data;
  if (msg.type === 'dslUpdate') {
    suppressWebviewSync = true;
    dsl = msg.dsl;
    refresh();
    suppressWebviewSync = false;
  }
  if (msg.type === 'exportSVG') { doExportSVGToHost(); }
  if (msg.type === 'exportPNG') { doExportPNGToHost(); }
  // ADR-001: Extension-forwarded shortcut commands
  if (msg.type === 'undo') { undo(); }
  if (msg.type === 'redo') { redo(); }
  if (msg.type === 'copy') { copySelection(); }
  if (msg.type === 'cut') { copySelection(); deleteSelected(); }
  if (msg.type === 'paste') { pasteSelection(); }
  if (msg.type === 'selectAll') {
    if (!parsed) return;
    selection = new Set(parsed.states.map(function(s){return s.id;}).concat(parsed.pseudoStates.map(function(p){return p.id;})));
    refresh();
  }
});

// ADR-001: Clipboard event listeners for Electron/native interception
document.addEventListener('copy', function(e) {
  if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT' || document.activeElement.tagName === 'TEXTAREA')) return;
  e.preventDefault();
  copySelection();
});
document.addEventListener('cut', function(e) {
  if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT' || document.activeElement.tagName === 'TEXTAREA')) return;
  e.preventDefault();
  copySelection();
  deleteSelected();
});
document.addEventListener('paste', function(e) {
  if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT' || document.activeElement.tagName === 'TEXTAREA')) return;
  e.preventDefault();
  pasteSelection();
});

// ===============================================
// Tab Switching
// ===============================================
function switchTab(name) {
  currentTab = name;
  document.getElementById('tab-diagram').classList.toggle('active', name === 'diagram');
  document.getElementById('tab-table').classList.toggle('active', name === 'table');
  document.getElementById('diagram-view').style.display = name === 'diagram' ? 'flex' : 'none';
  document.getElementById('table-view').style.display = name === 'table' ? 'flex' : 'none';
  document.getElementById('diagram-toolbar').style.display = name === 'diagram' ? 'flex' : 'none';
  document.getElementById('table-toolbar').style.display = name === 'table' ? 'flex' : 'none';
}

// ===============================================
// Tool Selection
// ===============================================
function setTool(name) {
  currentTool = name;
  var tools = ['select','state','group','initial','final','connect'];
  tools.forEach(function(t) {
    var el = document.getElementById('tool-' + t);
    if (el) el.classList.toggle('active', t === name);
  });
}

// ===============================================
// Actions Toggle
// ===============================================
function toggleActions() {
  showActions = !showActions;
  document.getElementById('btn-actions').classList.toggle('active', showActions);
  refresh();
}

// ===============================================
// Zoom
// ===============================================
function setZoom(delta) {
  zoom = Math.max(0.25, Math.min(4, zoom + delta * 0.25));
  applyZoom();
}

function applyZoom() {
  var svgEl = document.querySelector('#svg-wrap svg');
  if (svgEl) {
    svgEl.style.transform = 'scale(' + zoom + ')';
    svgEl.style.transformOrigin = '0 0';
  }
  document.getElementById('zoom-label').textContent = Math.round(zoom * 100) + '%';
}

// ===============================================
// Parser
// ===============================================
function parseDSL(text) {
  var result = {
    canvas: { width: 960, height: 600, grid: 20 },
    config: { transition: 'local', orthogonal: false, history: false },
    states: [],
    pseudoStates: [],
    groups: [],
    regions: [],
    transitions: [],
    notes: [],
    noteConnections: [],
    errors: [],
    stateMap: {},
    pseudoMap: {},
    groupMap: {},
    noteMap: {}
  };

  var lines = text.split('\n');
  var nestingStack = [];

  for (var i = 0; i < lines.length; i++) {
    var lineNum = i + 1;
    var raw = lines[i];
    var trimmed = raw.trim();

    if (trimmed === '' || trimmed.startsWith('#')) continue;

    // Closing brace
    if (/^\}/.test(trimmed)) {
      if (nestingStack.length === 0) {
        result.errors.push({ line: lineNum, msg: 'Unexpected closing brace }' });
        continue;
      }
      var parentId = nestingStack.pop();
      var afterBrace = trimmed.slice(1).trim();
      if (afterBrace && result.stateMap[parentId]) {
        parseProps(afterBrace, result.stateMap[parentId]);
      }
      continue;
    }

    // @canvas
    var canvasMatch = trimmed.match(/^@canvas\s+(.+)$/);
    if (canvasMatch) {
      var propsStr = canvasMatch[1];
      var wm = propsStr.match(/width=(\d+)/);
      var hm = propsStr.match(/height=(\d+)/);
      var gm = propsStr.match(/grid=(\d+)/);
      if (wm) result.canvas.width = parseInt(wm[1], 10);
      if (hm) result.canvas.height = parseInt(hm[1], 10);
      if (gm) result.canvas.grid = parseInt(gm[1], 10);
      continue;
    }

    // @config
    var configMatch = trimmed.match(/^@config\s+(\w+)=(\S+)$/);
    if (configMatch) {
      var key = configMatch[1];
      var val = configMatch[2];
      if (key === 'transition') result.config.transition = val;
      else if (key === 'orthogonal') result.config.orthogonal = val === 'true';
      else if (key === 'history') result.config.history = val === 'true';
      continue;
    }

    // Pseudo-states
    var pseudoMatch = trimmed.match(/^(initial|final|choice|history|deephistory|fork|join)\s+(\S+)\s+at\s+(-?[\d.]+)\s*,\s*(-?[\d.]+)(?:\s+size\s+(-?[\d.]+)\s*x\s*(-?[\d.]+))?/);
    if (pseudoMatch) {
      var psId = pseudoMatch[2];
      if (checkDuplicate(psId, lineNum, result)) continue;
      var ps = {
        type: pseudoMatch[1],
        id: psId,
        x: parseFloat(pseudoMatch[3]),
        y: parseFloat(pseudoMatch[4]),
        w: pseudoMatch[5] ? parseFloat(pseudoMatch[5]) : null,
        h: pseudoMatch[6] ? parseFloat(pseudoMatch[6]) : null,
        parent: nestingStack.length > 0 ? nestingStack[nestingStack.length - 1] : null,
        line: lineNum
      };
      result.pseudoStates.push(ps);
      result.pseudoMap[psId] = ps;
      continue;
    }

    // state
    var stateMatch = trimmed.match(/^state\s+(\S+)\s+"([^"]*)"\s+at\s+(-?[\d.]+)\s*,\s*(-?[\d.]+)\s+size\s+(-?[\d.]+)\s*x\s*(-?[\d.]+)(.*)$/);
    if (stateMatch) {
      var stId = stateMatch[1];
      if (checkDuplicate(stId, lineNum, result)) continue;
      var rest = stateMatch[7].trim();
      var isComposite = rest.endsWith('{');
      var stPropsStr = isComposite ? rest.slice(0, -1).trim() : rest;

      var st = {
        type: 'state', id: stId, label: stateMatch[2],
        x: parseFloat(stateMatch[3]), y: parseFloat(stateMatch[4]),
        w: parseFloat(stateMatch[5]), h: parseFloat(stateMatch[6]),
        color: null, textColor: null, borderColor: null,
        round: null, style: null, entry: null, do: null, exit: null,
        parent: nestingStack.length > 0 ? nestingStack[nestingStack.length - 1] : null,
        children: [], isInitial: false, line: lineNum
      };

      if (stPropsStr) parseProps(stPropsStr, st);
      result.states.push(st);
      result.stateMap[stId] = st;

      if (st.parent && result.stateMap[st.parent]) {
        result.stateMap[st.parent].children.push(stId);
      }
      if (isComposite) nestingStack.push(stId);
      continue;
    }

    // group
    var groupMatch = trimmed.match(/^group\s+(\S+)\s+"([^"]*)"\s+at\s+(-?[\d.]+)\s*,\s*(-?[\d.]+)\s+size\s+(-?[\d.]+)\s*x\s*(-?[\d.]+)(.*)$/);
    if (groupMatch) {
      var grpId = groupMatch[1];
      if (checkDuplicate(grpId, lineNum, result)) continue;
      var grpRest = groupMatch[7].trim();
      var grp = {
        type: 'group', id: grpId, label: groupMatch[2],
        x: parseFloat(groupMatch[3]), y: parseFloat(groupMatch[4]),
        w: parseFloat(groupMatch[5]), h: parseFloat(groupMatch[6]),
        color: null, borderColor: null, textColor: null, style: null, line: lineNum
      };
      if (grpRest) parseProps(grpRest, grp);
      result.groups.push(grp);
      result.groupMap[grpId] = grp;
      continue;
    }

    // note
    var noteMatch = trimmed.match(/^note\s+(\S+)\s+"([^"]*)"\s+at\s+(-?[\d.]+)\s*,\s*(-?[\d.]+)\s+size\s+(-?[\d.]+)\s*x\s*(-?[\d.]+)(.*)$/);
    if (noteMatch) {
      var nId = noteMatch[1];
      if (checkDuplicate(nId, lineNum, result)) continue;
      var nRest = noteMatch[7].trim();
      var n = {
        type: 'note', id: nId, label: noteMatch[2],
        x: parseFloat(noteMatch[3]), y: parseFloat(noteMatch[4]),
        w: parseFloat(noteMatch[5]), h: parseFloat(noteMatch[6]),
        color: null, textColor: null, line: lineNum
      };
      if (nRest) parseProps(nRest, n);
      result.notes.push(n);
      result.noteMap[nId] = n;
      continue;
    }

    // Transition / Note connection
    var transMatch = trimmed.match(/^(\S+)\s*->\s*(\S+)(.*)$/);
    if (transMatch) {
      var from = transMatch[1];
      var to = transMatch[2];
      var tRest = transMatch[3].trim();

      if (result.noteMap[from]) {
        result.noteConnections.push({ noteId: from, targetId: to, line: lineNum });
        continue;
      }

      var event = null, guard = null, action = null, kind = null;
      if (tRest.startsWith(':')) {
        var detail = tRest.slice(1).trim();
        var kindMatch = detail.match(/@(local|external|internal)\s*$/);
        var remaining = detail;
        if (kindMatch) {
          kind = kindMatch[1];
          remaining = detail.slice(0, detail.lastIndexOf('@' + kind)).trim();
        }
        var slashIdx = remaining.indexOf('/');
        if (slashIdx !== -1) {
          action = remaining.slice(slashIdx + 1).trim() || null;
          remaining = remaining.slice(0, slashIdx).trim();
        }
        var guardMatch = remaining.match(/\[([^\]]*)\]/);
        if (guardMatch) {
          guard = guardMatch[1].trim() || null;
          remaining = remaining.slice(0, remaining.indexOf('[')).trim();
        }
        event = remaining.trim() || null;
      }

      result.transitions.push({
        from: from, to: to, event: event, guard: guard, action: action,
        kind: kind || result.config.transition,
        label: tRest.startsWith(':') ? tRest.slice(1).trim() : null,
        line: lineNum
      });
      continue;
    }

    result.errors.push({ line: lineNum, msg: 'Unrecognized syntax: ' + trimmed });
  }

  if (nestingStack.length > 0) {
    result.errors.push({ line: lines.length, msg: 'Unclosed composite state: ' + nestingStack.join(', ') });
  }

  return result;
}

function parseProps(propsStr, target) {
  var propRe = /(\w+)=(\S+)/g;
  var m;
  while ((m = propRe.exec(propsStr)) !== null) {
    switch (m[1]) {
      case 'entry': target.entry = m[2]; break;
      case 'do': target.do = m[2]; break;
      case 'exit': target.exit = m[2]; break;
      case 'color': target.color = m[2]; break;
      case 'text': target.textColor = m[2]; break;
      case 'border': target.borderColor = m[2]; break;
      case 'round': target.round = parseFloat(m[2]); break;
      case 'style': target.style = m[2]; break;
    }
  }
}

function checkDuplicate(id, lineNum, result) {
  if (result.stateMap[id] || result.pseudoMap[id] || result.groupMap[id] || result.noteMap[id]) {
    result.errors.push({ line: lineNum, msg: 'Duplicate ID: ' + id });
    return true;
  }
  return false;
}

// ===============================================
// Resolve dot-path state references
// ===============================================
function resolveStateRef(dotPath, parsed) {
  if (parsed.stateMap[dotPath]) return parsed.stateMap[dotPath];
  if (parsed.pseudoMap[dotPath]) return parsed.pseudoMap[dotPath];
  var parts = dotPath.split('.');
  var leafId = parts[parts.length - 1];
  var candidates = parsed.states.filter(function(s) { return s.id === leafId; });
  for (var ci = 0; ci < candidates.length; ci++) {
    var c = candidates[ci];
    var match = true, cur = c;
    for (var pi = parts.length - 2; pi >= 0; pi--) {
      if (!cur.parent || cur.parent !== parts[pi]) { match = false; break; }
      cur = parsed.stateMap[cur.parent];
    }
    if (match) return c;
  }
  return null;
}

// ===============================================
// Validation
// ===============================================
function validate(result) {
  var allIds = new Set(Object.keys(result.stateMap).concat(Object.keys(result.pseudoMap)));

  function refExists(ref) {
    if (allIds.has(ref)) return true;
    return resolveStateRef(ref, result) !== null;
  }

  for (var ti = 0; ti < result.transitions.length; ti++) {
    var t = result.transitions[ti];
    if (!refExists(t.from)) result.errors.push({ line: t.line, msg: 'Undefined state reference: ' + t.from });
    if (!refExists(t.to)) result.errors.push({ line: t.line, msg: 'Undefined state reference: ' + t.to });
  }

  var rootInitials = result.pseudoStates.filter(function(p) { return p.type === 'initial' && p.parent === null; });
  var rootStates = result.states.filter(function(s) { return s.parent === null; });
  if (rootStates.length > 0 && rootInitials.length === 0) {
    result.errors.push({ line: 1, msg: 'Warning: No initial pseudo-state at root level' });
  }
  for (var si = 0; si < result.states.length; si++) {
    var s = result.states[si];
    if (s.children.length > 0) {
      var childInitials = result.pseudoStates.filter(function(p) { return p.type === 'initial' && p.parent === s.id; });
      if (childInitials.length === 0) {
        result.errors.push({ line: s.line, msg: 'Warning: No initial pseudo-state inside composite state ' + s.id });
      }
    }
  }

  for (var psi = 0; psi < result.pseudoStates.length; psi++) {
    var ps = result.pseudoStates[psi];
    if (ps.type === 'initial') {
      var outgoing = result.transitions.filter(function(t) { return t.from === ps.id; });
      if (outgoing.length === 0) result.errors.push({ line: ps.line, msg: 'initial pseudo-state ' + ps.id + ' must have exactly 1 outgoing transition (has 0)' });
      else if (outgoing.length > 1) result.errors.push({ line: ps.line, msg: 'initial pseudo-state ' + ps.id + ' must have exactly 1 outgoing transition (has ' + outgoing.length + ')' });
      for (var oi = 0; oi < outgoing.length; oi++) {
        if (outgoing[oi].event) result.errors.push({ line: outgoing[oi].line, msg: 'initial pseudo-state transition must not have an event' });
        if (outgoing[oi].guard) result.errors.push({ line: outgoing[oi].line, msg: 'initial pseudo-state transition must not have a guard' });
      }
    }
    if (ps.type === 'choice') {
      var cOutgoing = result.transitions.filter(function(t) { return t.from === ps.id; });
      var guardlessCount = 0;
      for (var ci = 0; ci < cOutgoing.length; ci++) {
        if (cOutgoing[ci].event) result.errors.push({ line: cOutgoing[ci].line, msg: 'choice pseudo-state transition must not have an event' });
        if (!cOutgoing[ci].guard) guardlessCount++;
      }
      if (guardlessCount > 1) result.errors.push({ line: ps.line, msg: 'choice pseudo-state ' + ps.id + ' has ' + guardlessCount + ' guard-less transitions (max 1)' });
    }
  }

  var needsOrth = result.pseudoStates.filter(function(p) { return p.type === 'fork' || p.type === 'join'; });
  if (needsOrth.length > 0 && !result.config.orthogonal) {
    for (var ni = 0; ni < needsOrth.length; ni++) {
      result.errors.push({ line: needsOrth[ni].line, msg: 'Warning: ' + needsOrth[ni].type + ' used without @config orthogonal=true' });
    }
  }
  var needsHist = result.pseudoStates.filter(function(p) { return p.type === 'history' || p.type === 'deephistory'; });
  if (needsHist.length > 0 && !result.config.history) {
    for (var hi = 0; hi < needsHist.length; hi++) {
      result.errors.push({ line: needsHist[hi].line, msg: 'Warning: ' + needsHist[hi].type + ' used without @config history=true' });
    }
  }

  for (var vi = 0; vi < result.states.length; vi++) {
    var vs = result.states[vi];
    if (!vs.parent) continue;
    var parent = result.stateMap[vs.parent];
    if (!parent) continue;
    if (vs.x + vs.w > parent.w || vs.y + vs.h > parent.h || vs.x < 0 || vs.y < 0) {
      result.errors.push({ line: vs.line, msg: 'Warning: state ' + vs.id + ' exceeds bounds of parent ' + parent.id });
    }
  }
}

// ===============================================
// DSL Updaters
// ===============================================
function updatePos(type, id, nx, ny, d) {
  var re = new RegExp('^(\\s*' + type + '\\s+' + id + '\\s+(?:"[^"]*"\\s+)?at\\s+)[\\d.]+,[\\d.]+(.*$)', 'm');
  return d.replace(re, '$1' + nx + ',' + ny + '$2');
}

function updateSize(type, id, nw, nh, d) {
  var re = new RegExp('^(\\s*' + type + '\\s+' + id + '\\s+.*\\bsize\\s+)[\\d.]+x[\\d.]+(.*$)', 'm');
  return d.replace(re, '$1' + nw + 'x' + nh + '$2');
}

function updateProp(type, id, prop, val, d) {
  var reExist = new RegExp('^(\\s*' + type + '\\s+' + id + '\\s+.*)\\b' + prop + '=\\S+(.*$)', 'm');
  if (reExist.test(d)) {
    return d.replace(reExist, '$1' + prop + '=' + val + '$2');
  }
  var reLine = new RegExp('^(\\s*' + type + '\\s+' + id + '\\s+.+)$', 'm');
  return d.replace(reLine, function(wholeLine) {
    var te = wholeLine.trimEnd();
    if (te.endsWith('{')) return te.slice(0, -1).trimEnd() + ' ' + prop + '=' + val + ' {';
    return te + ' ' + prop + '=' + val;
  });
}

function updateLabel(type, id, newLabel, d) {
  var re = new RegExp('^(\\s*' + type + '\\s+' + id + '\\s+)"[^"]*"(.*)$', 'm');
  return d.replace(re, '$1"' + newLabel + '"$2');
}

function addTransition(from, to, event, guard, action, kind, d) {
  var defaultKind = 'local';
  var cfgM = d.match(/^@config\s+transition=(\S+)/m);
  if (cfgM) defaultKind = cfgM[1];
  var line = from + ' -> ' + to;
  var hasEvent = event != null && event !== '';
  var hasGuard = guard != null && guard !== '';
  var hasAction = action != null && action !== '';
  var hasKind = kind != null && kind !== '' && kind !== defaultKind;
  if (hasEvent || hasGuard || hasAction || hasKind) {
    line += ' :';
    if (hasEvent) line += ' ' + event;
    if (hasGuard) line += ' [' + guard + ']';
    if (hasAction) line += ' / ' + action;
    if (hasKind) line += ' @' + kind;
  }
  return d + '\n' + line;
}

function removeTransition(from, to, event, guard, d) {
  var lines = d.split('\n');
  var result = [];
  for (var i = 0; i < lines.length; i++) {
    var trimmed = lines[i].trim();
    var m = trimmed.match(/^(\S+)\s*->\s*(\S+)(.*)$/);
    if (m && m[1] === from && m[2] === to) {
      var rest = m[3].trim();
      var lineEvent = null, lineGuard = null;
      if (rest.startsWith(':')) {
        var detail = rest.slice(1).trim();
        detail = detail.replace(/@(local|external|internal)\s*$/, '').trim();
        var sidx = detail.indexOf('/');
        if (sidx !== -1) detail = detail.slice(0, sidx).trim();
        var gm = detail.match(/\[([^\]]*)\]/);
        if (gm) { lineGuard = gm[1].trim() || null; detail = detail.slice(0, detail.indexOf('[')).trim(); }
        lineEvent = detail || null;
      }
      var eMatch = (event == null || event === '') ? (lineEvent == null || lineEvent === '') : lineEvent === event;
      var gMatch = (guard == null || guard === '') ? (lineGuard == null || lineGuard === '') : lineGuard === guard;
      if (eMatch && gMatch) continue;
    }
    result.push(lines[i]);
  }
  return result.join('\n');
}

function updateTransition(from, to, event, guard, field, val, d) {
  var lines = d.split('\n');
  for (var i = 0; i < lines.length; i++) {
    var trimmed = lines[i].trim();
    var m = trimmed.match(/^(\S+)\s*->\s*(\S+)(.*)$/);
    if (!m || m[1] !== from || m[2] !== to) continue;

    var rest = m[3].trim();
    var lineEvent = null, lineGuard = null, lineAction = null, lineKind = null;
    if (rest.startsWith(':')) {
      var detail = rest.slice(1).trim();
      var km = detail.match(/@(local|external|internal)\s*$/);
      if (km) { lineKind = km[1]; detail = detail.slice(0, detail.lastIndexOf('@' + lineKind)).trim(); }
      var sidx = detail.indexOf('/');
      if (sidx !== -1) { lineAction = detail.slice(sidx + 1).trim() || null; detail = detail.slice(0, sidx).trim(); }
      var gm = detail.match(/\[([^\]]*)\]/);
      if (gm) { lineGuard = gm[1].trim() || null; detail = detail.slice(0, detail.indexOf('[')).trim(); }
      lineEvent = detail || null;
    }

    var eMatch = (event == null || event === '') ? (lineEvent == null || lineEvent === '') : lineEvent === event;
    var gMatch = (guard == null || guard === '') ? (lineGuard == null || lineGuard === '') : lineGuard === guard;
    if (!eMatch || !gMatch) continue;

    if (field === 'guard') lineGuard = val;
    else if (field === 'action') lineAction = val;
    else if (field === 'kind') lineKind = val;
    else continue;

    var defaultKind = 'local';
    var cfgM = d.match(/^@config\s+transition=(\S+)/m);
    if (cfgM) defaultKind = cfgM[1];

    var rebuilt = from + ' -> ' + to;
    var hasE = lineEvent != null && lineEvent !== '';
    var hasG = lineGuard != null && lineGuard !== '';
    var hasA = lineAction != null && lineAction !== '';
    var hasK = lineKind != null && lineKind !== '' && lineKind !== defaultKind;
    if (hasE || hasG || hasA || hasK) {
      rebuilt += ' :';
      if (hasE) rebuilt += ' ' + lineEvent;
      if (hasG) rebuilt += ' [' + lineGuard + ']';
      if (hasA) rebuilt += ' / ' + lineAction;
      if (hasK) rebuilt += ' @' + lineKind;
    }

    var leadingWs = lines[i].match(/^(\s*)/)[1];
    lines[i] = leadingWs + rebuilt;
    break;
  }
  return lines.join('\n');
}

// ===============================================
// Error Bar
// ===============================================
function updateErrorBar(result) {
  var bar = document.getElementById('error-bar');
  if (!result || result.errors.length === 0) { bar.style.display = 'none'; bar.innerHTML = ''; return; }
  bar.style.display = 'block';
  bar.innerHTML = result.errors.map(function(e) {
    return '<div>L' + e.line + ': ' + e.msg.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>';
  }).join('');
}

function esc(s) {
  return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '';
}

// ===============================================
// Coordinate Helper
// ===============================================
function getAbsolutePos(element, parsed) {
  var ox = 0, oy = 0;
  var pid = element.parent;
  while (pid) {
    var p = parsed.stateMap[pid];
    if (p) { ox += p.x; oy += p.y; pid = p.parent; } else break;
  }
  return { x: (element.x + ox) * parsed.canvas.grid, y: (element.y + oy) * parsed.canvas.grid };
}

// ===============================================
// SVG Renderer
// ===============================================
function renderSVG(parsed) {
  if (!parsed) return '';
  var canvas = parsed.canvas;
  var g = canvas.grid;
  var sans = "'IBM Plex Sans','Noto Sans JP',sans-serif";
  var mono = "'IBM Plex Mono',monospace";
  var shadow = 'filter="drop-shadow(2px 2px 4px rgba(0,0,0,0.4))"';

  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + canvas.width + '" height="' + canvas.height + '">';

  svg += '<defs><pattern id="gridPat" width="' + g + '" height="' + g + '" patternUnits="userSpaceOnUse">';
  svg += '<circle cx="' + (g/2) + '" cy="' + (g/2) + '" r="0.8" fill="#2a2a4a"/></pattern></defs>';
  svg += '<rect width="' + canvas.width + '" height="' + canvas.height + '" fill="#1a1a2e"/>';
  svg += '<rect width="' + canvas.width + '" height="' + canvas.height + '" fill="url(#gridPat)"/>';

  // Groups
  for (var gi = 0; gi < parsed.groups.length; gi++) {
    var grp = parsed.groups[gi];
    var px = grp.x * g, py = grp.y * g, pw = grp.w * g, ph = grp.h * g;
    var fill = grp.color || '#1a1a3e';
    var border = grp.borderColor || '#3a3a5a';
    var textClr = grp.textColor || '#888888';
    svg += '<rect x="' + px + '" y="' + py + '" width="' + pw + '" height="' + ph + '" rx="6" ry="6" fill="' + esc(fill) + '" fill-opacity="0.3" stroke="' + esc(border) + '" stroke-width="1"/>';
    svg += '<text x="' + (px + 10) + '" y="' + (py + 16) + '" font-family="' + sans + '" font-size="11" font-weight="600" fill="' + esc(textClr) + '">' + esc(grp.label) + '</text>';
  }

  // Composite states
  var composites = parsed.states.filter(function(s) { return s.children.length > 0; });
  for (var ci = 0; ci < composites.length; ci++) {
    var st = composites[ci];
    var pos = getAbsolutePos(st, parsed);
    var pw = st.w * g, ph = st.h * g;
    var fill = st.color || 'rgba(99,102,241,0.08)';
    var border = st.borderColor || '#6366F1';
    var textClr = st.textColor || '#e0e0e0';
    var round = st.round != null ? st.round : 10;
    var sel = isSelected(st.id);
    var strokeClr = sel ? 'white' : border;
    var strokeW = sel ? 2.5 : 1.5;
    var dashAttr = st.style === 'dashed' ? ' stroke-dasharray="6 3"' : '';
    svg += '<rect x="' + pos.x + '" y="' + pos.y + '" width="' + pw + '" height="' + ph + '" rx="' + round + '" ry="' + round + '" fill="' + esc(fill) + '" stroke="' + esc(strokeClr) + '" stroke-width="' + strokeW + '"' + dashAttr + ' ' + shadow + '/>';
    svg += '<text x="' + (pos.x + 10) + '" y="' + (pos.y + 18) + '" font-family="' + sans + '" font-size="12" font-weight="600" fill="' + esc(textClr) + '">' + esc(st.label) + '</text>';
    if (showActions && (st.entry || st.do || st.exit)) {
      var ay = pos.y + 32;
      if (st.entry) { svg += '<text x="' + (pos.x + 10) + '" y="' + ay + '" font-family="' + mono + '" font-size="10" fill="#888888">entry / ' + esc(st.entry) + '</text>'; ay += 14; }
      if (st.do) { svg += '<text x="' + (pos.x + 10) + '" y="' + ay + '" font-family="' + mono + '" font-size="10" fill="#888888">do / ' + esc(st.do) + '</text>'; ay += 14; }
      if (st.exit) { svg += '<text x="' + (pos.x + 10) + '" y="' + ay + '" font-family="' + mono + '" font-size="10" fill="#888888">exit / ' + esc(st.exit) + '</text>'; }
    }
  }

  // Leaf states
  var leaves = parsed.states.filter(function(s) { return s.children.length === 0; });
  for (var li = 0; li < leaves.length; li++) {
    var st = leaves[li];
    var pos = getAbsolutePos(st, parsed);
    var pw = st.w * g, ph = st.h * g;
    var fill = st.color || '#1e293b';
    var border = st.borderColor || '#818CF8';
    var textClr = st.textColor || '#e0e0e0';
    var round = st.round != null ? st.round : 10;
    var sel = isSelected(st.id);
    var strokeClr = sel ? 'white' : border;
    var strokeW = sel ? 2.5 : 1.5;
    var dashAttr = st.style === 'dashed' ? ' stroke-dasharray="6 3"' : '';
    var hasAct = showActions && (st.entry || st.do || st.exit);
    svg += '<rect x="' + pos.x + '" y="' + pos.y + '" width="' + pw + '" height="' + ph + '" rx="' + round + '" ry="' + round + '" fill="' + esc(fill) + '" stroke="' + esc(strokeClr) + '" stroke-width="' + strokeW + '"' + dashAttr + ' ' + shadow + '/>';
    if (hasAct) {
      svg += '<text x="' + (pos.x + pw/2) + '" y="' + (pos.y + 20) + '" text-anchor="middle" font-family="' + sans + '" font-size="13" font-weight="600" fill="' + esc(textClr) + '">' + esc(st.label) + '</text>';
      var sepY = pos.y + 28;
      svg += '<line x1="' + (pos.x + 4) + '" y1="' + sepY + '" x2="' + (pos.x + pw - 4) + '" y2="' + sepY + '" stroke="' + esc(border) + '" stroke-width="0.5" opacity="0.5"/>';
      var ay = sepY + 16;
      if (st.entry) { svg += '<text x="' + (pos.x + 8) + '" y="' + ay + '" font-family="' + mono + '" font-size="10" fill="#888888">entry / ' + esc(st.entry) + '</text>'; ay += 14; }
      if (st.do) { svg += '<text x="' + (pos.x + 8) + '" y="' + ay + '" font-family="' + mono + '" font-size="10" fill="#888888">do / ' + esc(st.do) + '</text>'; ay += 14; }
      if (st.exit) { svg += '<text x="' + (pos.x + 8) + '" y="' + ay + '" font-family="' + mono + '" font-size="10" fill="#888888">exit / ' + esc(st.exit) + '</text>'; }
    } else {
      svg += '<text x="' + (pos.x + pw/2) + '" y="' + (pos.y + ph/2 + 5) + '" text-anchor="middle" font-family="' + sans + '" font-size="13" font-weight="600" fill="' + esc(textClr) + '">' + esc(st.label) + '</text>';
    }
  }

  // Pseudo-states
  for (var psi = 0; psi < parsed.pseudoStates.length; psi++) {
    var ps = parsed.pseudoStates[psi];
    var pos = getAbsolutePos(ps, parsed);

      case 'initial': svg += '<circle cx="' + pos.x + '" cy="' + pos.y + '" r="10" fill="#e0e0e0" ' + shadow + '/>'; break;
      case 'final': svg += '<circle cx="' + pos.x + '" cy="' + pos.y + '" r="12" fill="none" stroke="#e0e0e0" stroke-width="2" ' + shadow + '/>'; svg += '<circle cx="' + pos.x + '" cy="' + pos.y + '" r="7" fill="#e0e0e0"/>'; break;
      case 'choice': svg += '<polygon points="' + pos.x + ',' + (pos.y-10) + ' ' + (pos.x+10) + ',' + pos.y + ' ' + pos.x + ',' + (pos.y+10) + ' ' + (pos.x-10) + ',' + pos.y + '" fill="#1e293b" stroke="#818CF8" stroke-width="1.5" ' + shadow + '/>'; break;
      case 'history': svg += '<circle cx="' + pos.x + '" cy="' + pos.y + '" r="16" fill="#1e293b" stroke="#818CF8" stroke-width="1.5" ' + shadow + '/>'; svg += '<text x="' + pos.x + '" y="' + (pos.y + 5) + '" text-anchor="middle" font-family="' + sans + '" font-size="14" font-weight="700" fill="#e0e0e0">H</text>'; break;
      case 'deephistory': svg += '<circle cx="' + pos.x + '" cy="' + pos.y + '" r="16" fill="#1e293b" stroke="#818CF8" stroke-width="1.5" ' + shadow + '/>'; svg += '<text x="' + pos.x + '" y="' + (pos.y + 5) + '" text-anchor="middle" font-family="' + sans + '" font-size="14" font-weight="700" fill="#e0e0e0">H*</text>'; break;
      case 'fork': case 'join': var pw = ps.w != null ? ps.w * g : 6; var ph = ps.h != null ? ps.h * g : 40; svg += '<rect x="' + (pos.x - pw/2) + '" y="' + (pos.y - ph/2) + '" width="' + pw + '" height="' + ph + '" rx="2" ry="2" fill="#e0e0e0" ' + shadow + '/>'; break;
    }
  }

  // Arrow marker
  svg += '<defs><marker id="arrowHead" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">';
  svg += '<path d="M0,0 L10,4 L0,8 Z" fill="#89DDFF"/></marker></defs>';

  // Transition helpers (defined inside renderSVG for access to parsed/g)
  function getBox(ref) {
    var el = resolveStateRef(ref, parsed);
    if (!el) return null;
    var pos = getAbsolutePos(el, parsed);
    if (el.type === 'state') return { x: pos.x, y: pos.y, w: el.w * g, h: el.h * g };
    switch (el.type) {
      case 'initial': return { x: pos.x - 10, y: pos.y - 10, w: 20, h: 20 };
      case 'final': return { x: pos.x - 12, y: pos.y - 12, w: 24, h: 24 };
      case 'choice': return { x: pos.x - 12, y: pos.y - 12, w: 24, h: 24 };
      case 'history': case 'deephistory': return { x: pos.x - 16, y: pos.y - 16, w: 32, h: 32 };
      case 'fork': case 'join': var bw = el.w != null ? el.w * g : 6; var bh = el.h != null ? el.h * g : 40; return { x: pos.x - bw/2, y: pos.y - bh/2, w: bw, h: bh };
      default: return { x: pos.x - 10, y: pos.y - 10, w: 20, h: 20 };
    }
  }

  function computePortSide(srcBox, tgtBox) {
    var gapR = tgtBox.x - (srcBox.x + srcBox.w);
    var gapL = srcBox.x - (tgtBox.x + tgtBox.w);
    var gapB = tgtBox.y - (srcBox.y + srcBox.h);
    var gapT = srcBox.y - (tgtBox.y + tgtBox.h);
    var hBest = Math.max(gapR, gapL);
    var vBest = Math.max(gapB, gapT);
    if (vBest >= hBest) {
      return gapB >= gapT
        ? { srcSide: 'bottom', tgtSide: 'top' }
        : { srcSide: 'top', tgtSide: 'bottom' };
    } else {
      return gapR >= gapL
        ? { srcSide: 'right', tgtSide: 'left' }
        : { srcSide: 'left', tgtSide: 'right' };
    }
  }

  function getPortPoint(box, side, portIndex, portCount) {
    var pad = portCount <= 2 ? 0.4 : portCount <= 4 ? 0.25 : 0.15;
    var t = portCount <= 1 ? 0.5 : pad + (1 - 2 * pad) * portIndex / (portCount - 1);
    switch (side) {
      case 'top': return { x: box.x + box.w * t, y: box.y };
      case 'bottom': return { x: box.x + box.w * t, y: box.y + box.h };
      case 'left': return { x: box.x, y: box.y + box.h * t };
      case 'right': return { x: box.x + box.w, y: box.y + box.h * t };
    }
    return { x: box.x + box.w/2, y: box.y + box.h/2 };
  }

  function buildRoute(fromPt, toPt, fromSide, toSide) {
    var pts = [fromPt]; var margin = 20;
    if (fromSide === 'right' && toSide === 'left') { if (Math.abs(fromPt.y - toPt.y) < 2) pts.push(toPt); else { var mx = (fromPt.x + toPt.x)/2; pts.push({x:mx,y:fromPt.y},{x:mx,y:toPt.y},toPt); } }
    else if (fromSide === 'left' && toSide === 'right') { if (Math.abs(fromPt.y - toPt.y) < 2) pts.push(toPt); else { var mx = (fromPt.x + toPt.x)/2; pts.push({x:mx,y:fromPt.y},{x:mx,y:toPt.y},toPt); } }
    else if (fromSide === 'bottom' && toSide === 'top') { if (Math.abs(fromPt.x - toPt.x) < 2) pts.push(toPt); else { var my = (fromPt.y + toPt.y)/2; pts.push({x:fromPt.x,y:my},{x:toPt.x,y:my},toPt); } }
    else if (fromSide === 'top' && toSide === 'bottom') { if (Math.abs(fromPt.x - toPt.x) < 2) pts.push(toPt); else { var my = (fromPt.y + toPt.y)/2; pts.push({x:fromPt.x,y:my},{x:toPt.x,y:my},toPt); } }
    else if (fromSide === 'right' && toSide === 'right') { var ox = Math.max(fromPt.x, toPt.x) + margin; pts.push({x:ox,y:fromPt.y},{x:ox,y:toPt.y},toPt); }
    else if (fromSide === 'left' && toSide === 'left') { var ox = Math.min(fromPt.x, toPt.x) - margin; pts.push({x:ox,y:fromPt.y},{x:ox,y:toPt.y},toPt); }
    else if (fromSide === 'top' && toSide === 'top') { var oy = Math.min(fromPt.y, toPt.y) - margin; pts.push({x:fromPt.x,y:oy},{x:toPt.x,y:oy},toPt); }
    else if (fromSide === 'bottom' && toSide === 'bottom') { var oy = Math.max(fromPt.y, toPt.y) + margin; pts.push({x:fromPt.x,y:oy},{x:toPt.x,y:oy},toPt); }
    else if ((fromSide === 'right' || fromSide === 'left') && (toSide === 'top' || toSide === 'bottom')) { pts.push({x:toPt.x,y:fromPt.y},toPt); }
    else if ((fromSide === 'top' || fromSide === 'bottom') && (toSide === 'right' || toSide === 'left')) { pts.push({x:fromPt.x,y:toPt.y},toPt); }
    else { pts.push({x:toPt.x,y:fromPt.y},toPt); }
    return pts;
  }

  function buildSelfRoute(box) {
    var m = 30;
    return [{x:box.x+box.w,y:box.y+box.h/2},{x:box.x+box.w+m,y:box.y+box.h/2},{x:box.x+box.w+m,y:box.y-m},{x:box.x+box.w/2,y:box.y-m},{x:box.x+box.w/2,y:box.y}];
  }

  function segmentIntersection(a1, a2, b1, b2) {
    var d1x = a2.x-a1.x, d1y = a2.y-a1.y, d2x = b2.x-b1.x, d2y = b2.y-b1.y;
    var cross = d1x*d2y - d1y*d2x;
    if (Math.abs(cross) < 0.001) return null;
    var t = ((b1.x-a1.x)*d2y - (b1.y-a1.y)*d2x) / cross;
    var u = ((b1.x-a1.x)*d1y - (b1.y-a1.y)*d1x) / cross;
    if (t >= 0.01 && t <= 0.99 && u >= 0.01 && u <= 0.99) return { x: a1.x+t*d1x, y: a1.y+t*d1y };
    return null;
  }

  function routeMidpoint(points) {
    var totalLen = 0;
    for (var i = 1; i < points.length; i++) totalLen += Math.hypot(points[i].x-points[i-1].x, points[i].y-points[i-1].y);
    var target = totalLen/2, acc = 0;
    for (var i = 1; i < points.length; i++) {
      var segLen = Math.hypot(points[i].x-points[i-1].x, points[i].y-points[i-1].y);
      if (acc + segLen >= target) { var t = segLen > 0 ? (target-acc)/segLen : 0; return { x: points[i-1].x+t*(points[i].x-points[i-1].x), y: points[i-1].y+t*(points[i].y-points[i-1].y) }; }
      acc += segLen;
    }
    return points[Math.floor(points.length/2)];
  }

  var allRoutes = [];
  var srcPortGroups = {}, tgtPortGroups = {}, transitionSides = [];

  for (var ti = 0; ti < parsed.transitions.length; ti++) {
    var tr = parsed.transitions[ti];
    var srcBox = getBox(tr.from), tgtBox = getBox(tr.to);
    if (!srcBox || !tgtBox) { transitionSides.push(null); continue; }
    var isSelf = tr.from === tr.to;
    var srcSide, tgtSide;
    if (isSelf) { srcSide = 'right'; tgtSide = 'top'; }
    else { var sides = computePortSide(srcBox, tgtBox); srcSide = sides.srcSide; tgtSide = sides.tgtSide; }
    transitionSides.push({ srcSide: srcSide, tgtSide: tgtSide, srcBox: srcBox, tgtBox: tgtBox, isSelf: isSelf });
    var srcKey = tr.from + ':' + srcSide, tgtKey = tr.to + ':' + tgtSide;
    if (!srcPortGroups[srcKey]) srcPortGroups[srcKey] = [];
    srcPortGroups[srcKey].push(ti);
    if (!tgtPortGroups[tgtKey]) tgtPortGroups[tgtKey] = [];
    tgtPortGroups[tgtKey].push(ti);
  }

  for (var ti = 0; ti < parsed.transitions.length; ti++) {
    var tr = parsed.transitions[ti];
    var info = transitionSides[ti];
    if (!info) continue;
    var route;
    if (info.isSelf) { route = buildSelfRoute(info.srcBox); }
    else {
      var srcKey = tr.from + ':' + info.srcSide, tgtKey = tr.to + ':' + info.tgtSide;
      var srcGroup = srcPortGroups[srcKey], tgtGroup = tgtPortGroups[tgtKey];
      var fromPt = getPortPoint(info.srcBox, info.srcSide, srcGroup.indexOf(ti), srcGroup.length);
      var toPt = getPortPoint(info.tgtBox, info.tgtSide, tgtGroup.indexOf(ti), tgtGroup.length);
      route = buildRoute(fromPt, toPt, info.srcSide, info.tgtSide);
    }

    var bridgeR = 6, crossings = [];
    for (var si = 0; si < route.length - 1; si++) {
      var a1 = route[si], a2 = route[si+1];
      for (var ri = 0; ri < allRoutes.length; ri++) {
        var prevRoute = allRoutes[ri];
        for (var pi = 0; pi < prevRoute.length - 1; pi++) {
          var hit = segmentIntersection(a1, a2, prevRoute[pi], prevRoute[pi+1]);
          if (hit) {
            var isHoriz = Math.abs(a2.y-a1.y) < Math.abs(a2.x-a1.x);
            if (isHoriz) { var segLen = Math.hypot(a2.x-a1.x, a2.y-a1.y); crossings.push({ segIdx: si, x: hit.x, y: hit.y, t: segLen > 0 ? Math.hypot(hit.x-a1.x, hit.y-a1.y)/segLen : 0 }); }
          }
        }
      }
    }
    crossings.sort(function(a, b) { return a.segIdx !== b.segIdx ? a.segIdx - b.segIdx : a.t - b.t; });

    if (crossings.length === 0) {
      svg += '<polyline points="' + route.map(function(p) { return p.x+','+p.y; }).join(' ') + '" fill="none" stroke="#89DDFF" stroke-width="1.5" marker-end="url(#arrowHead)"/>';
    } else {
      var d = 'M ' + route[0].x + ',' + route[0].y;
      for (var si = 0; si < route.length - 1; si++) {
        var segCr = crossings.filter(function(c) { return c.segIdx === si; });
        if (segCr.length === 0) { d += ' L ' + route[si+1].x + ',' + route[si+1].y; }
        else { for (var ci = 0; ci < segCr.length; ci++) { d += ' L ' + (segCr[ci].x-bridgeR) + ',' + segCr[ci].y + ' A ' + bridgeR + ',' + bridgeR + ' 0 0,1 ' + (segCr[ci].x+bridgeR) + ',' + segCr[ci].y; } d += ' L ' + route[si+1].x + ',' + route[si+1].y; }
      }
      svg += '<path d="' + d + '" fill="none" stroke="#89DDFF" stroke-width="1.5" marker-end="url(#arrowHead)"/>';
    }
    allRoutes.push(route);

    if (tr.event || tr.guard || tr.action) {
      var mid = routeMidpoint(route);
      if (tr.event) svg += '<text x="' + mid.x + '" y="' + (mid.y-8) + '" text-anchor="middle" font-family="' + sans + '" font-size="10" fill="#FFCB6B">' + esc(tr.event) + '</text>';
      var ga = [];
      if (tr.guard) ga.push('[' + tr.guard + ']');
      if (tr.action) ga.push('/ ' + tr.action);
      if (ga.length > 0) { var gaY = tr.event ? mid.y - 20 : mid.y - 8; svg += '<text x="' + mid.x + '" y="' + gaY + '" text-anchor="middle" font-family="' + sans + '" font-size="9" fill="#C3E88D">' + esc(ga.join(' ')) + '</text>'; }
    }
  }

  // Note connections
  if (annotationMode) {
    for (var nci = 0; nci < parsed.noteConnections.length; nci++) {
      var nc = parsed.noteConnections[nci];
      var noteEl = parsed.noteMap[nc.noteId]; if (!noteEl) continue;
      var tgtBox = getBox(nc.targetId); if (!tgtBox) continue;
      var notePos = getAbsolutePos(noteEl, parsed);
      var noteBox = { x: notePos.x, y: notePos.y, w: noteEl.w * g, h: noteEl.h * g };
      var sides = computePortSide(noteBox, tgtBox);
      var fromPt = getPortPoint(noteBox, sides.srcSide, 0, 1);
      var toPt = getPortPoint(tgtBox, sides.tgtSide, 0, 1);
      var route = buildRoute(fromPt, toPt, sides.srcSide, sides.tgtSide);
      svg += '<polyline points="' + route.map(function(p) { return p.x+','+p.y; }).join(' ') + '" fill="none" stroke="#FCD34D" stroke-width="1" stroke-dasharray="6,3"/>';
    }
  }

  // Notes (rendered ABOVE transitions and note connections)
  if (annotationMode && parsed.notes.length > 0) {
    for (var ni = 0; ni < parsed.notes.length; ni++) {
      var n = parsed.notes[ni];
      var pos = getAbsolutePos(n, parsed);
      var pw = n.w * g, ph = n.h * g;
      var fill = n.color || '#FEF3C7';
      var borderClr = n.borderColor || '#D97706';
      var textClr = n.textColor || '#92400E';
      var sel = isSelected(n.id);
      var strokeClr = sel ? '#F59E0B' : borderClr;
      var strokeW = sel ? 2.5 : 1;
      svg += '<rect x="' + pos.x + '" y="' + pos.y + '" width="' + pw + '" height="' + ph + '" rx="0" ry="0" fill="' + esc(fill) + '" stroke="' + esc(strokeClr) + '" stroke-width="' + strokeW + '" stroke-dasharray="4,2" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.08))"/>';
      var lines = n.label.split('\\n');
      for (var li = 0; li < lines.length; li++) {
        var ty = pos.y + 6 + li * 14 + 10;
        svg += '<text x="' + (pos.x + 6) + '" y="' + ty + '" text-anchor="start" font-family="' + sans + '" font-size="11" font-weight="400" fill="' + esc(textClr) + '" style="pointer-events:none">' + esc(lines[li]) + '</text>';
      }
    }
  }

  // Annotation mode indicator banner
  if (annotationMode) {
    svg += '<g id="annotation-banner">';
    svg += '<rect x="0" y="0" width="' + canvas.width + '" height="24" fill="#F59E0B" fill-opacity="0.15"/>';
    svg += '<text x="' + (canvas.width/2) + '" y="16" text-anchor="middle" font-family="' + sans + '" font-size="11" font-weight="600" fill="#F59E0B">ANNOTATION MODE — states are locked, press N to exit</text>';
    svg += '</g>';
  }

  // Resize handles
  if (selection.size === 1) {
    var selId = Array.from(selection)[0];
    var selEl = parsed.stateMap[selId] || parsed.groupMap[selId] || parsed.noteMap[selId];
    if (selEl && selEl.w != null && selEl.h != null) {
      var pos = getAbsolutePos(selEl, parsed);
      var pw = selEl.w * g, ph = selEl.h * g, hs = 6;
      var handles = [{name:'nw',cx:pos.x,cy:pos.y},{name:'n',cx:pos.x+pw/2,cy:pos.y},{name:'ne',cx:pos.x+pw,cy:pos.y},{name:'e',cx:pos.x+pw,cy:pos.y+ph/2},{name:'se',cx:pos.x+pw,cy:pos.y+ph},{name:'s',cx:pos.x+pw/2,cy:pos.y+ph},{name:'sw',cx:pos.x,cy:pos.y+ph},{name:'w',cx:pos.x,cy:pos.y+ph/2}];
      for (var hi = 0; hi < handles.length; hi++) { var h = handles[hi]; svg += '<rect x="' + (h.cx-hs) + '" y="' + (h.cy-hs) + '" width="' + (hs*2) + '" height="' + (hs*2) + '" fill="#818CF8" stroke="#fff" stroke-width="1" rx="1" data-handle="' + h.name + '" style="cursor:pointer"/>'; }
    }
  }

  // Snap guides
  if (snapGuides && snapGuides.length > 0) {
    for (var sgi = 0; sgi < snapGuides.length; sgi++) {
      var sg = snapGuides[sgi];
      if (sg.axis === 'x') svg += '<line x1="' + sg.pos + '" y1="0" x2="' + sg.pos + '" y2="' + canvas.height + '" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>';
      else svg += '<line x1="0" y1="' + sg.pos + '" x2="' + canvas.width + '" y2="' + sg.pos + '" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>';
    }
  }

  svg += '</svg>';
  return svg;
}

// ===============================================
// Table Renderer
// ===============================================
function renderTable(p) {
  var tableEl = document.getElementById('state-table');
  var emptyEl = document.getElementById('table-empty');
  if (!p || !tableEl) return;
  if (p.config.orthogonal) { tableEl.innerHTML = ''; emptyEl.style.display = 'flex'; emptyEl.textContent = 'Orthogonal regions enabled - table not supported'; return; }

  var leafColumns = [];
  var initialTargets = new Set();
  for (var ti = 0; ti < p.transitions.length; ti++) {
    var t = p.transitions[ti];
    var fromEl = p.pseudoMap[t.from];
    if (fromEl && fromEl.type === 'initial') { var tgt = resolveStateRef(t.to, p); if (tgt) initialTargets.add(tgt.id); }
  }

  function walkState(st, depth) {
    if (st.children.length === 0) { leafColumns.push({ id: st.id, state: st, depth: depth, isInitial: initialTargets.has(st.id) }); }
    else { for (var ci = 0; ci < st.children.length; ci++) { var child = p.stateMap[st.children[ci]]; if (child) walkState(child, depth+1); } }
  }
  var rootStates = p.states.filter(function(s) { return s.parent === null; });
  for (var ri = 0; ri < rootStates.length; ri++) walkState(rootStates[ri], 0);

  if (leafColumns.length === 0) { tableEl.innerHTML = ''; emptyEl.style.display = 'flex'; emptyEl.textContent = 'Parse DSL to generate table'; return; }
  emptyEl.style.display = 'none';

  var maxDepth = 0;
  for (var i = 0; i < leafColumns.length; i++) { if (leafColumns[i].depth > maxDepth) maxDepth = leafColumns[i].depth; }

  var ancestries = leafColumns.map(function(lc) {
    var chain = []; var cur = lc.state;
    while (cur.parent) { var pp = p.stateMap[cur.parent]; if (pp) { chain.unshift(pp); cur = pp; } else break; }
    while (chain.length < maxDepth) chain.push(null);
    return chain;
  });

  var headerRows = [];
  for (var d = 0; d <= maxDepth; d++) headerRows.push([]);
  for (var d = 0; d < maxDepth; d++) {
    var cur = null, span = 0;
    for (var ci = 0; ci < leafColumns.length; ci++) {
      var anc = ancestries[ci][d]; var ancId = anc ? anc.id : null;
      if (ancId === cur) { span++; }
      else { if (span > 0) { var prevAnc = ci > 0 ? ancestries[ci-1][d] : null; headerRows[d].push({ label: prevAnc ? prevAnc.label : '', colspan: span }); } cur = ancId; span = 1; }
    }
    if (span > 0) { var lastAnc = ancestries[leafColumns.length-1][d]; headerRows[d].push({ label: lastAnc ? lastAnc.label : '', colspan: span }); }
  }
  headerRows[maxDepth] = leafColumns.map(function(lc) { return { label: (lc.isInitial ? '>' : '') + lc.state.label, colspan: 1 }; });

  var eventSet = new Map();
  for (var ti = 0; ti < p.transitions.length; ti++) {
    var t = p.transitions[ti];
    var fromEl = p.pseudoMap[t.from];
    if (fromEl && fromEl.type === 'initial') continue;
    var evName = t.event || '(none)';
    if (!eventSet.has(evName)) eventSet.set(evName, []);
    eventSet.get(evName).push(t);
  }

  var thtml = '<thead>';
  for (var d = 0; d < maxDepth; d++) { thtml += '<tr><th></th>'; for (var ci = 0; ci < headerRows[d].length; ci++) { thtml += '<th colspan="' + headerRows[d][ci].colspan + '">' + esc(headerRows[d][ci].label) + '</th>'; } thtml += '</tr>'; }
  thtml += '<tr><th></th>';
  for (var ci = 0; ci < headerRows[maxDepth].length; ci++) { thtml += '<th>' + esc(headerRows[maxDepth][ci].label) + '</th>'; }
  thtml += '</tr></thead><tbody>';

  ['entry', 'do', 'exit'].forEach(function(field) {
    thtml += '<tr><td style="font-weight:600;color:var(--accent)">' + field + '</td>';
    for (var ci = 0; ci < leafColumns.length; ci++) { var val = leafColumns[ci].state[field] || '-'; thtml += '<td class="table-editable" data-field="' + field + '" data-state="' + leafColumns[ci].id + '" style="cursor:pointer">' + esc(val) + '</td>'; }
    thtml += '</tr>';
  });

  thtml += '<tr><td colspan="' + (leafColumns.length+1) + '" style="border:none;height:4px;background:var(--accent);padding:0"></td></tr>';

  eventSet.forEach(function(transitions, evName) {
    thtml += '<tr><td rowspan="4" style="font-weight:600;color:#FFCB6B;vertical-align:top">' + esc(evName) + '</td>';
    for (var ci = 0; ci < leafColumns.length; ci++) thtml += '<td></td>';
    thtml += '</tr>';
    thtml += '<tr>';
    for (var ci = 0; ci < leafColumns.length; ci++) {
      var lc = leafColumns[ci];
      var matching = transitions.filter(function(t) { var fromEl = resolveStateRef(t.from, p); return fromEl && fromEl.id === lc.id; });
      var val = matching.length > 0 && matching[0].guard ? matching[0].guard : '-';
      thtml += '<td class="table-editable" data-field="guard" data-state="' + lc.id + '" data-event="' + esc(evName) + '" style="cursor:pointer;color:#C3E88D">' + esc(val) + '</td>';
    }
    thtml += '</tr><tr>';
    for (var ci = 0; ci < leafColumns.length; ci++) {
      var lc = leafColumns[ci];
      var matching = transitions.filter(function(t) { var fromEl = resolveStateRef(t.from, p); return fromEl && fromEl.id === lc.id; });
      var val = matching.length > 0 && matching[0].action ? matching[0].action : '-';
      thtml += '<td class="table-editable" data-field="action" data-state="' + lc.id + '" data-event="' + esc(evName) + '" style="cursor:pointer;color:#C3E88D">' + esc(val) + '</td>';
    }
    thtml += '</tr><tr>';
    for (var ci = 0; ci < leafColumns.length; ci++) {
      var lc = leafColumns[ci];
      var matching = transitions.filter(function(t) { var fromEl = resolveStateRef(t.from, p); return fromEl && fromEl.id === lc.id; });
      var val = '-';
      if (matching.length > 0) { var tgtEl = resolveStateRef(matching[0].to, p); val = tgtEl ? (tgtEl.label || tgtEl.id) : matching[0].to; }
      thtml += '<td class="table-editable" data-field="target" data-state="' + lc.id + '" data-event="' + esc(evName) + '" style="cursor:pointer">' + esc(val) + '</td>';
    }
    thtml += '</tr>';
  });

  thtml += '</tbody>';
  tableEl.innerHTML = thtml;

  // Wire up double-click editing for table cells
  tableEl.querySelectorAll('.table-editable').forEach(function(cell) {
    cell.addEventListener('dblclick', function() {
      var field = this.dataset.field;
      var stateId = this.dataset.state;
      var evName = this.dataset.event;
      var currentText = this.textContent === '-' ? '' : this.textContent;
      var input = document.createElement('input');
      input.type = 'text'; input.value = currentText; input.className = 'prop-input';
      input.style.cssText = 'width:100%;margin:0;padding:2px 4px;font-size:12px;';
      this.textContent = ''; this.appendChild(input); input.focus(); input.select();

      var commitEdit = function() {
        var newVal = input.value.trim(); input.remove();
        if (field === 'entry' || field === 'do' || field === 'exit') {
          pushHistory(); var d = getDsl();
          if (newVal) d = updateProp('state', stateId, field, newVal, d);
          else { var re = new RegExp('(^\\s*state\\s+' + stateId + '\\s+.*)\\b' + field + '=\\S+', 'm'); d = d.replace(re, '$1'); }
          setDsl(d); refresh();
        } else if ((field === 'guard' || field === 'action') && parsed) {
          var mt = parsed.transitions.filter(function(t) { var fe = resolveStateRef(t.from, parsed); return fe && fe.id === stateId && (t.event || '(none)') === evName; });
          if (mt.length > 0) { pushHistory(); var d = getDsl(); d = updateTransition(mt[0].from, mt[0].to, mt[0].event, mt[0].guard, field, newVal || null, d); setDsl(d); refresh(); }
        } else if (field === 'target' && parsed) {
          var mt = parsed.transitions.filter(function(t) { var fe = resolveStateRef(t.from, parsed); return fe && fe.id === stateId && (t.event || '(none)') === evName; });
          if (newVal && (!currentText || currentText === '-') && mt.length === 0) {
            var targetId = null; for (var si = 0; si < parsed.states.length; si++) { if (parsed.states[si].label === newVal || parsed.states[si].id === newVal) { targetId = parsed.states[si].id; break; } }
            if (targetId) { pushHistory(); var d = getDsl(); d = addTransition(stateId, targetId, evName === '(none)' ? null : evName, null, null, null, d); setDsl(d); refresh(); }
          } else if ((!newVal || newVal === '-') && mt.length > 0) {
            pushHistory(); var d = getDsl(); d = removeTransition(mt[0].from, mt[0].to, mt[0].event, mt[0].guard, d); setDsl(d); refresh();
          } else if (newVal && mt.length > 0) {
            var targetId = null; for (var si = 0; si < parsed.states.length; si++) { if (parsed.states[si].label === newVal || parsed.states[si].id === newVal) { targetId = parsed.states[si].id; break; } }
            if (targetId) { pushHistory(); var d = getDsl(); d = removeTransition(mt[0].from, mt[0].to, mt[0].event, mt[0].guard, d); d = addTransition(mt[0].from, targetId, evName === '(none)' ? mt[0].event : evName, mt[0].guard, mt[0].action, mt[0].kind, d); setDsl(d); refresh(); }
          }
        }
      };
      input.addEventListener('blur', commitEdit);
      input.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } if (e.key === 'Escape') { input.value = currentText; input.blur(); } });
    });
  });
}

// ===============================================
// Property Panel
// ===============================================
function renderProps() {
  if (!parsed) return;
  var panel = document.getElementById('prop-content');
  var html = '';
  var selArr = Array.from(selection);

  if (selArr.length === 0) {
    if (annotationMode) {
      html += '<div class="prop-section"><div class="prop-label">Annotation Mode</div>';
      html += '<div class="prop-sub">Click notes to select. States are locked.</div>';
      html += '</div>';
    } else {
      html += '<div class="prop-section"><div class="prop-label">Selected</div><div class="prop-sub">Select an element to edit</div></div>';
    }
  } else if (selArr.length === 1) {
    var id = selArr[0];
    if (parsed.stateMap[id]) {
      var st = parsed.stateMap[id];
      html += '<div class="prop-section"><div class="prop-label">State</div>';
      html += '<div class="prop-row"><input class="prop-input" value="' + esc(st.id) + '" readonly style="opacity:0.6"></div>';
      html += '<div class="prop-row"><input class="prop-input" id="pp-label" value="' + esc(st.label) + '" placeholder="Label"></div></div>';
      html += '<div class="prop-section"><div class="prop-label">Position</div>';
      html += '<div class="prop-row"><input type="number" class="prop-input" id="pp-x" value="' + st.x + '" style="width:50%"><input type="number" class="prop-input" id="pp-y" value="' + st.y + '" style="width:50%"></div></div>';
      html += '<div class="prop-section"><div class="prop-label">Size</div>';

// ===============================================
// Export Functions
// ===============================================
function doExportSVG() { doExportSVGToHost(); }
function doExportPNG() { doExportPNGToHost(); }

function getExportSVGString() {
  var svgEl = document.querySelector('#svg-wrap svg');
  if (!svgEl) return null;
  var clone = svgEl.cloneNode(true);
  var banner = clone.querySelector('#annotation-banner');
  if (banner) banner.parentNode.removeChild(banner);
  return new XMLSerializer().serializeToString(clone);
}

function doExportSVGToHost() {
  var svgStr = getExportSVGString();
  if (!svgStr) return;
  vscodeApi.postMessage({ type: 'exportSVG', data: btoa(unescape(encodeURIComponent(svgStr))) });
}

function doExportPNGToHost() {
  var svgStr = getExportSVGString();
  if (!svgStr || !parsed) return;
  var canvas = document.createElement('canvas');
  canvas.width = parsed.canvas.width; canvas.height = parsed.canvas.height;
  var ctx = canvas.getContext('2d');
  var img = new Image();
  img.onload = function() { ctx.drawImage(img, 0, 0); var dataUrl = canvas.toDataURL('image/png'); vscodeApi.postMessage({ type: 'exportPNG', data: dataUrl.split(',')[1] }); };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
}

function addEvent() { vscodeApi.postMessage({ type: 'info', text: 'Use the DSL editor to add transitions with events' }); }

  updateErrorBar(parsed);
  document.getElementById('svg-wrap').innerHTML = renderSVG(parsed);
  renderTable(parsed);
  renderProps();

  applyZoom();
}

function refreshView() {
