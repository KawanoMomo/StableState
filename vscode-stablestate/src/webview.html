  document.getElementById('status-errors').textContent = 'Errors: ' + parsed.errors.length;
}

// ===============================================
// SVG Coordinates / Hit Testing
// ===============================================
function svgCoords(e) {
  var rect = document.getElementById('svg-wrap').getBoundingClientRect();
  return { x: (e.clientX - rect.left) / zoom, y: (e.clientY - rect.top) / zoom };
}

function hitTest(px, py) {
  if (!parsed) return null;
  var g = parsed.canvas.grid;
  if (!annotationMode) {
    for (var i = parsed.states.length - 1; i >= 0; i--) {
      var st = parsed.states[i]; var abs = getAbsolutePos(st, parsed);
      if (px >= abs.x && px <= abs.x + st.w*g && py >= abs.y && py <= abs.y + st.h*g) return { id: st.id, type: 'state', element: st };
    }
    for (var i = 0; i < parsed.pseudoStates.length; i++) {
      var ps = parsed.pseudoStates[i]; var abs = getAbsolutePos(ps, parsed);
      if (Math.hypot(px - abs.x, py - abs.y) < 15) return { id: ps.id, type: ps.type, element: ps };
    }
    for (var i = parsed.groups.length - 1; i >= 0; i--) {
      var grp = parsed.groups[i]; var x = grp.x*g, y = grp.y*g;
      if (px >= x && px <= x + grp.w*g && py >= y && py <= y + grp.h*g) return { id: grp.id, type: 'group', element: grp };
    }
  }
  if (annotationMode) {
    for (var i = 0; i < parsed.notes.length; i++) {
      var n = parsed.notes[i]; var x = n.x*g, y = n.y*g;
      if (px >= x && px <= x + n.w*g && py >= y && py <= y + n.h*g) return { id: n.id, type: 'note', element: n };
    }
  }
  return null;
}

function hitTestHandle(px, py) {
  if (!parsed || selection.size !== 1) return null;
  var selId = Array.from(selection)[0];
  if (annotationMode && !parsed.noteMap[selId]) return null;
  if (!annotationMode && parsed.noteMap[selId]) return null;
  var selEl = parsed.stateMap[selId] || parsed.groupMap[selId] || parsed.noteMap[selId];
  if (!selEl || selEl.w == null) return null;
  var g = parsed.canvas.grid; var pos = getAbsolutePos(selEl, parsed);
  var pw = selEl.w*g, ph = selEl.h*g, hs = 8;
  var handles = [{name:'nw',cx:pos.x,cy:pos.y},{name:'n',cx:pos.x+pw/2,cy:pos.y},{name:'ne',cx:pos.x+pw,cy:pos.y},{name:'e',cx:pos.x+pw,cy:pos.y+ph/2},{name:'se',cx:pos.x+pw,cy:pos.y+ph},{name:'s',cx:pos.x+pw/2,cy:pos.y+ph},{name:'sw',cx:pos.x,cy:pos.y+ph},{name:'w',cx:pos.x,cy:pos.y+ph/2}];
  for (var i = 0; i < handles.length; i++) { if (Math.abs(px - handles[i].cx) <= hs && Math.abs(py - handles[i].cy) <= hs) return { handle: handles[i].name, id: selId, element: selEl }; }
  return null;
}

function collectDragSet(sel) {
  if (!parsed) return [];
  var items = [];
  sel.forEach(function(id) {
    var el = parsed.stateMap[id] || parsed.pseudoMap[id] || parsed.groupMap[id] || parsed.noteMap[id];
    if (!el) return;
    var type = parsed.stateMap[id] ? 'state' : parsed.pseudoMap[id] ? el.type : parsed.groupMap[id] ? 'group' : 'note';
    items.push({ id: id, type: type, origX: el.x, origY: el.y, parent: el.parent || null, w: el.w, h: el.h });
  });
  sel.forEach(function(id) {
    var grp = parsed.groupMap[id]; if (!grp) return;
    for (var si = 0; si < parsed.states.length; si++) {
      var st = parsed.states[si]; var cx = st.x + (st.w||0)/2, cy = st.y + (st.h||0)/2;
      if (cx >= grp.x && cx <= grp.x+grp.w && cy >= grp.y && cy <= grp.y+grp.h) {
        if (!items.some(function(it) { return it.id === st.id; })) items.push({ id: st.id, type: 'state', origX: st.x, origY: st.y, parent: st.parent, w: st.w, h: st.h });
      }
    }
  });
  return items;
}

function computeSnapGuides(dragItems) {
  if (!parsed) return [];
  var g = parsed.canvas.grid; var threshold = 0.5*g; var guides = [];
  var dragIds = new Set(dragItems.map(function(it) { return it.id; }));
  var otherEdges = { x: [], y: [] };
  for (var si = 0; si < parsed.states.length; si++) { var st = parsed.states[si]; if (dragIds.has(st.id)) continue; var abs = getAbsolutePos(st,parsed); otherEdges.x.push(abs.x, abs.x+st.w*g); otherEdges.y.push(abs.y, abs.y+st.h*g); }
  for (var gi = 0; gi < parsed.groups.length; gi++) { var grp = parsed.groups[gi]; if (dragIds.has(grp.id)) continue; otherEdges.x.push(grp.x*g, (grp.x+grp.w)*g); otherEdges.y.push(grp.y*g, (grp.y+grp.h)*g); }
  for (var di = 0; di < dragItems.length; di++) {
    var el = parsed.stateMap[dragItems[di].id] || parsed.groupMap[dragItems[di].id] || parsed.noteMap[dragItems[di].id];
    if (!el || el.w == null) continue;
    var abs = getAbsolutePos(el, parsed); var ex = [abs.x, abs.x+el.w*g]; var ey = [abs.y, abs.y+el.h*g];
    for (var ei = 0; ei < ex.length; ei++) { for (var oi = 0; oi < otherEdges.x.length; oi++) { if (Math.abs(ex[ei]-otherEdges.x[oi]) < threshold && !guides.some(function(sg) { return sg.axis==='x' && Math.abs(sg.pos-otherEdges.x[oi])<1; })) guides.push({axis:'x',pos:otherEdges.x[oi]}); } }
    for (var ei = 0; ei < ey.length; ei++) { for (var oi = 0; oi < otherEdges.y.length; oi++) { if (Math.abs(ey[ei]-otherEdges.y[oi]) < threshold && !guides.some(function(sg) { return sg.axis==='y' && Math.abs(sg.pos-otherEdges.y[oi])<1; })) guides.push({axis:'y',pos:otherEdges.y[oi]}); } }
  }
  return guides;
}

// ===============================================
// Undo / Redo
// ===============================================
function pushHistory() { undoHistory.push(getDsl()); if (undoHistory.length > MAX_HISTORY) undoHistory.shift(); redoFuture = []; }
function undo() { if (!undoHistory.length) return; redoFuture.push(getDsl()); dsl = undoHistory.pop(); vscodeApi.postMessage({ type: 'dslUpdate', dsl: dsl }); refresh(); }
function redo() { if (!redoFuture.length) return; undoHistory.push(getDsl()); dsl = redoFuture.pop(); vscodeApi.postMessage({ type: 'dslUpdate', dsl: dsl }); refresh(); }

// ===============================================
// Mouse Handlers
// ===============================================
(function() {
  var svgWrap = document.getElementById('svg-wrap');

  svgWrap.addEventListener('mousedown', function(e) {
    if (e.button !== 0) return;
    var pt = svgCoords(e);
    var handleHit = hitTestHandle(pt.x, pt.y);
    if (handleHit) {
      var el = handleHit.element; pushHistory();
      resizeState = { id: handleHit.id, type: parsed.stateMap[handleHit.id] ? 'state' : parsed.groupMap[handleHit.id] ? 'group' : 'note', handle: handleHit.handle, origX: el.x, origY: el.y, origW: el.w, origH: el.h, startMX: pt.x, startMY: pt.y };
      e.preventDefault(); return;
    }
    var hit = hitTest(pt.x, pt.y);
    if (!hit) { selection.clear(); snapGuides = []; refresh(); return; }
    if (e.shiftKey) { if (selection.has(hit.id)) selection.delete(hit.id); else selection.add(hit.id); refresh(); return; }
    if (!selection.has(hit.id)) { selection.clear(); selection.add(hit.id); refresh(); }
    pushHistory();
    dragState = { startX: pt.x, startY: pt.y, items: collectDragSet(selection), lastDxGrid: 0, lastDyGrid: 0 };
    e.preventDefault();
  });

  document.addEventListener('mousemove', function(e) {
    if (!parsed) return;
    var g = parsed.canvas.grid;
    if (dragState) {
      var pt = svgCoords(e); var dx = pt.x - dragState.startX, dy = pt.y - dragState.startY;
      var dxG = Math.round(dx/g), dyG = Math.round(dy/g);
      if (dxG === dragState.lastDxGrid && dyG === dragState.lastDyGrid) return;
      dragState.lastDxGrid = dxG; dragState.lastDyGrid = dyG;
      var d = getDsl();
      for (var i = 0; i < dragState.items.length; i++) {
        var item = dragState.items[i]; var elType = item.type;
        if (item.parent) { var pSt = parsed.stateMap[item.parent]; if (pSt) { d = updatePos(elType, item.id, Math.max(0,Math.min(pSt.w-(item.w||1), item.origX+dxG)), Math.max(0,Math.min(pSt.h-(item.h||1), item.origY+dyG)), d); } else d = updatePos(elType, item.id, item.origX+dxG, item.origY+dyG, d); }
        else d = updatePos(elType, item.id, Math.max(0, item.origX+dxG), Math.max(0, item.origY+dyG), d);
      }
      dsl = d; parsed = parseDSL(dsl); snapGuides = computeSnapGuides(dragState.items);
      document.getElementById('svg-wrap').innerHTML = renderSVG(parsed); applyZoom();
      return;
    }
    if (resizeState) {
      var pt = svgCoords(e); var dx = pt.x - resizeState.startMX, dy = pt.y - resizeState.startMY;
      var dxG = Math.round(dx/g), dyG = Math.round(dy/g); var h = resizeState.handle;
      var nX = resizeState.origX, nY = resizeState.origY, nW = resizeState.origW, nH = resizeState.origH;
      if (h==='nw'||h==='w'||h==='sw') { nX = resizeState.origX+dxG; nW = resizeState.origW-dxG; }
      if (h==='ne'||h==='e'||h==='se') nW = resizeState.origW+dxG;
      if (h==='nw'||h==='n'||h==='ne') { nY = resizeState.origY+dyG; nH = resizeState.origH-dyG; }
      if (h==='sw'||h==='s'||h==='se') nH = resizeState.origH+dyG;
      if (nW < 2) { nW = 2; if (h.includes('w')) nX = resizeState.origX+resizeState.origW-2; }
      if (nH < 2) { nH = 2; if (h.includes('n')) nY = resizeState.origY+resizeState.origH-2; }
      var d = getDsl(); d = updatePos(resizeState.type, resizeState.id, nX, nY, d); d = updateSize(resizeState.type, resizeState.id, nW, nH, d);
      dsl = d; parsed = parseDSL(dsl); document.getElementById('svg-wrap').innerHTML = renderSVG(parsed); applyZoom();
      return;
    }
  });

  document.addEventListener('mouseup', function() {
    if (dragState) {
      if (dragState.lastDxGrid === 0 && dragState.lastDyGrid === 0) undoHistory.pop();
      else vscodeApi.postMessage({ type: 'dslUpdate', dsl: dsl });
      dragState = null; snapGuides = []; refresh();
    }
    if (resizeState) { vscodeApi.postMessage({ type: 'dslUpdate', dsl: dsl }); resizeState = null; refresh(); }
  });
})();

document.getElementById('svg-wrap').addEventListener('wheel', function(e) {
  e.preventDefault();
  zoom = Math.max(0.25, Math.min(4, zoom + (e.deltaY > 0 ? -0.1 : 0.1)));
  applyZoom();
}, { passive: false });

// ===============================================
// Element Operations
// ===============================================
function connectSelected() {
  if (selection.size !== 2) return;
  var ids = Array.from(selection);
  pushHistory(); var d = getDsl(); d = addTransition(ids[0], ids[1], null, null, null, null, d); setDsl(d); refresh();
}

function removeDSLElement(id, d) {
  var lines = d.split('\n'); var result = []; var skipNesting = 0;
  for (var i = 0; i < lines.length; i++) {
    var trimmed = lines[i].trim();
    if (trimmed.match(new RegExp('^(state|group|note|initial|final|choice|history|deephistory|fork|join)\\s+' + id + '\\b'))) {
      if (trimmed.endsWith('{')) skipNesting = 1; continue;
    }
    if (skipNesting > 0) { if (trimmed === '}' || trimmed.startsWith('}')) { skipNesting--; if (skipNesting === 0) continue; } if (trimmed.endsWith('{')) skipNesting++; continue; }
    if (trimmed.match(new RegExp('^' + id + '\\s*->')) || trimmed.match(new RegExp('->\\s*' + id + '(\\s|$)'))) continue;
    result.push(lines[i]);
  }
  return result.join('\n');
}

function deleteSelected() {
  if (!selection.size) return;
  pushHistory(); var d = getDsl();
  selection.forEach(function(id) { d = removeDSLElement(id, d); });
  selection.clear(); setDsl(d); refresh();
}

function copySelection() {
  if (!selection.size) return;
  clipboard = []; var d = getDsl(); var lines = d.split('\n');
  selection.forEach(function(id) {
    var collecting = false, nestDepth = 0, collected = [];
    for (var i = 0; i < lines.length; i++) {
      var trimmed = lines[i].trim();
      if (!collecting) {
        if (trimmed.match(new RegExp('^(state|group|note|initial|final|choice|history|deephistory|fork|join)\\s+' + id + '\\b'))) {
          collecting = true; collected.push(lines[i]); if (trimmed.endsWith('{')) nestDepth = 1; else collecting = false;
        }
      } else { collected.push(lines[i]); if (trimmed.endsWith('{')) nestDepth++; if (trimmed === '}' || trimmed.startsWith('}')) { nestDepth--; if (nestDepth === 0) collecting = false; } }
    }
    if (collected.length > 0) clipboard = clipboard.concat(collected);
  });
}

function pasteSelection() {
  if (!clipboard || !clipboard.length) return;
  pushHistory();
  var suffix = '_' + Date.now().toString(36).slice(-4);
  var pastedLines = clipboard.map(function(line) {
    var result = line.replace(/\bat\s+([\d.]+)\s*,\s*([\d.]+)/g, function(match, x, y) { return 'at ' + (parseFloat(x)+2) + ',' + (parseFloat(y)+2); });
    var idMatch = result.match(/^(\s*(?:state|group|note|initial|final|choice|history|deephistory|fork|join))\s+(\S+)/);
    if (idMatch) { var oldId = idMatch[2]; result = result.replace(new RegExp('\\b' + oldId + '\\b', 'g'), oldId + suffix); }
    return result;
  });
  var d = getDsl(); d = d + '\n' + pastedLines.join('\n'); setDsl(d); refresh();
}

var addCounter = { state: 0, group: 0, initial: 0, final: 0, note: 0 };
function addNewElement(type) {
  pushHistory(); var d = getDsl(); var line = '';
  switch (type) {
    case 'state': addCounter.state++; line = 'state state_' + addCounter.state + ' "New State" at 10,10 size 8x4'; break;
    case 'group': addCounter.group++; line = 'group grp_' + addCounter.group + ' "New Group" at 8,8 size 20x12'; break;
    case 'initial': addCounter.initial++; line = 'initial ini_' + addCounter.initial + ' at 5,5'; break;
    case 'final': addCounter.final++; line = 'final fin_' + addCounter.final + ' at 30,5'; break;
    case 'note': addCounter.note++; line = 'note note_' + addCounter.note + ' "Annotation" at 5,5 size 8x2 color=#FEF3C7'; break;
  }
  if (line) { d = d + '\n' + line; setDsl(d); if (type === 'note' && !annotationMode) { annotationMode = true; var btn = document.getElementById('btn-annotations'); if (btn) { btn.classList.add('active'); btn.textContent = 'Notes (Edit)'; } } refresh(); }
}

function toggleAnnotations() {
  annotationMode = !annotationMode;
  if (annotationMode) {
    var noteIds = new Set(parsed ? parsed.notes.map(function(n){return n.id;}) : []);
    selection = new Set(Array.from(selection).filter(function(id){return noteIds.has(id);}));
  } else {
    var noteIds2 = new Set(parsed ? parsed.notes.map(function(n){return n.id;}) : []);
    selection = new Set(Array.from(selection).filter(function(id){return !noteIds2.has(id);}));
  }
  var btn = document.getElementById('btn-annotations');
  if (btn) { btn.classList.toggle('active', annotationMode); btn.textContent = annotationMode ? 'Notes (Edit)' : 'Notes'; }
  refresh();
}

// ===============================================
// Keyboard Shortcuts
// ===============================================
document.addEventListener('keydown', function(e) {
  var ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT' || ae.tagName === 'TEXTAREA')) {
    if (!e.ctrlKey) return;
  }
  if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
  if (e.ctrlKey && e.key === 'y') { e.preventDefault(); redo(); }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelected(); }
  if (e.key === 'n' || e.key === 'N') { toggleAnnotations(); }
  if (e.ctrlKey && e.key === 'a') { e.preventDefault(); if (!parsed) return; if (annotationMode) { selection = new Set(parsed.notes.map(function(el){return el.id;})); } else { selection = new Set(parsed.states.concat(parsed.pseudoStates, parsed.groups).map(function(el){return el.id;})); } refresh(); }
  if (e.ctrlKey && e.key === 'c') { copySelection(); }
  if (e.ctrlKey && e.key === 'v') { pasteSelection(); }
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.key) >= 0 && selection.size > 0) {
    e.preventDefault();
    if (!parsed) return;
    var dx = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    var dy = e.key === 'ArrowDown' ? 1 : e.key === 'ArrowUp' ? -1 : 0;
    pushHistory();
    var d = getDsl();
    selection.forEach(function(id) {
      var st = parsed.stateMap[id] || parsed.pseudoMap[id] || parsed.groupMap[id] || parsed.noteMap[id];
      if (!st) return;
      var type = parsed.stateMap[id] ? 'state' : parsed.pseudoMap[id] ? parsed.pseudoMap[id].type : parsed.groupMap[id] ? 'group' : 'note';
      d = updatePos(type, id, Math.max(0, (st.x||0)+dx), Math.max(0, (st.y||0)+dy), d);
    });
    setDsl(d);
    refresh();
  }
});

// ===============================================
// Wire up toolbar
// ===============================================
(function() {
  var origSetTool = setTool;
  setTool = function(name) {
    if (name === 'connect') { connectSelected(); origSetTool('select'); return; }
    if (name === 'state' || name === 'group' || name === 'initial' || name === 'final') { addNewElement(name); origSetTool('select'); return; }
    origSetTool(name);
  };
})();

// ===============================================
// Init
// ===============================================
refresh();
</script>
</body>
</html>
