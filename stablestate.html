<!--
  StableState — Browser-Based UML State Machine Diagram Editor
  Single-file standalone editor. Open in any browser, no build step needed.

  Structure:
    <style>       CSS (dark theme, toolbar, 3-pane layout, property panel)
    <div#header>  Toolbar (tabs, diagram tools, export)
    <div#body>    Main layout: DSL editor (left) + Diagram/Table (center) + Property panel (right)
    <script>      All application logic:
      - parseDSL()       DSL text → parsed data
      - renderSVG()      Parsed data → SVG diagram
      - renderTable()    Parsed data → state transition table
      - renderProps()    Property panel for selection
      - refresh()        Main update pipeline
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StableState - UML State Machine Editor</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #1a1a2e; --editor: #0f0f23; --panel: #16213e; --border: #2a2a4a;
  --text: #E2E8F0; --muted: #64748B; --dim: #475569;
  --accent: #818CF8; --accent2: #4338CA; --accent-bg: #312E81;
  --green: #22C55E; --amber: #F59E0B; --red: #EF4444;
}
body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans','Noto Sans JP',sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ─── Header ─── */
#header { display:flex; align-items:center; justify-content:space-between; padding:6px 12px; border-bottom:1px solid var(--border); flex-shrink:0; background:var(--panel); }
#header .logo { display:flex; align-items:center; gap:8px; }
#header .logo-icon { width:24px; height:24px; border-radius:5px; background:linear-gradient(135deg,#818CF8,#4338CA); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#fff; }
#header .logo-text { font-weight:700; font-size:14px; }
#header .badge { font-size:9px; color:#A5B4FC; font-weight:600; background:var(--accent-bg); padding:2px 7px; border-radius:10px; }

/* Tabs */
.tab-group { display:flex; gap:2px; margin:0 12px; }
.tab-btn { padding:4px 14px; font-size:11px; font-weight:600; border:1px solid var(--border); border-radius:5px; cursor:pointer; background:transparent; color:var(--muted); font-family:inherit; transition:all 0.15s; }
.tab-btn:hover { background:var(--accent-bg); color:#A5B4FC; }
.tab-btn.active { background:var(--accent2); color:#fff; border-color:var(--accent); }

/* Toolbar */
.toolbar { display:flex; gap:4px; align-items:center; }
.tb { padding:4px 10px; font-size:11px; font-weight:600; border:1px solid var(--border); border-radius:5px; cursor:pointer; background:transparent; color:#94A3B8; font-family:inherit; transition:all 0.15s; }
.tb:hover { background:#334155; }
.tb.active { background:var(--accent2); color:#fff; border-color:var(--accent); }
.tb-accent { border-color:var(--accent); color:#A5B4FC; }
.tb-green { border-color:var(--green); color:#86EFAC; }
.sep { width:1px; height:14px; background:var(--border); margin:0 4px; }

/* ─── Body ─── */
#body { flex:1; display:flex; overflow:hidden; }

/* ─── Editor Panel (Left) ─── */
#editor-panel { width:320px; min-width:240px; display:flex; flex-direction:column; border-right:1px solid var(--border); background:var(--editor); }
.panel-label { padding:4px 10px; font-size:10px; font-weight:600; color:var(--muted); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:4px; text-transform:uppercase; letter-spacing:0.05em; }
.panel-label .dot { font-size:10px; }
#error-bar { padding:4px 10px; background:#7F1D1D; color:#FCA5A5; font-size:10px; display:none; }
#editor-wrap { flex:1; display:flex; overflow:hidden; background:var(--editor); }
#line-nums { width:40px; padding:12px 4px 12px 0; text-align:right; font-family:'IBM Plex Mono',monospace; font-size:12px; line-height:20px; color:var(--dim); user-select:none; overflow:hidden; flex-shrink:0; }
#editor { flex:1; background:transparent; color:var(--text); border:none; outline:none; font-family:'IBM Plex Mono',monospace; font-size:12px; line-height:20px; padding:12px 12px 12px 4px; resize:none; white-space:pre; overflow-x:auto; tab-size:2; }

/* ─── Center Panel ─── */
#center-panel { flex:1; display:flex; flex-direction:column; overflow:hidden; }

/* Diagram view */
#diagram-view { flex:1; display:flex; flex-direction:column; overflow:hidden; }
#diagram-area { flex:1; overflow:auto; padding:12px; background:repeating-conic-gradient(var(--panel) 0% 25%, var(--bg) 0% 50%) 0 0/24px 24px; }
#svg-wrap { background:#fff; border-radius:8px; display:inline-block; line-height:0; }
#svg-wrap svg { cursor:default; }

/* Table view */
#table-view { flex:1; display:none; flex-direction:column; overflow:hidden; }
#table-area { flex:1; overflow:auto; padding:12px; }
#state-table { width:100%; border-collapse:collapse; font-size:12px; }
#state-table th, #state-table td { border:1px solid var(--border); padding:4px 8px; text-align:left; }
#state-table th { background:var(--panel); color:var(--accent); font-weight:600; font-size:10px; text-transform:uppercase; }
#state-table td { background:var(--editor); color:var(--text); }
#table-empty { display:flex; align-items:center; justify-content:center; height:100%; color:var(--muted); font-size:13px; }

/* ─── Property Panel (Right) ─── */
#prop-panel { width:220px; min-width:220px; border-left:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; background:var(--panel); }
#prop-content { flex:1; overflow-y:auto; padding:12px; }
.prop-section { margin-bottom:12px; }
.prop-label { font-size:10px; color:var(--muted); font-weight:600; margin-bottom:2px; text-transform:uppercase; letter-spacing:0.05em; }
.prop-row { display:flex; gap:6px; margin-bottom:6px; }
.prop-input { background:var(--editor); border:1px solid var(--border); border-radius:4px; color:var(--text); padding:4px 8px; font-size:12px; width:100%; outline:none; font-family:'IBM Plex Mono',monospace; }
.prop-input:focus { border-color:var(--accent); }
.prop-sub { font-size:9px; color:var(--dim); }
.prop-select { background:var(--editor); border:1px solid var(--border); border-radius:4px; color:var(--text); padding:4px 8px; font-size:12px; width:100%; outline:none; font-family:'IBM Plex Mono',monospace; }
.prop-select:focus { border-color:var(--accent); }
.prop-checkbox { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
.prop-checkbox input[type="checkbox"] { accent-color:var(--accent); }
.prop-checkbox label { font-size:11px; color:var(--text); }
.prop-warning { font-size:10px; color:var(--amber); background:#422006; border:1px solid var(--amber); border-radius:4px; padding:4px 8px; margin-top:4px; }

/* Color palette */
.color-grid { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px; }
.color-dot { width:20px; height:20px; border-radius:4px; cursor:pointer; border:2px solid transparent; }
.color-dot.active { border-color:#fff; box-shadow:0 0 0 1px var(--accent); }

/* Style buttons */
.style-btn { padding:3px 10px; font-size:11px; font-weight:600; border:1px solid var(--border); border-radius:5px; cursor:pointer; background:transparent; color:#94A3B8; font-family:inherit; }
.style-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }

/* ─── Status ─── */
#status { display:flex; gap:14px; padding:3px 12px; border-top:1px solid var(--border); font-size:10px; color:var(--dim); flex-shrink:0; background:var(--panel); }

input[type=number] { -moz-appearance:textfield; }
input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; }
</style>
</head>
<body>

<!-- ═══ Header ═══ -->
<div id="header">
  <div class="logo">
    <div class="logo-icon">S</div>
    <span class="logo-text">StableState</span>
    <span class="badge">v0.1</span>
  </div>

  <div class="tab-group">
    <button class="tab-btn active" id="tab-diagram" onclick="switchTab('diagram')">Diagram</button>
    <button class="tab-btn" id="tab-table" onclick="switchTab('table')">Table</button>
  </div>

  <div class="toolbar" id="diagram-toolbar">
    <button class="tb active" id="tool-select" onclick="setTool('select')">Select</button>
    <button class="tb" id="tool-state" onclick="setTool('state')">+State</button>
    <button class="tb" id="tool-group" onclick="setTool('group')">+Group</button>
    <button class="tb" id="tool-initial" onclick="setTool('initial')">&#9679;Initial</button>
    <button class="tb" id="tool-final" onclick="setTool('final')">&#9678;Final</button>
    <button class="tb" id="tool-connect" onclick="setTool('connect')">&#8599;Connect</button>
    <div class="sep"></div>
    <button class="tb" id="btn-actions" onclick="toggleActions()">Actions</button>
    <div class="sep"></div>
    <button class="tb tb-accent" onclick="exportSVG()">SVG</button>
    <button class="tb tb-accent" onclick="exportPNG()">PNG</button>
    <button class="tb tb-accent" onclick="copyPNG()" title="クリップボードにコピー">Copy</button>
    <div class="sep"></div>
    <button class="tb" onclick="setZoom(-1)">&minus;</button>
    <span id="zoom-label" style="font-size:11px;color:#94A3B8;min-width:36px;text-align:center">100%</span>
    <button class="tb" onclick="setZoom(1)">+</button>
  </div>

  <div class="toolbar" id="table-toolbar" style="display:none">
    <button class="tb" onclick="addEvent()">+Event</button>
    <div class="sep"></div>
    <button class="tb tb-accent" onclick="exportSVG()">SVG</button>
    <button class="tb tb-accent" onclick="exportPNG()">PNG</button>
    <button class="tb tb-accent" onclick="copyPNG()" title="クリップボードにコピー">Copy</button>
  </div>
</div>

<!-- ═══ Body ═══ -->
<div id="body">

  <!-- Left: DSL Editor -->
  <div id="editor-panel">
    <div class="panel-label"><span class="dot" style="color:var(--accent)">&#9679;</span> DSL</div>
    <div id="error-bar"></div>
    <div id="editor-wrap">
      <div id="line-nums"></div>
      <textarea id="editor" spellcheck="false">@canvas width=960 height=600 grid=20
@config transition=local

initial ini at 1,5
state idle "Idle" at 4,3 size 8x4 entry=IdleEntry
final fin at 20,5

ini -> idle
idle -> fin : EvShutdown</textarea>
    </div>
  </div>

  <!-- Center: Diagram / Table -->
  <div id="center-panel">
    <div id="diagram-view">
      <div class="panel-label">
        <span class="dot" style="color:var(--green)">&#9679;</span> DIAGRAM
        <span style="margin-left:auto;color:var(--dim);font-weight:400">ドラッグで移動・リサイズ</span>
      </div>
      <div id="diagram-area"><div id="svg-wrap"></div></div>
    </div>
    <div id="table-view">
      <div class="panel-label">
        <span class="dot" style="color:var(--green)">&#9679;</span> TABLE
        <span style="margin-left:auto;color:var(--dim);font-weight:400">セルをクリックして編集</span>
      </div>
      <div id="table-area">
        <div id="table-empty">DSLをパースして状態遷移表を生成します</div>
        <table id="state-table"></table>
      </div>
    </div>
  </div>

  <!-- Right: Property Panel -->
  <div id="prop-panel">
    <div class="panel-label"><span class="dot" style="color:var(--amber)">&#9679;</span> <span id="prop-title">プロパティ</span></div>
    <div id="prop-content">
      <!-- Selected item info -->
      <div class="prop-section">
        <div class="prop-label">Selected</div>
        <div class="prop-sub" id="prop-selected">なし</div>
      </div>

      <!-- Position -->
      <div class="prop-section">
        <div class="prop-label">Position</div>
        <div class="prop-row">
          <input type="number" class="prop-input" id="prop-x" placeholder="X" disabled>
          <input type="number" class="prop-input" id="prop-y" placeholder="Y" disabled>
        </div>
        <div class="prop-row">
          <input type="number" class="prop-input" id="prop-w" placeholder="W" disabled>
          <input type="number" class="prop-input" id="prop-h" placeholder="H" disabled>
        </div>
      </div>

      <!-- Actions -->
      <div class="prop-section">
        <div class="prop-label">Actions</div>
        <div class="prop-row"><input class="prop-input" id="prop-entry" placeholder="entry" disabled></div>
        <div class="prop-row"><input class="prop-input" id="prop-do" placeholder="do" disabled></div>
        <div class="prop-row"><input class="prop-input" id="prop-exit" placeholder="exit" disabled></div>
      </div>

      <!-- Color -->
      <div class="prop-section">
        <div class="prop-label">Color</div>
        <div class="color-grid" id="prop-colors">
          <div class="color-dot" style="background:#6366F1" data-color="#6366F1"></div>
          <div class="color-dot" style="background:#818CF8" data-color="#818CF8"></div>
          <div class="color-dot" style="background:#4338CA" data-color="#4338CA"></div>
          <div class="color-dot" style="background:#22C55E" data-color="#22C55E"></div>
          <div class="color-dot" style="background:#F59E0B" data-color="#F59E0B"></div>
          <div class="color-dot" style="background:#EF4444" data-color="#EF4444"></div>
          <div class="color-dot" style="background:#EC4899" data-color="#EC4899"></div>
          <div class="color-dot" style="background:#8B5CF6" data-color="#8B5CF6"></div>
        </div>
      </div>

      <!-- Style -->
      <div class="prop-section">
        <div class="prop-label">Style</div>
        <div class="prop-row" style="gap:4px">
          <button class="style-btn active" data-style="solid">Solid</button>
          <button class="style-btn" data-style="dashed">Dashed</button>
          <button class="style-btn" data-style="bold">Bold</button>
        </div>
      </div>

      <!-- Config -->
      <div class="prop-section" style="margin-top:24px; border-top:1px solid var(--border); padding-top:12px;">
        <div class="prop-label">Config</div>

        <div class="prop-sub" style="margin-bottom:4px">Transition Default</div>
        <select class="prop-select" id="config-transition">
          <option value="local">local</option>
          <option value="external">external</option>
          <option value="internal">internal</option>
        </select>

        <div class="prop-checkbox" style="margin-top:8px">
          <input type="checkbox" id="config-orthogonal">
          <label for="config-orthogonal">Orthogonal Regions</label>
        </div>
        <div class="prop-warning" id="orthogonal-warning" style="display:none">
          直交領域を有効にすると状態遷移表の自動生成はサポートされません
        </div>

        <div class="prop-checkbox" style="margin-top:4px">
          <input type="checkbox" id="config-history">
          <label for="config-history">History States</label>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- ═══ Status bar ═══ -->
<div id="status">
  <span id="status-states">States: 0</span>
  <span id="status-transitions">Transitions: 0</span>
  <span id="status-errors">Errors: 0</span>
</div>

<script>
// ═══════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════
let parsed = null;
let currentTab = 'diagram';
let currentTool = 'select';
let actionsMode = false;
let zoomLevel = 100;

// ═══════════════════════════════════════════════
// Tab Switching
// ═══════════════════════════════════════════════
function switchTab(name) {
  currentTab = name;

  // Tab buttons
  document.getElementById('tab-diagram').classList.toggle('active', name === 'diagram');
  document.getElementById('tab-table').classList.toggle('active', name === 'table');

  // Views
  document.getElementById('diagram-view').style.display = name === 'diagram' ? 'flex' : 'none';
  document.getElementById('table-view').style.display = name === 'table' ? 'flex' : 'none';

  // Toolbars
  document.getElementById('diagram-toolbar').style.display = name === 'diagram' ? 'flex' : 'none';
  document.getElementById('table-toolbar').style.display = name === 'table' ? 'flex' : 'none';
}

// ═══════════════════════════════════════════════
// Tool Selection
// ═══════════════════════════════════════════════
function setTool(name) {
  currentTool = name;
  const tools = ['select','state','group','initial','final','connect'];
  tools.forEach(t => {
    const el = document.getElementById('tool-' + t);
    if (el) el.classList.toggle('active', t === name);
  });
}

// ═══════════════════════════════════════════════
// Actions Toggle
// ═══════════════════════════════════════════════
function toggleActions() {
  actionsMode = !actionsMode;
  document.getElementById('btn-actions').classList.toggle('active', actionsMode);
  refresh();
}

// ═══════════════════════════════════════════════
// Zoom
// ═══════════════════════════════════════════════
function setZoom(delta) {
  zoomLevel = Math.max(25, Math.min(400, zoomLevel + delta * 25));
  document.getElementById('zoom-label').textContent = zoomLevel + '%';
}

// ═══════════════════════════════════════════════
// Config UI
// ═══════════════════════════════════════════════
document.getElementById('config-orthogonal').addEventListener('change', function() {
  document.getElementById('orthogonal-warning').style.display = this.checked ? 'block' : 'none';
});

// ═══════════════════════════════════════════════
// Parser
// ═══════════════════════════════════════════════
function parseDSL(text) {
  const result = {
    canvas: { width: 960, height: 600, grid: 20 },
    config: { transition: 'local', orthogonal: false, history: false },
    states: [],
    pseudoStates: [],
    groups: [],
    regions: [],
    transitions: [],
    notes: [],
    noteConnections: [],
    errors: [],
    stateMap: {},
    pseudoMap: {},
    groupMap: {},
    noteMap: {}
  };

  const lines = text.split('\n');
  const nestingStack = []; // stack of parent state IDs

  for (let i = 0; i < lines.length; i++) {
    const lineNum = i + 1;
    const raw = lines[i];
    const trimmed = raw.trim();

    // Skip empty lines and comments
    if (trimmed === '' || trimmed.startsWith('#')) continue;

    // ─── Closing brace ───
    if (/^\}/.test(trimmed)) {
      if (nestingStack.length === 0) {
        result.errors.push({ line: lineNum, msg: 'Unexpected closing brace }' });
        continue;
      }
      const parentId = nestingStack.pop();
      // Parse trailing props on the closing brace line: } entry=Foo exit=Bar
      const afterBrace = trimmed.slice(1).trim();
      if (afterBrace && result.stateMap[parentId]) {
        const parentState = result.stateMap[parentId];
        parseProps(afterBrace, parentState);
      }
      continue;
    }

    // ─── @canvas ───
    const canvasMatch = trimmed.match(/^@canvas\s+(.+)$/);
    if (canvasMatch) {
      const propsStr = canvasMatch[1];
      const wm = propsStr.match(/width=(\d+)/);
      const hm = propsStr.match(/height=(\d+)/);
      const gm = propsStr.match(/grid=(\d+)/);
      if (wm) result.canvas.width = parseInt(wm[1], 10);
      if (hm) result.canvas.height = parseInt(hm[1], 10);
      if (gm) result.canvas.grid = parseInt(gm[1], 10);
      continue;
    }

    // ─── @config ───
    const configMatch = trimmed.match(/^@config\s+(\w+)=(\S+)$/);
    if (configMatch) {
      const key = configMatch[1];
      const val = configMatch[2];
      if (key === 'transition') {
        result.config.transition = val;
      } else if (key === 'orthogonal') {
        result.config.orthogonal = val === 'true';
      } else if (key === 'history') {
        result.config.history = val === 'true';
      }
      continue;
    }

    // ─── Pseudo-states ───
    const pseudoTypes = ['initial', 'final', 'choice', 'history', 'deephistory', 'fork', 'join'];
    const pseudoMatch = trimmed.match(/^(initial|final|choice|history|deephistory|fork|join)\s+(\S+)\s+at\s+(-?[\d.]+)\s*,\s*(-?[\d.]+)(?:\s+size\s+(-?[\d.]+)\s*x\s*(-?[\d.]+))?/);
    if (pseudoMatch) {
      const id = pseudoMatch[2];
      // Duplicate ID check across all maps
      if (checkDuplicate(id, lineNum, result)) continue;
      const ps = {
        type: pseudoMatch[1],
        id: id,
        x: parseFloat(pseudoMatch[3]),
        y: parseFloat(pseudoMatch[4]),
        w: pseudoMatch[5] ? parseFloat(pseudoMatch[5]) : null,
        h: pseudoMatch[6] ? parseFloat(pseudoMatch[6]) : null,
        parent: nestingStack.length > 0 ? nestingStack[nestingStack.length - 1] : null,
        line: lineNum
      };
      result.pseudoStates.push(ps);
      result.pseudoMap[id] = ps;
      continue;
    }

    // ─── state ───
    const stateMatch = trimmed.match(/^state\s+(\S+)\s+"([^"]*)"\s+at\s+(-?[\d.]+)\s*,\s*(-?[\d.]+)\s+size\s+(-?[\d.]+)\s*x\s*(-?[\d.]+)(.*)$/);
    if (stateMatch) {
      const id = stateMatch[1];
      if (checkDuplicate(id, lineNum, result)) continue;
      const rest = stateMatch[7].trim();
      // Check if composite (ends with {)
      const isComposite = rest.endsWith('{');
      const propsStr = isComposite ? rest.slice(0, -1).trim() : rest;

      const st = {
        type: 'state',
        id: id,
        label: stateMatch[2],
        x: parseFloat(stateMatch[3]),
        y: parseFloat(stateMatch[4]),
        w: parseFloat(stateMatch[5]),
        h: parseFloat(stateMatch[6]),
        color: null,
        textColor: null,
        borderColor: null,
        round: null,
        style: null,
        entry: null,
        do: null,
        exit: null,
        parent: nestingStack.length > 0 ? nestingStack[nestingStack.length - 1] : null,
        children: [],
        isInitial: false,
        line: lineNum
      };

      // Parse props
      if (propsStr) parseProps(propsStr, st);

      result.states.push(st);
      result.stateMap[id] = st;

      // Add to parent's children
      if (st.parent && result.stateMap[st.parent]) {
        result.stateMap[st.parent].children.push(id);
      }

      // Push onto nesting stack if composite
      if (isComposite) {
        nestingStack.push(id);
      }
      continue;
    }

    // ─── group ───
    const groupMatch = trimmed.match(/^group\s+(\S+)\s+"([^"]*)"\s+at\s+(-?[\d.]+)\s*,\s*(-?[\d.]+)\s+size\s+(-?[\d.]+)\s*x\s*(-?[\d.]+)(.*)$/);
    if (groupMatch) {
      const id = groupMatch[1];
      if (checkDuplicate(id, lineNum, result)) continue;
      const rest = groupMatch[7].trim();
      const g = {
        type: 'group',
        id: id,
        label: groupMatch[2],
        x: parseFloat(groupMatch[3]),
        y: parseFloat(groupMatch[4]),
        w: parseFloat(groupMatch[5]),
        h: parseFloat(groupMatch[6]),
        color: null,
        borderColor: null,
        textColor: null,
        style: null,
        line: lineNum
      };
      if (rest) parseProps(rest, g);
      result.groups.push(g);
      result.groupMap[id] = g;
      continue;
    }

    // ─── note ───
    const noteMatch = trimmed.match(/^note\s+(\S+)\s+"([^"]*)"\s+at\s+(-?[\d.]+)\s*,\s*(-?[\d.]+)\s+size\s+(-?[\d.]+)\s*x\s*(-?[\d.]+)(.*)$/);
    if (noteMatch) {
      const id = noteMatch[1];
      if (checkDuplicate(id, lineNum, result)) continue;
      const rest = noteMatch[7].trim();
      const n = {
        type: 'note',
        id: id,
        label: noteMatch[2],
        x: parseFloat(noteMatch[3]),
        y: parseFloat(noteMatch[4]),
        w: parseFloat(noteMatch[5]),
        h: parseFloat(noteMatch[6]),
        color: null,
        textColor: null,
        line: lineNum
      };
      if (rest) parseProps(rest, n);
      result.notes.push(n);
      result.noteMap[id] = n;
      continue;
    }

    // ─── Transition / Note connection ───
    const transMatch = trimmed.match(/^(\S+)\s*->\s*(\S+)(.*)$/);
    if (transMatch) {
      const from = transMatch[1];
      const to = transMatch[2];
      const rest = transMatch[3].trim();

      // If source is in noteMap, it's a note connection
      if (result.noteMap[from]) {
        result.noteConnections.push({
          noteId: from,
          targetId: to,
          line: lineNum
        });
        continue;
      }

      // Parse optional : Event [Guard] / Action @kind
      let event = null, guard = null, action = null, kind = null;
      if (rest.startsWith(':')) {
        const detail = rest.slice(1).trim();
        // Parse @kind from the end
        const kindMatch = detail.match(/@(local|external|internal)\s*$/);
        let remaining = detail;
        if (kindMatch) {
          kind = kindMatch[1];
          remaining = detail.slice(0, detail.lastIndexOf('@' + kind)).trim();
        }
        // Parse / Action
        const slashIdx = remaining.indexOf('/');
        if (slashIdx !== -1) {
          action = remaining.slice(slashIdx + 1).trim() || null;
          remaining = remaining.slice(0, slashIdx).trim();
        }
        // Parse [Guard]
        const guardMatch = remaining.match(/\[([^\]]*)\]/);
        if (guardMatch) {
          guard = guardMatch[1].trim() || null;
          remaining = remaining.slice(0, remaining.indexOf('[')).trim();
        }
        // Remaining is the event
        event = remaining.trim() || null;
      }

      result.transitions.push({
        from: from,
        to: to,
        event: event,
        guard: guard,
        action: action,
        kind: kind || result.config.transition,
        label: rest.startsWith(':') ? rest.slice(1).trim() : null,
        line: lineNum
      });
      continue;
    }

    // ─── Unrecognized line ───
    result.errors.push({ line: lineNum, msg: 'Unrecognized syntax: ' + trimmed });
  }

  // Check for unclosed braces
  if (nestingStack.length > 0) {
    result.errors.push({ line: lines.length, msg: 'Unclosed composite state: ' + nestingStack.join(', ') });
  }

  return result;
}

/** Parse key=value props and apply them to target object */
function parseProps(propsStr, target) {
  // Match key=value pairs where value can be #HEX, word, or quoted
  const propRe = /(\w+)=(\S+)/g;
  let m;
  while ((m = propRe.exec(propsStr)) !== null) {
    const key = m[1];
    const val = m[2];
    switch (key) {
      case 'entry': target.entry = val; break;
      case 'do': target.do = val; break;
      case 'exit': target.exit = val; break;
      case 'color': target.color = val; break;
      case 'text': target.textColor = val; break;
      case 'border': target.borderColor = val; break;
      case 'round': target.round = parseFloat(val); break;
      case 'style': target.style = val; break;
    }
  }
}

/** Check if an ID already exists in any map; push error if duplicate */
function checkDuplicate(id, lineNum, result) {
  if (result.stateMap[id] || result.pseudoMap[id] || result.groupMap[id] || result.noteMap[id]) {
    result.errors.push({ line: lineNum, msg: 'Duplicate ID: ' + id });
    return true;
  }
  return false;
}

// ═══════════════════════════════════════════════
// Resolve dot-path state references
// ═══════════════════════════════════════════════
function resolveStateRef(dotPath, parsed) {
  if (parsed.stateMap[dotPath]) return parsed.stateMap[dotPath];
  if (parsed.pseudoMap[dotPath]) return parsed.pseudoMap[dotPath];
  const parts = dotPath.split('.');
  const leafId = parts[parts.length - 1];
  const candidates = parsed.states.filter(s => s.id === leafId);
  for (const c of candidates) {
    let match = true, cur = c;
    for (let i = parts.length - 2; i >= 0; i--) {
      if (!cur.parent || cur.parent !== parts[i]) { match = false; break; }
      cur = parsed.stateMap[cur.parent];
    }
    if (match) return c;
  }
  return null;
}
