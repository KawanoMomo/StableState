        tgtSide = 'bottom';
      } else {
        srcSide = 'right';
        tgtSide = 'right';
      }
    } else {
      const sides = computePortSide(srcBox, tgtBox);
      srcSide = sides.srcSide;
      tgtSide = sides.tgtSide;
    }
    transitionSides.push({ srcSide, tgtSide, srcBox, tgtBox, isSelf, isReverse });

    // Add to unified edge groups (both source and target edges)
    const srcKey = tr.from + ':' + srcSide;
    const tgtKey = tr.to + ':' + tgtSide;
    if (!edgeGroups[srcKey]) edgeGroups[srcKey] = [];
    edgeGroups[srcKey].push({ ti, dir: 'src' });
    if (!edgeGroups[tgtKey]) edgeGroups[tgtKey] = [];
    edgeGroups[tgtKey].push({ ti, dir: 'tgt' });
  }

  // ADR-015: Pre-build index maps for O(1) lookup instead of O(n) findIndex
  const edgeIndexMap = {}; // key: "groupKey:ti" -> index
  for (const key in edgeGroups) {
    const group = edgeGroups[key];
    for (let i = 0; i < group.length; i++) {
      edgeIndexMap[key + ':' + group[i].ti] = i;
    }
  }

  // Second pass: compute routes and render
  for (let ti = 0; ti < parsed.transitions.length; ti++) {
    const tr = parsed.transitions[ti];
    const info = transitionSides[ti];
    if (!info) continue;
    const dimTr = searchMatchIds && !searchMatchIds.has(tr.from) && !searchMatchIds.has(tr.to) ? ' opacity="0.2"' : '';
    svg += `<g${dimTr}>`;

    const { srcSide, tgtSide, srcBox, tgtBox, isSelf } = info;
    let route;

    if (isSelf) {
      route = buildSelfRoute(srcBox);
    } else {
      const srcKey = tr.from + ':' + srcSide;
      const tgtKey = tr.to + ':' + tgtSide;
      const srcEdge = edgeGroups[srcKey];
      const tgtEdge = edgeGroups[tgtKey];
      const srcIdx = edgeIndexMap[srcKey + ':' + ti];
      const tgtIdx = edgeIndexMap[tgtKey + ':' + ti];
      const fromPt = getPortPoint(srcBox, srcSide, srcIdx, srcEdge.length);
      const toPt = getPortPoint(tgtBox, tgtSide, tgtIdx, tgtEdge.length);
      // Channel offset based on position within unified group
      const channelSpacing = 10;
      const channelOffset = srcEdge.length <= 1 ? 0
        : (srcIdx - (srcEdge.length - 1) / 2) * channelSpacing;
      // Route index: count same-direction transitions between this pair for U-shape leg spread
      const dirKey = tr.from + '\u2192' + tr.to;
      if (!_dirIdx) var _dirIdx = {};
      if (_dirIdx[dirKey] == null) _dirIdx[dirKey] = 0;
      const routeIdx = _dirIdx[dirKey]++;
      route = buildRoute(fromPt, toPt, srcSide, tgtSide, channelOffset, routeIdx);
    }

    // Crossing detection: check this route against all previously rendered routes
    // Now handles BOTH horizontal and vertical segment crossings
    const bridgeR = 6;
    const crossings = []; // {segIdx, x, y, t, isHoriz} for this route's segments
    for (let si = 0; si < route.length - 1; si++) {
      const a1 = route[si], a2 = route[si + 1];
      for (const prevRoute of allRoutes) {
        for (let pi = 0; pi < prevRoute.length - 1; pi++) {
          const b1 = prevRoute[pi], b2 = prevRoute[pi + 1];
          const hit = segmentIntersection(a1, a2, b1, b2);
          if (hit) {
            const isHoriz = Math.abs(a2.y - a1.y) < Math.abs(a2.x - a1.x);
            const segLen = Math.hypot(a2.x - a1.x, a2.y - a1.y);
            const t = segLen > 0 ? Math.hypot(hit.x - a1.x, hit.y - a1.y) / segLen : 0;
            crossings.push({ segIdx: si, x: hit.x, y: hit.y, t: t, isHoriz: isHoriz });
          }
        }
      }
    }

    // Sort crossings by segment index, then by t within segment
    crossings.sort((a, b) => a.segIdx !== b.segIdx ? a.segIdx - b.segIdx : a.t - b.t);

    // Build SVG path
    const sw = tr.width || 1.5;
    const sc = tr.color || '#89DDFF';
    const dashAttr = tr.style === 'dashed' ? ' stroke-dasharray="6 3"' : '';
    const _amid = 'ah_' + sc.replace(/[^a-zA-Z0-9]/g, '');
    if (crossings.length === 0) {
      // Simple polyline
      const pts = route.map(p => `${p.x},${p.y}`).join(' ');
      svg += `<polyline points="${pts}" fill="none" stroke="${sc}" stroke-width="${sw}"${dashAttr} marker-end="url(#${_amid})"/>`;
    } else {
      // Path with bridge arcs (handles both horizontal and vertical crossings)
      let d = `M ${route[0].x},${route[0].y}`;
      for (let si = 0; si < route.length - 1; si++) {
        const a1 = route[si], a2 = route[si + 1];
        const segCrossings = crossings.filter(c => c.segIdx === si);
        if (segCrossings.length === 0) {
          d += ` L ${a2.x},${a2.y}`;
        } else {
          for (const cr of segCrossings) {
            if (cr.isHoriz) {
              // Horizontal segment: arc hops left-to-right over crossing
              const dir = a2.x > a1.x ? 1 : -1; // direction of travel
              const bx1 = cr.x - bridgeR * dir;
              const bx2 = cr.x + bridgeR * dir;
              d += ` L ${bx1},${cr.y}`;
              d += ` A ${bridgeR},${bridgeR} 0 0,${dir > 0 ? 1 : 0} ${bx2},${cr.y}`;
            } else {
              // Vertical segment: arc hops top-to-bottom over crossing
              const dir = a2.y > a1.y ? 1 : -1; // direction of travel
              const by1 = cr.y - bridgeR * dir;
              const by2 = cr.y + bridgeR * dir;
              d += ` L ${cr.x},${by1}`;
              d += ` A ${bridgeR},${bridgeR} 0 0,${dir > 0 ? 0 : 1} ${cr.x},${by2}`;
            }
          }
          // Line to end of segment
          d += ` L ${a2.x},${a2.y}`;
        }
      }
      svg += `<path d="${d}" fill="none" stroke="${sc}" stroke-width="${sw}"${dashAttr} marker-end="url(#${_amid})"/>`;
    }

    // Store route for future crossing detection
    allRoutes.push(route);

    // Labels — positioned at each route's own midpoint (routes are separated by port distribution)
    const hasLabel = tr.event || tr.guard || tr.action;
    if (hasLabel) {
      const mid = routeMidpoint(route);
      // Determine if the segment at midpoint is horizontal or vertical
      let midSegHoriz = true;
      for (let si = 1; si < route.length; si++) {
        const a = route[si - 1], b = route[si];
        const segLen = Math.hypot(b.x - a.x, b.y - a.y);
        const distToA = Math.hypot(mid.x - a.x, mid.y - a.y);
        const distToB = Math.hypot(mid.x - b.x, mid.y - b.y);
        if (distToA + distToB < segLen + 2) {
          midSegHoriz = Math.abs(b.y - a.y) < Math.abs(b.x - a.x);
          break;
        }
      }
      // For horizontal segments: label above/below the line
      // For vertical segments: label to the left/right of the line
      const labelLines = [];
      if (tr.event) labelLines.push({ text: tr.event, color: '#FFCB6B', size: 10 });
      const guardAction = [];
      if (tr.guard) guardAction.push('[' + tr.guard + ']');
      if (tr.action) guardAction.push('/ Act');
      if (guardAction.length > 0) {
        labelLines.push({ text: guardAction.join(' '), color: '#C3E88D', size: 9 });
      }
      // Show transition kind if non-default
      if (tr.kind && tr.kind !== parsed.config.transition) {
        labelLines.push({ text: '@' + tr.kind, color: '#F59E0B', size: 8 });
      }
      if (midSegHoriz) {
        for (let li = 0; li < labelLines.length; li++) {
          const ll = labelLines[li];
          const ly = mid.y - 6 - (labelLines.length - 1 - li) * 13;
          svg += `<text x="${mid.x}" y="${ly}" text-anchor="middle" font-family="${sans}" font-size="${ll.size}" fill="${ll.color}" style="pointer-events:none">${esc(ll.text)}</text>`;
        }
      } else {
        for (let li = 0; li < labelLines.length; li++) {
          const ll = labelLines[li];
          const ly = mid.y + li * 13;
          svg += `<text x="${mid.x + 8}" y="${ly}" text-anchor="start" font-family="${sans}" font-size="${ll.size}" fill="${ll.color}" style="pointer-events:none">${esc(ll.text)}</text>`;
        }
      }
    }
    svg += `</g>`;
  }

  // ─── 7. Note connections (dashed lines, no arrowheads) ───
  if (annotationMode) {
    for (const nc of parsed.noteConnections) {
      const noteEl = parsed.noteMap[nc.noteId];
      if (!noteEl) continue;
      const tgtBox = getBox(nc.targetId);
      if (!tgtBox) continue;
      const notePos = getAbsolutePos(noteEl, parsed);
      const noteBox = { x: notePos.x, y: notePos.y, w: noteEl.w * g, h: noteEl.h * g };
      const sides = computePortSide(noteBox, tgtBox);
      const fromPt = getPortPoint(noteBox, sides.srcSide, 0, 1);
      const toPt = getPortPoint(tgtBox, sides.tgtSide, 0, 1);
      const route = buildRoute(fromPt, toPt, sides.srcSide, sides.tgtSide);
      const pts = route.map(p => `${p.x},${p.y}`).join(' ');
      svg += `<polyline points="${pts}" fill="none" stroke="#FCD34D" stroke-width="1" stroke-dasharray="6,3"/>`;
    }
  }

  // ─── 8. Resize handles (for selected elements) ───
  sel.forEach(si => {
    const it = getItem(si);
    if (!it || it.w == null || it.h == null) return;
    const isNote = si.type === 'note';
    if (isNote && !annotationMode) return;
    if (!isNote && annotationMode) return;
    const pos = getAbsolutePos(it, parsed);
    const w = it.w * g, h = it.h * g;
    const hs = 10, hitS = 20;
    const hColor = isNote ? '#F59E0B' : '#6366F1';
    const handles = [
      {cx:pos.x,cy:pos.y,cur:'nw-resize',edge:'nw'},{cx:pos.x+w,cy:pos.y,cur:'ne-resize',edge:'ne'},
      {cx:pos.x,cy:pos.y+h,cur:'sw-resize',edge:'sw'},{cx:pos.x+w,cy:pos.y+h,cur:'se-resize',edge:'se'},
      {cx:pos.x+w/2,cy:pos.y,cur:'n-resize',edge:'n'},{cx:pos.x+w/2,cy:pos.y+h,cur:'s-resize',edge:'s'},
      {cx:pos.x,cy:pos.y+h/2,cur:'w-resize',edge:'w'},{cx:pos.x+w,cy:pos.y+h/2,cur:'e-resize',edge:'e'},
    ];
    handles.forEach(hd => {
      svg += `<rect data-resize="${hd.edge}" data-rid="${si.id}" data-rtype="${si.type}" x="${hd.cx-hitS/2}" y="${hd.cy-hitS/2}" width="${hitS}" height="${hitS}" fill="transparent" style="cursor:${hd.cur}"/>`;
      svg += `<rect x="${hd.cx-hs/2}" y="${hd.cy-hs/2}" width="${hs}" height="${hs}" fill="${hColor}" stroke="#fff" stroke-width="1.5" rx="2" style="pointer-events:none"/>`;
    });
  });

  // ─── 9. Snap guides ───
  if (snapGuides && snapGuides.length > 0) {
    for (const sg of snapGuides) {
      if (sg.axis === 'x') {
        svg += `<line x1="${sg.pos}" y1="0" x2="${sg.pos}" y2="${canvas.height}" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>`;
      } else {
        svg += `<line x1="0" y1="${sg.pos}" x2="${canvas.width}" y2="${sg.pos}" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>`;
      }
    }
  }

  // ─── 8. Notes (annotation layer — rendered ABOVE transitions) ───
  if (annotationMode && parsed.notes.length > 0) {
    for (const n of parsed.notes) {
      const pos = getAbsolutePos(n, parsed);
      const pw = n.w * g;
      const ph = n.h * g;
      const fill = n.color || '#FEF3C7';
      const borderClr = n.borderColor || '#D97706';
      const textClr = n.textColor || '#92400E';
      const elSel = isSelected(n.id);
      const strokeClr = elSel ? '#F59E0B' : borderClr;
      const strokeW = elSel ? 2.5 : 1;
      const noteShadow = elSel ? 'filter:drop-shadow(0 4px 12px rgba(245,158,11,0.5))' : 'filter:drop-shadow(0 1px 2px rgba(0,0,0,0.08))';
      svg += `<g data-type="note" data-id="${n.id}" style="cursor:${annotationMode?'grab':'default'}">`;
      svg += `<rect x="${pos.x}" y="${pos.y}" width="${pw}" height="${ph}" rx="0" ry="0" fill="${esc(fill)}" stroke="${esc(strokeClr)}" stroke-width="${strokeW}" stroke-dasharray="4,2" style="${noteShadow}"/>`;
      const lines = n.label.split('\\n');
      for (let li = 0; li < lines.length; li++) {
        const ty = pos.y + 6 + li * 14 + 10;
        svg += `<text x="${pos.x + 6}" y="${ty}" text-anchor="start" font-family="${sans}" font-size="11" font-weight="400" fill="${esc(textClr)}" style="pointer-events:none">${esc(lines[li])}</text>`;
      }
      svg += `</g>`;
    }
  }

  // ─── 9. Annotation mode indicator (top banner, excluded from export) ───
  if (annotationMode) {
    svg += `<g id="annotation-banner" style="pointer-events:none">`;
    svg += `<rect x="0" y="0" width="${canvas.width}" height="24" fill="#F59E0B" fill-opacity="0.15"/>`;
    svg += `<text x="${canvas.width/2}" y="16" text-anchor="middle" font-family="${sans}" font-size="11" font-weight="600" fill="#F59E0B" style="pointer-events:none">ANNOTATION MODE — states are locked, press N to exit</text>`;
    svg += `</g>`;
  }

  svg += '</svg>';
  return svg;
}

// ═══════════════════════════════════════════════
// Table Renderer
// ═══════════════════════════════════════════════
function renderTable(parsed) {
  const tableEl = document.getElementById('state-table');
  const emptyEl = document.getElementById('table-empty');
  if (!parsed || !tableEl) return;

  // If orthogonal mode, show warning
  if (parsed.config.orthogonal) {
    tableEl.innerHTML = '';
    emptyEl.style.display = 'flex';
    emptyEl.textContent = '直交領域が有効なため、状態遷移表の自動生成はサポートされません';
    return;
  }

  // ─── Build state tree for columns ───
  // Collect leaf states (depth-first) and parent grouping info
  const leafColumns = [];   // [{id, state, parents: [{id, label, span}]}]
  const parentRows = [];    // will be filled with arrays for header rows

  // Determine initial states: find targets of transitions from initial pseudo-states
  const initialTargets = new Set();
  for (const t of parsed.transitions) {
    const fromEl = parsed.pseudoMap[t.from];
    if (fromEl && fromEl.type === 'initial') {
      // Resolve the target
      const tgt = resolveStateRef(t.to, parsed);
      if (tgt) initialTargets.add(tgt.id);
    }
  }

  // Depth-first walk: composite states also get a self-column at child depth
  function walkState(st, depth) {
    if (st.children.length === 0) {
      leafColumns.push({ id: st.id, state: st, depth: depth, isInitial: initialTargets.has(st.id) });
    } else {
      leafColumns.push({ id: st.id, state: st, depth: depth + 1, isInitial: false, isSelf: true });
      for (const childId of st.children) {
        const child = parsed.stateMap[childId];
        if (child) walkState(child, depth + 1);
      }
    }
  }

  const rootStates = parsed.states.filter(s => s.parent === null);
  for (const rs of rootStates) {
    walkState(rs, 0);
  }

  // Insert virtual ROOT column at the beginning (table only, not in diagram)
  const rootVirtual = { id: '__ROOT__', label: 'ROOT', parent: null, children: [], entry: null, do: null, exit: null };
  leafColumns.unshift({ id: '__ROOT__', state: rootVirtual, depth: 0, isInitial: false, isRoot: true });

  if (leafColumns.length <= 1) {
    tableEl.innerHTML = '';
    emptyEl.style.display = 'flex';
    emptyEl.textContent = 'DSLをパースして状態遷移表を生成します';
    return;
  }
  emptyEl.style.display = 'none';

  // ─── Build multi-level header with rowspan for shallow leaves ───
  let maxDepth = 0;
  for (const lc of leafColumns) {
    if (lc.depth > maxDepth) maxDepth = lc.depth;
  }
  const totalHeaderRows = maxDepth + 1; // depth 0..maxDepth

  // For each column, compute ancestry chain (chain.length must equal lc.depth)
  const ancestries = leafColumns.map(function(lc) {
    const chain = [];
    if (lc.isSelf) chain.push(lc.state); // self column includes itself as ancestor
    let cur = lc.state;
    while (cur.parent) {
      const p = parsed.stateMap[cur.parent];
      if (p) { chain.unshift(p); cur = p; }
      else break;
    }
    return chain;
  });

  // Build a cell grid: headerCells[row][col] = {label, colspan, rowspan, stateId} or null (covered by span)
  const numCols = leafColumns.length;
  const headerCells = [];
  for (let r = 0; r < totalHeaderRows; r++) {
    headerCells.push(new Array(numCols).fill(null));
  }

  // Fill ancestry cells (parent grouping) then leaf cells
  // Process column by column
  for (let ci = 0; ci < numCols; ci++) {
    const chain = ancestries[ci]; // length = leafColumns[ci].depth
    const lc = leafColumns[ci];

    // Place ancestors at their depth rows
    for (let ai = 0; ai < chain.length; ai++) {
      headerCells[ai][ci] = { label: chain[ai].label, stateId: chain[ai].id, colspan: 1, rowspan: 1, placed: false };
    }

    // Place leaf at its depth row, spanning down to the last header row
    const leafRow = lc.depth;
    const prefix = lc.isInitial ? '>' : '';
    headerCells[leafRow][ci] = {
      label: lc.isSelf ? '' : prefix + lc.state.label,
      stateId: lc.isSelf ? lc.id + '_self' : lc.id,
      colspan: 1,
      rowspan: totalHeaderRows - leafRow,
      placed: false
    };
    // Mark rows below as covered
    for (let r = leafRow + 1; r < totalHeaderRows; r++) {
      headerCells[r][ci] = 'covered';
    }
  }

  // Merge consecutive identical parent cells horizontally (colspan)
  for (let r = 0; r < totalHeaderRows; r++) {
    for (let ci = 0; ci < numCols; ci++) {
      const cell = headerCells[r][ci];
      if (!cell || cell === 'covered' || cell.placed) continue;
      let span = 1;
      while (ci + span < numCols) {
        const next = headerCells[r][ci + span];
        if (next && next !== 'covered' && !next.placed && next.stateId === cell.stateId && next.rowspan === cell.rowspan) {
          headerCells[r][ci + span] = 'covered';
          span++;
        } else break;
      }
      cell.colspan = span;
    }
  }

  // ─── Collect events ───
  // Events are all unique event names from transitions (excluding initial pseudo-state transitions)
  const eventSet = new Map(); // event -> [{transition}]
  for (const t of parsed.transitions) {
    const fromEl = parsed.pseudoMap[t.from];
    if (fromEl && fromEl.type === 'initial') continue; // skip initial transitions
    const evName = t.event || '(none)';
    if (!eventSet.has(evName)) eventSet.set(evName, []);
    eventSet.get(evName).push(t);
  }

  // ─── Calculate column widths ───
  function calcMinWidth(text) {
    const charCount = (text || '-').length;
    return Math.max(tableCellWidth, charCount * 8);
  }

  // ─── Build header HTML (thead with sticky positioning) ───
  let headHtml = '';
  for (let r = 0; r < totalHeaderRows; r++) {
    headHtml += '<tr>';
    if (r === 0) headHtml += `<th rowspan="${totalHeaderRows}"></th>`;
    for (let ci = 0; ci < numCols; ci++) {
      const cell = headerCells[r][ci];
      if (!cell || cell === 'covered') continue;
      const isLeaf = cell.rowspan >= totalHeaderRows - r;
      const mw = isLeaf ? calcMinWidth(cell.label) : 0;
      const style = mw > 0 ? ` style="min-width:${mw}px"` : '';
      headHtml += `<th colspan="${cell.colspan}" rowspan="${cell.rowspan}"${style}>${esc(cell.label)}</th>`;
    }
    headHtml += '</tr>';
  }

  // ─── Build body HTML ───
  let bodyHtml = '';

  // ─── Entry / Do / Exit rows ───
  ['entry', 'do', 'exit'].forEach(function(field) {
    bodyHtml += `<tr><td style="font-weight:600;color:var(--accent)">${field}</td>`;
    for (const lc of leafColumns) {
      const val = lc.state[field] || '-';
      const mw = calcMinWidth(val);
      bodyHtml += `<td class="table-editable" data-field="${field}" data-state="${lc.id}" style="min-width:${mw}px;cursor:pointer">${esc(val).replace(/\\n/g, '<br>')}</td>`;
    }
    bodyHtml += '</tr>';
  });

  // Separator
  bodyHtml += '<tr><td colspan="' + (leafColumns.length + 1) + '" style="border:none;height:4px;background:var(--accent);padding:0"></td></tr>';

  // ─── Event blocks ───
  for (const [evName, transitions] of eventSet) {
    // Event name row (spans full width)
    bodyHtml += `<tr class="ev-header"><td style="font-weight:600;color:#FFCB6B;padding:4px 10px">${esc(evName)}</td><td colspan="${leafColumns.length}" style="border-left:none"></td></tr>`;

    // Guard row with label
    bodyHtml += '<tr class="ev-row"><td style="color:#6B7280;padding-left:16px">guard</td>';
    for (const lc of leafColumns) {
      const matching = transitions.filter(function(t) {
        const fromEl = resolveStateRef(t.from, parsed);
        return fromEl && fromEl.id === lc.id;
      });
      const val = matching.length > 0 && matching[0].guard ? matching[0].guard : '-';
      bodyHtml += `<td class="table-editable" data-field="guard" data-state="${lc.id}" data-event="${esc(evName)}" style="cursor:pointer;color:#C3E88D">${esc(val).replace(/\\n/g, '<br>')}</td>`;
    }
    bodyHtml += '</tr>';

    // Action row with label
    bodyHtml += '<tr class="ev-row"><td style="color:#6B7280;padding-left:16px">action</td>';
    for (const lc of leafColumns) {
      const matching = transitions.filter(function(t) {
        const fromEl = resolveStateRef(t.from, parsed);
        return fromEl && fromEl.id === lc.id;
      });
      const val = matching.length > 0 && matching[0].action ? matching[0].action : '-';
      bodyHtml += `<td class="table-editable" data-field="action" data-state="${lc.id}" data-event="${esc(evName)}" style="cursor:pointer;color:#C3E88D">${esc(val).replace(/\\n/g, '<br>')}</td>`;
    }
    bodyHtml += '</tr>';

    // Target row with label
    bodyHtml += '<tr class="ev-row"><td style="color:#6B7280;padding-left:16px">target</td>';
    for (const lc of leafColumns) {
      const matching = transitions.filter(function(t) {
        const fromEl = resolveStateRef(t.from, parsed);
        return fromEl && fromEl.id === lc.id;
      });
      let val = '-';
      if (matching.length > 0) {
        if (matching[0].kind === 'internal') {
          val = '-';
        } else {
          const tgtEl = resolveStateRef(matching[0].to, parsed);
          val = tgtEl ? tgtEl.label || tgtEl.id : matching[0].to;
          if (matching[0].kind && matching[0].kind !== parsed.config.transition) {
            val += ' @' + matching[0].kind;
          }
        }
      }
      bodyHtml += `<td class="table-editable" data-field="target" data-state="${lc.id}" data-event="${esc(evName)}" style="cursor:pointer">${esc(val)}</td>`;
    }
    bodyHtml += '</tr>';
  }

  // ─── Render single table ───
  tableEl.innerHTML = '<thead>' + headHtml + '</thead><tbody>' + bodyHtml + '</tbody>';

  // ─── Scroll-driven header freeze (translateY on thead) ───
  const tableWrap = document.getElementById('table-wrap');
  const thead = tableEl.querySelector('thead');
  if (tableWrap && thead) {
    tableWrap.addEventListener('scroll', function() {
      thead.style.transform = 'translateY(' + (tableWrap.scrollTop / tableZoom) + 'px)';
    });
  }

  // ─── Apply current table zoom ───
  if (tableEl) tableEl.style.zoom = tableZoom;

  // ─── Wire up cell click → show editor in property panel ───
  let selectedCell = null;
  tableEl.querySelectorAll('.table-editable').forEach(function(cell) {
    cell.addEventListener('click', function() {
      // Highlight selected cell
      if (selectedCell) selectedCell.style.outline = '';
      selectedCell = this;
      this.style.outline = '2px solid var(--accent)';

      const field = this.dataset.field;
      const stateId = this.dataset.state;
      const evName = this.dataset.event;
      const rawHtml = this.innerHTML;
      const currentText = rawHtml === '-' ? '' : rawHtml.replace(/<br>/g, '\\n');

      // Render editor in property panel
      const panel = document.getElementById('prop-content');
      const isStateField = (field === 'entry' || field === 'do' || field === 'exit');
      const isAction = isStateField || field === 'action';
      const st = parsed.stateMap[stateId];
      const stLabel = st ? st.label : stateId;

      let html = `<div class="prop-section"><div class="prop-label">${esc(stLabel)}</div>`;

      if (isStateField) {
        // entry/do/exit — single textarea
        html += `<div class="prop-sub" style="margin-bottom:4px">${esc(field)}</div>`;
        html += `<textarea class="prop-input" id="pp-table-edit" style="height:80px;resize:vertical;font-size:11px;line-height:1.4;text-align:left">${esc(currentText).replace(/\\n/g, '\n')}</textarea>`;
        html += `<button class="tb tb-accent" id="pp-table-apply" style="width:100%;margin-top:6px">適用</button>`;
        html += `</div>`;
        panel.innerHTML = html;
        document.getElementById('pp-table-edit').focus();
        document.getElementById('pp-table-apply').addEventListener('click', function() {
          const newVal = document.getElementById('pp-table-edit').value.replace(/\n/g, '\\n').trim();
          pushHistory();
          let dsl = getDsl();
          if (newVal) { dsl = updateProp('state', stateId, field, newVal, dsl); }
          else { dsl = dsl.replace(new RegExp(`(^\\s*state\\s+${stateId}\\s+.*)\\b${field}=\\S+`, 'm'), '$1'); }
          setDsl(dsl);
          refresh();
        });
        return;
      }

      // Transition fields — unified target/guard/action form
      const mt = parsed.transitions.filter(function(t) {
        const fromEl = resolveStateRef(t.from, parsed);
        return fromEl && fromEl.id === stateId && (t.event || '(none)') === evName;
      });
      const existing = mt.length > 0 ? mt[0] : null;
      const curGuard = existing ? existing.guard || '' : '';
      const curAction = existing ? existing.action || '' : '';
      const curTargetId = existing ? (existing.kind === 'internal' ? '' : (resolveStateRef(existing.to, parsed) || {}).id || '') : '';

      html += `<div class="prop-sub" style="margin-bottom:4px">${esc(evName || '')}</div>`;
      html += `<div class="prop-sub">target</div>`;
      html += `<select class="prop-select" id="pp-table-target"><option value="">- (@internal)</option>`;
      for (const s of parsed.states) {
        const isSel = s.id === curTargetId ? ' selected' : '';
        html += `<option value="${esc(s.id)}"${isSel}>${esc(s.label)} (${esc(s.id)})</option>`;
      }
      html += `</select>`;
      html += `<div class="prop-sub" style="margin-top:4px">[guard]</div>`;
      html += `<input class="prop-input" id="pp-table-guard" value="${esc(curGuard)}" placeholder="ガード条件">`;
      html += `<div class="prop-sub" style="margin-top:4px">/ action</div>`;
      html += `<textarea class="prop-input" id="pp-table-action" style="height:60px;resize:vertical;font-size:11px;line-height:1.4;text-align:left" placeholder="アクション">${esc(curAction).replace(/\\n/g, '\n')}</textarea>`;
      html += `<button class="tb tb-accent" id="pp-table-apply" style="width:100%;margin-top:6px">適用</button>`;
      if (existing) html += `<button class="tb" id="pp-table-delete" style="width:100%;margin-top:4px;border-color:#EF4444;color:#FCA5A5">遷移を削除</button>`;
      html += `</div>`;
      panel.innerHTML = html;

      if (field === 'guard') document.getElementById('pp-table-guard').focus();
      else if (field === 'action') document.getElementById('pp-table-action').focus();
      else document.getElementById('pp-table-target').focus();

      document.getElementById('pp-table-apply').addEventListener('click', function() {
        const target = document.getElementById('pp-table-target').value;
        const guard = document.getElementById('pp-table-guard').value.trim();
        const action = document.getElementById('pp-table-action').value.replace(/\n/g, '\\n').trim();
        let targetId, kind = null;
        if (!target) { targetId = stateDotPath(stateId); kind = 'internal'; }
        else { targetId = stateDotPath(target); }
        const ev = evName === '(none)' ? null : evName;
        pushHistory();
        let dsl = getDsl();
        if (existing) {
          dsl = replaceTransition(existing.from, existing.to, existing.event, existing.guard,
            stateDotPath(stateId), targetId, ev, guard || null, action || null, kind, dsl);
        } else {
          dsl = addTransition(stateDotPath(stateId), targetId, ev, guard || null, action || null, kind, dsl);
        }
        setDsl(dsl);
        refresh();
      });
      if (existing) {
        document.getElementById('pp-table-delete').addEventListener('click', function() {
          pushHistory();
          let dsl = getDsl();
          dsl = removeTransition(existing.from, existing.to, existing.event, existing.guard, dsl);
          setDsl(dsl);
          refresh();
        });
      }
    });
  });
}

// ═══════════════════════════════════════════════
// Property Panel
// ═══════════════════════════════════════════════
function renderProps() {
  if (!parsed) return;
  const panel = document.getElementById('prop-content');
  let html = '';

  // ─── Selection-dependent section ───
  const selArr = sel.map(s => s.id);

  if (selArr.length === 0) {
    if (annotationMode) {
      html += `<div class="prop-section"><div class="prop-label">Annotation Mode</div>`;
      html += `<div class="prop-sub">Click notes to select. States are locked.</div>`;
      html += `</div>`;
    } else {
      // Canvas size editor
      const cv = parsed.canvas;
      html += `<div class="prop-section"><div class="prop-label">Canvas</div>`;
      html += `<div class="prop-row">`;
      html += `<div style="flex:1"><div class="prop-sub">W</div><input type="number" class="prop-input" id="pp-canvas-w" value="${cv.width}" min="100" step="20"></div>`;
      html += `<div style="flex:1"><div class="prop-sub">H</div><input type="number" class="prop-input" id="pp-canvas-h" value="${cv.height}" min="100" step="20"></div>`;
      html += `</div>`;
      html += `<div class="prop-row" style="margin-top:4px">`;
      html += `<div style="flex:1"><div class="prop-sub">Grid</div><input type="number" class="prop-input" id="pp-canvas-g" value="${cv.grid}" min="5" step="5"></div>`;
      html += `</div></div>`;
      // Add element buttons
      html += `<div class="prop-section">`;
      html += `<button class="tb tb-accent" style="width:100%;margin-bottom:4px" onclick="addNewElement('state')">+ 状態追加</button>`;
      html += `<button class="tb" style="width:100%" onclick="addNewElement('group')">+ グループ追加</button>`;
      html += `</div>`;
      html += `<div class="prop-section" style="margin-top:8px;border-top:1px solid var(--border);padding-top:8px">`;
      html += `<div class="prop-label">Shortcuts</div>`;
      html += `<div class="prop-sub" style="line-height:1.8">`;
      html += `Ctrl+Z Undo<br>Ctrl+Y / Ctrl+Shift+Z Redo<br>`;
      html += `Ctrl+C Copy<br>Ctrl+X Cut<br>Ctrl+V Paste<br>`;
      html += `Del Delete<br>Ctrl+A Select All<br>`;
      html += `Arrow Move<br>H Highlight<br>N Notes`;
      html += `</div></div>`;
    }
  } else if (selArr.length === 1) {
    const id = selArr[0];
    const el = parsed.stateMap[id] || parsed.pseudoMap[id] || parsed.groupMap[id] || parsed.noteMap[id];
    if (!el) {
      html += `<div class="prop-section"><div class="prop-label">Selected</div><div class="prop-sub">${esc(id)} (not found)</div></div>`;
    } else if (parsed.stateMap[id]) {
      // ── State selected ──
      const st = parsed.stateMap[id];
      html += `<div class="prop-section"><div class="prop-label">State</div>`;
      html += `<div class="prop-row"><input class="prop-input" value="${esc(st.id)}" readonly style="opacity:0.6"></div>`;
      html += `<div class="prop-row"><input class="prop-input" id="pp-label" value="${esc(st.label)}" placeholder="Label"></div>`;
      html += `</div>`;
      html += `<div class="prop-section"><div class="prop-label">Position</div>`;
      html += `<div class="prop-row"><input type="number" class="prop-input" id="pp-x" value="${st.x}" placeholder="X" style="width:50%"><input type="number" class="prop-input" id="pp-y" value="${st.y}" placeholder="Y" style="width:50%"></div>`;
      html += `</div>`;
      html += `<div class="prop-section"><div class="prop-label">Size</div>`;
      html += `<div class="prop-row"><input type="number" class="prop-input" id="pp-w" value="${st.w}" placeholder="W" style="width:50%"><input type="number" class="prop-input" id="pp-h" value="${st.h}" placeholder="H" style="width:50%"></div>`;
      html += `</div>`;

    const val = this.value.trim();

      dsl = updateProp(info.type, info.id, 'text', val, dsl);
    } else {
      const re = new RegExp(`(^\\s*${info.type}\\s+${info.id}\\s+.*)\\btext=\\S+`, 'm');
      dsl = dsl.replace(re, '$1');
    }
    setDsl(dsl);
    refreshView();
  });

  // Style dropdown
  propChange('pp-style', function() {
    const info = getElTypeAndId();
    if (!info) return;
    pushHistory();
    let dsl = getDsl();
    const val = this.value;
    if (val) {
      dsl = updateProp(info.type, info.id, 'style', val, dsl);
    } else {
      const re = new RegExp(`(^\\s*${info.type}\\s+${info.id}\\s+.*)\\bstyle=\\S+`, 'm');
      dsl = dsl.replace(re, '$1');
    }
    setDsl(dsl);
    refreshView();
  });

  // Round
  propChange('pp-round', function() {
    const info = getElTypeAndId();
    if (!info) return;
    pushHistory();
    let dsl = getDsl();
    const val = this.value.trim();
    if (val) {
      dsl = updateProp(info.type, info.id, 'round', val, dsl);
    } else {
      const re = new RegExp(`(^\\s*${info.type}\\s+${info.id}\\s+.*)\\bround=\\S+`, 'm');
      dsl = dsl.replace(re, '$1');
    }
    setDsl(dsl);
    refreshView();
  });

  // ─── Config change handlers ───
  propChange('pp-cfg-transition', function() {
    pushHistory();
    let dsl = getDsl();
    const val = this.value;
    if (/^@config\s+transition=/m.test(dsl)) {
      dsl = dsl.replace(/^(@config\s+transition=)\S+/m, `$1${val}`);
    } else {
      // Add config line after @canvas
      dsl = dsl.replace(/^(@canvas\s+.*)$/m, `$1\n@config transition=${val}`);
    }
    setDsl(dsl);
    refresh();
  });

  const orthEl = document.getElementById('pp-cfg-orthogonal');
  if (orthEl) orthEl.addEventListener('change', function() {
    pushHistory();
    let dsl = getDsl();
    const val = this.checked ? 'true' : 'false';
    if (/^@config\s+orthogonal=/m.test(dsl)) {
      dsl = dsl.replace(/^(@config\s+orthogonal=)\S+/m, `$1${val}`);
    } else {
      dsl = dsl.replace(/^(@canvas\s+.*)$/m, `$1\n@config orthogonal=${val}`);
    }
    setDsl(dsl);
    refresh();
  });

  const histEl = document.getElementById('pp-cfg-history');
  if (histEl) histEl.addEventListener('change', function() {
    pushHistory();
    let dsl = getDsl();
    const val = this.checked ? 'true' : 'false';
    if (/^@config\s+history=/m.test(dsl)) {
      dsl = dsl.replace(/^(@config\s+history=)\S+/m, `$1${val}`);
    } else {
      dsl = dsl.replace(/^(@canvas\s+.*)$/m, `$1\n@config history=${val}`);
    }
    setDsl(dsl);
    refresh();
  });
}

// Export (SVG, PNG, Clipboard)

function exportDSL() {
  const text = getDsl();
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'stablestate.sstate';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importDSL(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    pushHistory();
    setDsl(ev.target.result);
    refresh();
  };
  reader.readAsText(file);
  input.value = '';
}

function getExportSVGString() {
  const svgEl = document.querySelector('#svg-wrap svg');
  if (!svgEl) return null;
  const clone = svgEl.cloneNode(true);
  const banner = clone.querySelector('#annotation-banner');
  if (banner) banner.remove();
  return new XMLSerializer().serializeToString(clone);
}

function exportSVG() {
  const svgStr = getExportSVGString();
  if (!svgStr) return;
  const blob = new Blob([svgStr], { type: 'image/svg+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'stablestate.svg';
  a.click();
  URL.revokeObjectURL(a.href);
}

function exportPNG() {
  const svgStr = getExportSVGString();
  if (!svgStr || !parsed) return;
  const canvas = document.createElement('canvas');
  canvas.width = parsed.canvas.width;
  canvas.height = parsed.canvas.height;
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.onload = function() {
    ctx.drawImage(img, 0, 0);
    canvas.toBlob(function(blob) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'stablestate.png';
      a.click();
      URL.revokeObjectURL(a.href);
    });
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
}

async function copyPNG() {
  const svgStr = getExportSVGString();
  if (!svgStr || !parsed) return;
  const canvas = document.createElement('canvas');
  canvas.width = parsed.canvas.width;
  canvas.height = parsed.canvas.height;
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.onload = async function() {
    ctx.drawImage(img, 0, 0);
    canvas.toBlob(async function(blob) {
      try {
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      } catch(e) { console.error('Clipboard write failed:', e); }
    });
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
}

// ═══════════════════════════════════════════════
// PlantUML Export
// ═══════════════════════════════════════════════
function exportPlantUML(p) {
  const data = p || parsed;
  if (!data) return;
  const initialIds = new Set(data.pseudoStates.filter(ps => ps.type === 'initial').map(ps => ps.id));
  const finalIds = new Set(data.pseudoStates.filter(ps => ps.type === 'final').map(ps => ps.id));
  const lines = ['@startuml'];

  function renderState(st, indent) {
    const pad = '  '.repeat(indent);
    if (st.children.length > 0) {
      lines.push(pad + 'state "' + st.label + '" as ' + st.id + ' {');
      for (const childId of st.children) {
        const child = data.stateMap[childId];
        if (child) renderState(child, indent + 1);
      }
      lines.push(pad + '}');
    } else {
      lines.push(pad + 'state "' + st.label + '" as ' + st.id);
    }
  }

  for (const st of data.states.filter(s => s.parent === null)) renderState(st, 0);
  for (const ps of data.pseudoStates.filter(p2 => p2.type === 'choice')) lines.push('state ' + ps.id + ' <<choice>>');
  lines.push('');

  for (const tr of data.transitions) {
    const from = initialIds.has(tr.from) ? '[*]' : tr.from;
    const to = finalIds.has(tr.to) ? '[*]' : tr.to;
    let label = '';
    if (tr.event || tr.guard || tr.action) {
      const parts = [];
      if (tr.event) parts.push(tr.event);
      if (tr.guard) parts.push('[' + tr.guard + ']');
      if (tr.action) parts.push('/ ' + tr.action);
      label = ' : ' + parts.join(' ');
    }
    lines.push(from + ' --> ' + to + label);
  }
  lines.push('@enduml');
  const text = lines.join('\n');

  // Download as .puml file
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'stablestate.puml';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ═══════════════════════════════════════════════
// Excel Export (SheetJS — dynamic CDN load)
// ═══════════════════════════════════════════════
function buildExcelData(p) {
  const data = p || parsed;
  if (!data) return { rows: [], styles: [] };

  // Collect leaf columns (same as renderTable)
  const leafCols = [];
  const initialTargets = new Set();
  for (const t of data.transitions) {
    const fromEl = data.pseudoMap[t.from];
    if (fromEl && fromEl.type === 'initial') {
      const tgt = resolveStateRef(t.to, data);
      if (tgt) initialTargets.add(tgt.id);
    }
  }
  function walk(st) {
    if (st.children.length === 0) leafCols.push(st);
    else st.children.forEach(function(cid) { const c = data.stateMap[cid]; if (c) walk(c); });
  }
  data.states.filter(s => s.parent === null).forEach(function(s) { walk(s); });

  // Find max depth
  function getDepth(st) { let d = 0, cur = st; while (cur.parent) { cur = data.stateMap[cur.parent]; d++; } return d; }
  let maxDepth = 0;
  leafCols.forEach(function(lc) { const d = getDepth(lc); if (d > maxDepth) maxDepth = d; });
  const headerRows = maxDepth + 1;

  const rows = [];
  const styles = []; // parallel: styles[rowIdx][colIdx] = {bg, fg, bold, indent}

  // Color palette matching PwrMgr.xlsx
  const CLR = {
    headerBg: 'D9E2F3', headerFg: '000000', initialFg: 'C00000',
    actionLabelBg: 'FFF2CC', actionDataBg: 'FFF9C4',
    eventBg: 'FCE4EC', subRowBg: 'FFF0F5', subRowFg: '808080',
    dataFg: '000000',
  };

  // ── Header rows ──
  for (let r = 0; r < headerRows; r++) {
    const row = [''];
    const sty = [{ bg: CLR.headerBg }];
    for (let ci = 0; ci < leafCols.length; ci++) {
      const lc = leafCols[ci];
      const chain = [];
      let cur = lc;
      while (cur.parent) { const pp = data.stateMap[cur.parent]; if (pp) { chain.unshift(pp); cur = pp; } else break; }
      // chain = ancestors, lc = leaf. chain.length = depth
      const depth = chain.length;
      const leafRow = depth; // row where leaf label appears
      if (r < depth) {
        // ancestor row — show ancestor label (only first column of its span)
        const anc = chain[r];
        // Check if previous column has the same ancestor at this depth
        if (ci > 0) {
          const prevLc = leafCols[ci - 1];
          const prevChain = [];
          let pcur = prevLc;
          while (pcur.parent) { const pp = data.stateMap[pcur.parent]; if (pp) { prevChain.unshift(pp); pcur = pp; } else break; }
          if (r < prevChain.length && prevChain[r].id === anc.id) {
            row.push(''); // same group, empty
            sty.push({ bg: CLR.headerBg });
            continue;
          }
        }
        row.push(anc.label);
        sty.push({ bg: CLR.headerBg });
      } else if (r === leafRow) {
        const prefix = initialTargets.has(lc.id) ? '>' : '';
        row.push(prefix + lc.label);
        sty.push({ bg: CLR.headerBg, bold: initialTargets.has(lc.id), fg: initialTargets.has(lc.id) ? CLR.initialFg : CLR.headerFg });
      } else {
        row.push(''); // empty cell in header area
        sty.push({ bg: CLR.headerBg });
      }
    }
    rows.push(row);
    styles.push(sty);
  }

  // ── entry / do / exit rows ──
  for (const field of ['entry', 'do', 'exit']) {
    const row = [field];
    const sty = [{ bg: CLR.actionLabelBg, bold: true }];
    for (const lc of leafCols) {
      row.push(lc[field] || '-');
      sty.push({ bg: CLR.actionDataBg });
    }
    rows.push(row);
    styles.push(sty);
  }

  // ── Event blocks ──
  const eventSet = new Map();
  for (const t of data.transitions) {
    const fromEl = data.pseudoMap[t.from];
    if (fromEl && fromEl.type === 'initial') continue;
    const evName = t.event || '(none)';
    if (!eventSet.has(evName)) eventSet.set(evName, []);
    eventSet.get(evName).push(t);
  }

  for (const [evName, transitions] of eventSet) {
    // Event name row
    const evRow = [evName];
    const evSty = [{ bg: CLR.eventBg, bold: true }];
    for (const lc of leafCols) { evRow.push('-'); evSty.push({ bg: CLR.actionDataBg }); }
    rows.push(evRow);
    styles.push(evSty);

    // guard / action / target sub-rows
    for (const subField of ['guard', 'action', 'target']) {
      const row = ['  ' + subField];
      const sty = [{ bg: CLR.subRowBg, fg: CLR.subRowFg }];
      for (const lc of leafCols) {
        const matching = transitions.filter(function(t) {
          const fromEl = resolveStateRef(t.from, data);
          return fromEl && fromEl.id === lc.id;
        });
        let val = '-';
        if (matching.length > 0) {
          if (subField === 'guard') val = matching[0].guard || '-';
          else if (subField === 'action') val = matching[0].action || '-';
          else {
            if (matching[0].kind === 'internal') { val = '-'; }
            else { const tgtEl = resolveStateRef(matching[0].to, data); val = tgtEl ? tgtEl.label || tgtEl.id : matching[0].to; }
          }
        }
        row.push(val);
        sty.push({ bg: CLR.actionDataBg });
      }
      rows.push(row);
      styles.push(sty);
    }
  }

  return { rows, styles, CLR };
}

function exportExcel() {
  if (!parsed) return;
  function doExport() {
    const { rows, styles } = buildExcelData(parsed);
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('Transition');

    const thinBorder = { style: 'thin', color: { argb: 'FF808080' } };
    const border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };

    // Set column widths
    ws.columns = rows[0].map(function(_, ci) { return { width: ci === 0 ? 18 : 16 }; });

    // Write data with styles
    for (let r = 0; r < rows.length; r++) {
      const xlRow = ws.addRow(rows[r]);
      for (let c = 0; c < rows[r].length; c++) {
        const cell = xlRow.getCell(c + 1);
        cell.border = border;
        cell.alignment = { vertical: 'top', horizontal: 'left' };
        const st = styles[r] && styles[r][c];
        if (st) {
          if (st.bg) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF' + st.bg } };
          cell.font = {
            name: 'Meiryo UI',
            size: 10,
            bold: !!st.bold,
            color: { argb: 'FF' + (st.fg || '000000') },
          };
        } else {
          cell.font = { name: 'Meiryo UI', size: 10 };
        }
      }
    }

    // Download
    wb.xlsx.writeBuffer().then(function(buf) {
      const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'stablestate.xlsx';
      a.click();
      URL.revokeObjectURL(url);
    });
  }
  if (typeof ExcelJS !== 'undefined') { doExport(); return; }
  const script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
  script.onload = doExport;
  script.onerror = function() { alert('ExcelJS CDN load failed. Check network connection.'); };
  document.head.appendChild(script);
}

// Add Event (Table)
// ═══════════════════════════════════════════════
function addEvent() {
  const evName = prompt('Event name:');
  if (!evName || !evName.trim()) return;
  // Add an empty transition placeholder for the first leaf state
  if (!parsed || parsed.states.length === 0) return;
  // Find first leaf state
  const leaf = parsed.states.find(function(s) { return s.children.length === 0; });
  if (!leaf) return;
  pushHistory();
  let dsl = getDsl();
  // Add a comment-like transition: just event name, no actual target yet
  // We add a real transition from the first leaf to "-" which won't parse as valid
  // Instead, add an empty transition line as placeholder
  dsl = dsl + '\n# Event: ' + evName.trim();
  setDsl(dsl);
  refresh();
}

// ═══════════════════════════════════════════════
// Refresh Pipeline
// ═══════════════════════════════════════════════
function cleanupInternalTransitions() {
  // Remove @internal transitions that have no action (they serve no purpose)
  let dsl = getDsl();
  let changed = false;
  const lines = dsl.split('\n');
  const result = [];
  for (const line of lines) {
    const t = line.trim();
    if (t.match(/^(\S+)\s*->\s*(\S+)\s*:.*@internal/) && !t.match(/\/\s*\S+/)) {
      changed = true;
      continue; // skip this line
    }
    result.push(line);
  }
  if (changed) setDsl(result.join('\n'));
}

function refresh() {
  cleanupInternalTransitions();
  const text = getDsl();
  parsed = parseDSL(text);
  validate(parsed);
  updateErrorBar(parsed);
  document.getElementById('svg-wrap').innerHTML = renderSVG(parsed);
  setupInteractions();
  renderTable(parsed);
  renderProps();
  updateLineNumbers();
  updateStatus();
  updateHighlight();
}

// SVG Scale Helper (StableBlock pattern)
// ═══════════════════════════════════════════════
function getSvgScale() {
  const svg = document.querySelector('#svg-wrap svg');
  if (!svg) return { sx: 1, sy: 1 };
