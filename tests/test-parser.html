<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StableState Parser Tests</title>
<style>
body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #E2E8F0; padding: 24px; }
h1 { font-size: 20px; margin-bottom: 16px; }
.pass { color: #22C55E; }
.fail { color: #EF4444; }
.summary { font-size: 16px; margin-top: 16px; padding: 12px; border-radius: 6px; }
.summary.all-pass { background: #14532d; border: 1px solid #22C55E; }
.summary.has-fail { background: #7F1D1D; border: 1px solid #EF4444; }
.test-result { padding: 4px 0; font-size: 13px; font-family: 'Consolas', monospace; }
#output { margin-top: 12px; }
</style>
</head>
<body>
<h1>StableState Parser - Test Harness</h1>
<div id="output"></div>

<script>
// ═══════════════════════════════════════════════
// Parser (copied from stablestate.html)
// ═══════════════════════════════════════════════
function parseDSL(text) {
  const result = {
    canvas: { width: 960, height: 600, grid: 20 },
    config: { transition: 'local', orthogonal: false, history: false },
    states: [],
    pseudoStates: [],
    groups: [],
    regions: [],
    transitions: [],
    notes: [],
    noteConnections: [],
    errors: [],
    stateMap: {},
    pseudoMap: {},
    groupMap: {},
    noteMap: {}
  };

  const lines = text.split('\n');
  const nestingStack = [];

  for (let i = 0; i < lines.length; i++) {
    const lineNum = i + 1;
    const raw = lines[i];
    const trimmed = raw.trim();

    if (trimmed === '' || trimmed.startsWith('#')) continue;

    // Closing brace
    if (/^\}/.test(trimmed)) {
      if (nestingStack.length === 0) {
        result.errors.push({ line: lineNum, msg: 'Unexpected closing brace }' });
        continue;
      }
      const parentId = nestingStack.pop();
      const afterBrace = trimmed.slice(1).trim();
      if (afterBrace && result.stateMap[parentId]) {
        const parentState = result.stateMap[parentId];
        parseProps(afterBrace, parentState);
      }
      continue;
    }

    // @canvas
    const canvasMatch = trimmed.match(/^@canvas\s+(.+)$/);
    if (canvasMatch) {
      const propsStr = canvasMatch[1];
      const wm = propsStr.match(/width=(\d+)/);
      const hm = propsStr.match(/height=(\d+)/);
      const gm = propsStr.match(/grid=(\d+)/);
      if (wm) result.canvas.width = parseInt(wm[1], 10);
      if (hm) result.canvas.height = parseInt(hm[1], 10);
      if (gm) result.canvas.grid = parseInt(gm[1], 10);
      continue;
    }

    // @config
    const configMatch = trimmed.match(/^@config\s+(\w+)=(\S+)$/);
    if (configMatch) {
      const key = configMatch[1];
      const val = configMatch[2];
      if (key === 'transition') {
        result.config.transition = val;
      } else if (key === 'orthogonal') {
        result.config.orthogonal = val === 'true';
      } else if (key === 'history') {
        result.config.history = val === 'true';
      }
      continue;
    }

    // Pseudo-states
    const pseudoMatch = trimmed.match(/^(initial|final|choice|history|deephistory|fork|join)\s+(\S+)\s+at\s+(-?[\d.]+)\s*,\s*(-?[\d.]+)(?:\s+size\s+(-?[\d.]+)\s*x\s*(-?[\d.]+))?/);
    if (pseudoMatch) {
      const id = pseudoMatch[2];
      if (checkDuplicate(id, lineNum, result)) continue;
      const ps = {
        type: pseudoMatch[1],
        id: id,
        x: parseFloat(pseudoMatch[3]),
        y: parseFloat(pseudoMatch[4]),
        w: pseudoMatch[5] ? parseFloat(pseudoMatch[5]) : null,
        h: pseudoMatch[6] ? parseFloat(pseudoMatch[6]) : null,
        parent: nestingStack.length > 0 ? nestingStack[nestingStack.length - 1] : null,
        line: lineNum
      };
      result.pseudoStates.push(ps);
      result.pseudoMap[id] = ps;
      continue;
    }

    // state
    const stateMatch = trimmed.match(/^state\s+(\S+)\s+"([^"]*)"\s+at\s+(-?[\d.]+)\s*,\s*(-?[\d.]+)\s+size\s+(-?[\d.]+)\s*x\s*(-?[\d.]+)(.*)$/);
    if (stateMatch) {
      const id = stateMatch[1];
      if (checkDuplicate(id, lineNum, result)) continue;
      const rest = stateMatch[7].trim();
      const isComposite = rest.endsWith('{');
      const propsStr = isComposite ? rest.slice(0, -1).trim() : rest;

      const st = {
        type: 'state',
        id: id,
        label: stateMatch[2],
        x: parseFloat(stateMatch[3]),
        y: parseFloat(stateMatch[4]),
        w: parseFloat(stateMatch[5]),
        h: parseFloat(stateMatch[6]),
        color: null,
        textColor: null,
        borderColor: null,
        round: null,
        style: null,
        entry: null,
        do: null,
        exit: null,
        parent: nestingStack.length > 0 ? nestingStack[nestingStack.length - 1] : null,
        children: [],
        isInitial: false,
        line: lineNum
      };

      if (propsStr) parseProps(propsStr, st);

      result.states.push(st);
      result.stateMap[id] = st;

      if (st.parent && result.stateMap[st.parent]) {
        result.stateMap[st.parent].children.push(id);
      }

      if (isComposite) {
        nestingStack.push(id);
      }
      continue;
    }

    // group
    const groupMatch = trimmed.match(/^group\s+(\S+)\s+"([^"]*)"\s+at\s+(-?[\d.]+)\s*,\s*(-?[\d.]+)\s+size\s+(-?[\d.]+)\s*x\s*(-?[\d.]+)(.*)$/);
    if (groupMatch) {
      const id = groupMatch[1];
      if (checkDuplicate(id, lineNum, result)) continue;
      const rest = groupMatch[7].trim();
      const g = {
        type: 'group',
        id: id,
        label: groupMatch[2],
        x: parseFloat(groupMatch[3]),
        y: parseFloat(groupMatch[4]),
        w: parseFloat(groupMatch[5]),
        h: parseFloat(groupMatch[6]),
        color: null,
        borderColor: null,
        textColor: null,
        style: null,
        line: lineNum
      };
      if (rest) parseProps(rest, g);
      result.groups.push(g);
      result.groupMap[id] = g;
      continue;
    }

    // note
    const noteMatch = trimmed.match(/^note\s+(\S+)\s+"([^"]*)"\s+at\s+(-?[\d.]+)\s*,\s*(-?[\d.]+)\s+size\s+(-?[\d.]+)\s*x\s*(-?[\d.]+)(.*)$/);
    if (noteMatch) {
      const id = noteMatch[1];
      if (checkDuplicate(id, lineNum, result)) continue;
      const rest = noteMatch[7].trim();
      const n = {
        type: 'note',
        id: id,
        label: noteMatch[2],
        x: parseFloat(noteMatch[3]),
        y: parseFloat(noteMatch[4]),
        w: parseFloat(noteMatch[5]),
        h: parseFloat(noteMatch[6]),
        color: null,
        textColor: null,
        line: lineNum
      };
      if (rest) parseProps(rest, n);
      result.notes.push(n);
      result.noteMap[id] = n;
      continue;
    }

    // Transition / Note connection
    const transMatch = trimmed.match(/^(\S+)\s*->\s*(\S+)(.*)$/);
    if (transMatch) {
      const from = transMatch[1];
      const to = transMatch[2];
      const rest = transMatch[3].trim();

      if (result.noteMap[from]) {
        result.noteConnections.push({
          noteId: from,
          targetId: to,
          line: lineNum
        });
        continue;
      }

      let event = null, guard = null, action = null, kind = null, width = null, style = null, color = null;
      if (rest.startsWith(':')) {
        const detail = rest.slice(1).trim();
        let remaining = detail;
        const attrRe = /\b(width|style|color)=(\S+)/g;
        let attrMatch;
        while ((attrMatch = attrRe.exec(remaining)) !== null) {
          if (attrMatch[1] === 'width') width = parseFloat(attrMatch[2]);
          else if (attrMatch[1] === 'style') style = attrMatch[2];
          else if (attrMatch[1] === 'color') color = attrMatch[2];
        }
        remaining = remaining.replace(/\b(width|style|color)=\S+/g, '').trim();
        const kindMatch = remaining.match(/@(local|external|internal)\s*$/);
        if (kindMatch) {
          kind = kindMatch[1];
          remaining = remaining.slice(0, remaining.lastIndexOf('@' + kind)).trim();
        }
        const slashIdx = remaining.indexOf('/');
        if (slashIdx !== -1) {
          action = remaining.slice(slashIdx + 1).trim() || null;
          remaining = remaining.slice(0, slashIdx).trim();
        }
        const guardMatch = remaining.match(/\[([^\]]*)\]/);
        if (guardMatch) {
          guard = guardMatch[1].trim() || null;
          remaining = remaining.slice(0, remaining.indexOf('[')).trim();
        }
        event = remaining.trim() || null;
      }

      result.transitions.push({
        from: from,
        to: to,
        event: event,
        guard: guard,
        action: action,
        kind: kind || result.config.transition,
        width: width,
        style: style,
        color: color,
        label: rest.startsWith(':') ? rest.slice(1).trim() : null,
        line: lineNum
      });
      continue;
    }

    // Unrecognized
    result.errors.push({ line: lineNum, msg: 'Unrecognized syntax: ' + trimmed });
  }

  if (nestingStack.length > 0) {
    result.errors.push({ line: lines.length, msg: 'Unclosed composite state: ' + nestingStack.join(', ') });
  }

  return result;
}

function parseProps(propsStr, target) {
  const propRe = /(\w+)=(\S+)/g;
  let m;
  while ((m = propRe.exec(propsStr)) !== null) {
    const key = m[1];
    const val = m[2];
    switch (key) {
      case 'entry': target.entry = val; break;
      case 'do': target.do = val; break;
      case 'exit': target.exit = val; break;
      case 'color': target.color = val; break;
      case 'text': target.textColor = val; break;
      case 'border': target.borderColor = val; break;
      case 'round': target.round = parseFloat(val); break;
      case 'style': target.style = val; break;
    }
  }
}

function checkDuplicate(id, lineNum, result) {
  if (result.stateMap[id] || result.pseudoMap[id] || result.groupMap[id] || result.noteMap[id]) {
    result.errors.push({ line: lineNum, msg: 'Duplicate ID: ' + id });
    return true;
  }
  return false;
}

// ═══════════════════════════════════════════════
// Resolve dot-path state references
// ═══════════════════════════════════════════════
function resolveStateRef(dotPath, parsed) {
  if (parsed.stateMap[dotPath]) return parsed.stateMap[dotPath];
  if (parsed.pseudoMap[dotPath]) return parsed.pseudoMap[dotPath];
  const parts = dotPath.split('.');
  const leafId = parts[parts.length - 1];
  const candidates = parsed.states.filter(s => s.id === leafId);
  for (const c of candidates) {
    let match = true, cur = c;
    for (let i = parts.length - 2; i >= 0; i--) {
      if (!cur.parent || cur.parent !== parts[i]) { match = false; break; }
      cur = parsed.stateMap[cur.parent];
    }
    if (match) return c;
  }
  return null;
}

// ═══════════════════════════════════════════════
// Validation (copied from stablestate.html)
// ═══════════════════════════════════════════════
function validate(result) {
  const allIds = new Set([
    ...Object.keys(result.stateMap),
    ...Object.keys(result.pseudoMap)
  ]);

  function refExists(ref) {
    if (allIds.has(ref)) return true;
    return resolveStateRef(ref, result) !== null;
  }

  // Transition references
  for (const t of result.transitions) {
    if (!refExists(t.from)) {
      result.errors.push({ line: t.line, msg: 'Undefined state reference: ' + t.from });
    }
    if (!refExists(t.to)) {
      result.errors.push({ line: t.line, msg: 'Undefined state reference: ' + t.to });
    }
  }

  // Initial state required at each hierarchy level
  const rootInitials = result.pseudoStates.filter(p => p.type === 'initial' && p.parent === null);
  const rootStates = result.states.filter(s => s.parent === null);
  if (rootStates.length > 0 && rootInitials.length === 0) {
    result.errors.push({ line: 1, msg: 'Warning: No initial pseudo-state at root level' });
  }
  for (const s of result.states) {
    if (s.children.length > 0) {
      const childInitials = result.pseudoStates.filter(p => p.type === 'initial' && p.parent === s.id);
      if (childInitials.length === 0) {
        result.errors.push({ line: s.line, msg: 'Warning: No initial pseudo-state inside composite state ' + s.id });
      }
    }
  }

  // Initial pseudo-state must have exactly 1 outgoing transition, with no event/guard
  for (const ps of result.pseudoStates) {
    if (ps.type !== 'initial') continue;
    const outgoing = result.transitions.filter(t => t.from === ps.id);
    if (outgoing.length === 0) {
      result.errors.push({ line: ps.line, msg: 'initial pseudo-state ' + ps.id + ' must have exactly 1 outgoing transition (has 0)' });
    } else if (outgoing.length > 1) {
      result.errors.push({ line: ps.line, msg: 'initial pseudo-state ' + ps.id + ' must have exactly 1 outgoing transition (has ' + outgoing.length + ')' });
    }
    for (const t of outgoing) {
      if (t.event) {
        result.errors.push({ line: t.line, msg: 'initial pseudo-state transition must not have an event (found: ' + t.event + ')' });
      }
      if (t.guard) {
        result.errors.push({ line: t.line, msg: 'initial pseudo-state transition must not have a guard (found: [' + t.guard + '])' });
      }
    }
  }

  // Choice branches
  for (const ps of result.pseudoStates) {
    if (ps.type !== 'choice') continue;
    const outgoing = result.transitions.filter(t => t.from === ps.id);
    let guardlessCount = 0;
    for (const t of outgoing) {
      if (t.event) {
        result.errors.push({ line: t.line, msg: 'choice pseudo-state transition must not have an event (found: ' + t.event + ')' });
      }
      if (!t.guard) {
        guardlessCount++;
      }
    }
    if (guardlessCount > 1) {
      result.errors.push({ line: ps.line, msg: 'choice pseudo-state ' + ps.id + ' has ' + guardlessCount + ' guard-less transitions (max 1 allowed as else/default)' });
    }
  }

  // Config constraints
  const needsOrthogonal = result.pseudoStates.filter(p => ['fork', 'join'].includes(p.type));
  if (needsOrthogonal.length > 0 && !result.config.orthogonal) {
    for (const ps of needsOrthogonal) {
      result.errors.push({ line: ps.line, msg: 'Warning: ' + ps.type + ' pseudo-state ' + ps.id + ' used without @config orthogonal=true' });
    }
  }
  if (result.regions.length > 0 && !result.config.orthogonal) {
    for (const r of result.regions) {
      result.errors.push({ line: r.line || 1, msg: 'Warning: region used without @config orthogonal=true' });
    }
  }
  const needsHistory = result.pseudoStates.filter(p => ['history', 'deephistory'].includes(p.type));
  if (needsHistory.length > 0 && !result.config.history) {
    for (const ps of needsHistory) {
      result.errors.push({ line: ps.line, msg: 'Warning: ' + ps.type + ' pseudo-state ' + ps.id + ' used without @config history=true' });
    }
  }

  // Nesting bounds
  for (const s of result.states) {
    if (!s.parent) continue;
    const parent = result.stateMap[s.parent];
    if (!parent) continue;
    if (s.x + s.w > parent.w || s.y + s.h > parent.h || s.x < 0 || s.y < 0) {
      result.errors.push({ line: s.line, msg: 'Warning: state ' + s.id + ' exceeds bounds of parent ' + parent.id });
    }
  }
}

// ═══════════════════════════════════════════════
// Test Framework
// ═══════════════════════════════════════════════
let totalTests = 0;
let passedTests = 0;
let failedTests = 0;
const outputEl = document.getElementById('output');

function assert(condition, msg) {
  totalTests++;
  if (condition) {
    passedTests++;
    outputEl.innerHTML += '<div class="test-result pass">  PASS: ' + msg + '</div>';
  } else {
    failedTests++;
    outputEl.innerHTML += '<div class="test-result fail">  FAIL: ' + msg + '</div>';
  }
}

function runTest(name, fn) {
  outputEl.innerHTML += '<div class="test-result" style="margin-top:8px;font-weight:bold;color:#818CF8;">' + name + '</div>';
  try {
    fn();
  } catch (e) {
    failedTests++;
    totalTests++;
    outputEl.innerHTML += '<div class="test-result fail">  ERROR: ' + e.message + '</div>';
  }
}

// ═══════════════════════════════════════════════
// Test Cases
// ═══════════════════════════════════════════════

function test_canvas() {
  const r = parseDSL('@canvas width=960 height=600 grid=20');
  assert(r.canvas.width === 960, 'canvas width');
  assert(r.canvas.height === 600, 'canvas height');
  assert(r.canvas.grid === 20, 'canvas grid');
}

function test_config() {
  const r = parseDSL('@config transition=local\n@config orthogonal=false\n@config history=true');
  assert(r.config.transition === 'local', 'config transition');
  assert(r.config.orthogonal === false, 'config orthogonal');
  assert(r.config.history === true, 'config history');
}

function test_config_defaults() {
  const r = parseDSL('@canvas width=100 height=100 grid=10');
  assert(r.config.transition === 'local', 'default transition');
  assert(r.config.orthogonal === false, 'default orthogonal');
  assert(r.config.history === false, 'default history');
}

function test_simple_state() {
  const r = parseDSL('state idle "Idle" at 2,3 size 8x4 entry=IdleEntry color=#6366F1');
  assert(r.states.length === 1, 'one state');
  assert(r.states[0].id === 'idle', 'state id');
  assert(r.states[0].label === 'Idle', 'state label');
  assert(r.states[0].x === 2, 'state x');
  assert(r.states[0].y === 3, 'state y');
  assert(r.states[0].w === 8, 'state w');
  assert(r.states[0].h === 4, 'state h');
  assert(r.states[0].entry === 'IdleEntry', 'state entry');
  assert(r.states[0].color === '#6366F1', 'state color');
  assert(r.stateMap['idle'] === r.states[0], 'stateMap');
}

function test_pseudo_states() {
  const r = parseDSL('initial ini at 1,4\nfinal fin at 30,4\nchoice c1 at 10,8');
  assert(r.pseudoStates.length === 3, 'three pseudos');
  assert(r.pseudoStates[0].type === 'initial', 'initial type');
  assert(r.pseudoStates[1].type === 'final', 'final type');
  assert(r.pseudoStates[2].type === 'choice', 'choice type');
  assert(r.pseudoMap['ini'].x === 1, 'initial x');
}

function test_group() {
  const r = parseDSL('group g1 "Motors" at 1,1 size 20x10 color=#EEF2FF border=#818CF8');
  assert(r.groups.length === 1, 'one group');
  assert(r.groups[0].id === 'g1', 'group id');
  assert(r.groups[0].label === 'Motors', 'group label');
  assert(r.groups[0].color === '#EEF2FF', 'group color');
}

function test_note() {
  const r = parseDSL('note tip "Important" at 2,1 size 10x2 color=#FEF3C7');
  assert(r.notes.length === 1, 'one note');
  assert(r.notes[0].id === 'tip', 'note id');
  assert(r.notes[0].label === 'Important', 'note label');
}

function test_duplicate_id() {
  const r = parseDSL('state a "A" at 1,1 size 4x3\nstate a "B" at 5,5 size 4x3');
  assert(r.errors.length > 0, 'duplicate id error');
}

function test_transition_full() {
  const dsl = 'state a "A" at 1,1 size 4x3\nstate b "B" at 10,1 size 4x3\na -> b : EvGo [IsReady] / ActGo @external';
  const r = parseDSL(dsl);
  assert(r.transitions.length === 1, 'one transition');
  const t = r.transitions[0];
  assert(t.from === 'a', 'from'); assert(t.to === 'b', 'to');
  assert(t.event === 'EvGo', 'event'); assert(t.guard === 'IsReady', 'guard');
  assert(t.action === 'ActGo', 'action'); assert(t.kind === 'external', 'kind');
}

function test_transition_minimal() {
  const dsl = 'initial ini at 0,0\nstate a "A" at 2,2 size 4x3\nini -> a';
  const r = parseDSL(dsl);
  assert(r.transitions[0].event === null, 'no event');
  assert(r.transitions[0].kind === 'local', 'default kind');
}

function test_note_connection() {
  const dsl = 'state a "A" at 1,1 size 4x3\nnote n1 "Note" at 8,1 size 6x2\nn1 -> a';
  const r = parseDSL(dsl);
  assert(r.noteConnections.length === 1, 'one note connection');
  assert(r.transitions.length === 0, 'no transition');
}

function test_composite_state() {
  const dsl = `state active "Active" at 10,1 size 20x12 entry=ActiveEntry {
  state accel "Accel" at 1,2 size 8x3
  state cruise "Cruise" at 10,2 size 8x3
}`;
  const r = parseDSL(dsl);
  assert(r.states.length === 3, 'three states');
  const active = r.stateMap['active'];
  assert(active.children.length === 2, 'two children');
  assert(r.stateMap['accel'].parent === 'active', 'accel parent');
  assert(r.stateMap['cruise'].parent === 'active', 'cruise parent');
}

function test_pseudo_inside_composite() {
  const dsl = `state active "Active" at 10,1 size 20x12 {
  initial ini2 at 1,1
  state sub "Sub" at 3,3 size 6x3
}`;
  const r = parseDSL(dsl);
  assert(r.pseudoMap['ini2'].parent === 'active', 'pseudo parent in composite');
}

function test_resolve_dot_path() {
  const dsl = `state active "Active" at 10,1 size 20x12 {
  state accel "Accel" at 1,2 size 8x3
}`;
  const r = parseDSL(dsl);
  const resolved = resolveStateRef('active.accel', r);
  assert(resolved !== null, 'resolved not null');
  assert(resolved.id === 'accel', 'resolved id');
}

function test_closing_brace_props() {
  const dsl = `state active "Active" at 10,1 size 20x12 {
  state sub "Sub" at 1,1 size 6x3
} entry=ActiveEntry exit=ActiveExit`;
  const r = parseDSL(dsl);
  assert(r.stateMap['active'].entry === 'ActiveEntry', 'closing brace entry prop');
  assert(r.stateMap['active'].exit === 'ActiveExit', 'closing brace exit prop');
}

// ═══════════════════════════════════════════════
// Validation Test Cases
// ═══════════════════════════════════════════════

function test_validate_undefined_ref() {
  const r = parseDSL('state a "A" at 1,1 size 4x3\na -> nonexistent : EvGo');
  validate(r);
  assert(r.errors.some(e => e.msg.includes('nonexistent')), 'undefined ref error');
}

function test_validate_initial_required() {
  const r = parseDSL('state a "A" at 1,1 size 4x3');
  validate(r);
  assert(r.errors.some(e => e.msg.includes('initial')), 'missing initial warning');
}

function test_validate_initial_one_transition() {
  const dsl = 'initial ini at 0,0\nstate a "A" at 2,2 size 4x3\nstate b "B" at 8,2 size 4x3\nini -> a\nini -> b';
  const r = parseDSL(dsl);
  validate(r);
  assert(r.errors.some(e => e.msg.includes('initial')), 'initial multi-transition error');
}

function test_validate_choice_no_event() {
  const dsl = 'state a "A" at 1,1 size 4x3\nchoice c1 at 5,5\nc1 -> a : EvBad';
  const r = parseDSL(dsl);
  validate(r);
  assert(r.errors.some(e => e.msg.includes('choice')), 'choice with event error');
}

function test_validate_dot_notation_ok() {
  const dsl = `state p "P" at 1,1 size 20x10 {
  state c "C" at 2,2 size 5x3
}
state x "X" at 25,1 size 5x3
p.c -> x : EvGo`;
  const r = parseDSL(dsl);
  validate(r);

// ═══════════════════════════════════════════════
// DSL Updaters (copied from stablestate.html)
// ═══════════════════════════════════════════════

function updatePos(type, id, nx, ny, dsl) {
  const re = new RegExp(`^(\\s*${type}\\s+${id}\\s+(?:"[^"]*"\\s+)?at\\s+)[\\d.]+,[\\d.]+(.*$)`, 'm');
  return dsl.replace(re, `$1${nx},${ny}$2`);
}

function updateSize(type, id, nw, nh, dsl) {
  const re = new RegExp(`^(\\s*${type}\\s+${id}\\s+.*\\bsize\\s+)[\\d.]+x[\\d.]+(.*$)`, 'm');
  return dsl.replace(re, `$1${nw}x${nh}$2`);
}

function updateProp(type, id, prop, val, dsl) {
  const reExist = new RegExp(`^(\\s*${type}\\s+${id}\\s+.*)\\b${prop}=\\S+(.*$)`, 'm');
  if (reExist.test(dsl)) {
    return dsl.replace(reExist, `$1${prop}=${val}$2`);
  }
  const reLine = new RegExp(`^(\\s*${type}\\s+${id}\\s+.+)$`, 'm');
  return dsl.replace(reLine, function(wholeLine) {
    const trimEnd = wholeLine.trimEnd();
    if (trimEnd.endsWith('{')) {
      return trimEnd.slice(0, -1).trimEnd() + ` ${prop}=${val} {`;
    }
    return trimEnd + ` ${prop}=${val}`;
  });
}

function updateLabel(type, id, newLabel, dsl) {
  const re = new RegExp(`^(\\s*${type}\\s+${id}\\s+)"[^"]*"(.*)$`, 'm');
  return dsl.replace(re, `$1"${newLabel}"$2`);
}

function addTransition(from, to, event, guard, action, kind, dsl) {
  let defaultKind = 'local';
  const configMatch = dsl.match(/^@config\s+transition=(\S+)/m);
  if (configMatch) defaultKind = configMatch[1];

  let line = `${from} -> ${to}`;
  const hasEvent = event != null && event !== '';
  const hasGuard = guard != null && guard !== '';
  const hasAction = action != null && action !== '';
  const hasKind = kind != null && kind !== '' && kind !== defaultKind;

  if (hasEvent || hasGuard || hasAction || hasKind) {
    line += ' :';
    if (hasEvent) line += ` ${event}`;
    if (hasGuard) line += ` [${guard}]`;
    if (hasAction) line += ` / ${action}`;
    if (hasKind) line += ` @${kind}`;
  }

  return dsl + '\n' + line;
}

function removeTransition(from, to, event, guard, dsl) {
  const lines = dsl.split('\n');
  const result = [];
  for (const line of lines) {
    const trimmed = line.trim();
    const m = trimmed.match(/^(\S+)\s*->\s*(\S+)(.*)$/);
    if (m && m[1] === from && m[2] === to) {
      const rest = m[3].trim();
      let lineEvent = null, lineGuard = null;
      if (rest.startsWith(':')) {
        let detail = rest.slice(1).trim();
        detail = detail.replace(/@(local|external|internal)\s*$/, '').trim();
        const slashIdx = detail.indexOf('/');
        if (slashIdx !== -1) detail = detail.slice(0, slashIdx).trim();
        const gm = detail.match(/\[([^\]]*)\]/);
        if (gm) {
          lineGuard = gm[1].trim() || null;
          detail = detail.slice(0, detail.indexOf('[')).trim();
        }
        lineEvent = detail || null;
      }
      const eMatch = (event == null || event === '') ? (lineEvent == null || lineEvent === '') : lineEvent === event;
      const gMatch = (guard == null || guard === '') ? (lineGuard == null || lineGuard === '') : lineGuard === guard;
      if (eMatch && gMatch) continue;
    }
    result.push(line);
  }
  return result.join('\n');
}

function updateTransition(from, to, event, guard, field, val, dsl) {
  const lines = dsl.split('\n');
  for (let i = 0; i < lines.length; i++) {
    const trimmed = lines[i].trim();
    const m = trimmed.match(/^(\S+)\s*->\s*(\S+)(.*)$/);
    if (!m || m[1] !== from || m[2] !== to) continue;

    const rest = m[3].trim();
    let lineEvent = null, lineGuard = null, lineAction = null, lineKind = null;
    if (rest.startsWith(':')) {
      let detail = rest.slice(1).trim();
      const km = detail.match(/@(local|external|internal)\s*$/);
      if (km) {
        lineKind = km[1];
        detail = detail.slice(0, detail.lastIndexOf('@' + lineKind)).trim();
      }
      const slashIdx = detail.indexOf('/');
      if (slashIdx !== -1) {
        lineAction = detail.slice(slashIdx + 1).trim() || null;
        detail = detail.slice(0, slashIdx).trim();
      }
      const gm = detail.match(/\[([^\]]*)\]/);
      if (gm) {
        lineGuard = gm[1].trim() || null;
        detail = detail.slice(0, detail.indexOf('[')).trim();
      }
      lineEvent = detail || null;
    }

    const eMatch = (event == null || event === '') ? (lineEvent == null || lineEvent === '') : lineEvent === event;
    const gMatch = (guard == null || guard === '') ? (lineGuard == null || lineGuard === '') : lineGuard === guard;
    if (!eMatch || !gMatch) continue;

    if (field === 'guard') lineGuard = val;
    else if (field === 'action') lineAction = val;
    else if (field === 'kind') lineKind = val;
    else continue;

    let defaultKind = 'local';
    const cfgM = dsl.match(/^@config\s+transition=(\S+)/m);
    if (cfgM) defaultKind = cfgM[1];

    let rebuilt = `${from} -> ${to}`;
    const hasEvent = lineEvent != null && lineEvent !== '';
    const hasGuard = lineGuard != null && lineGuard !== '';
    const hasAction = lineAction != null && lineAction !== '';
    const hasKind = lineKind != null && lineKind !== '' && lineKind !== defaultKind;

    if (hasEvent || hasGuard || hasAction || hasKind) {
      rebuilt += ' :';
      if (hasEvent) rebuilt += ` ${lineEvent}`;
      if (hasGuard) rebuilt += ` [${lineGuard}]`;
      if (hasAction) rebuilt += ` / ${lineAction}`;
      if (hasKind) rebuilt += ` @${lineKind}`;
    }

    const leadingWs = lines[i].match(/^(\s*)/)[1];
    lines[i] = leadingWs + rebuilt;
    break;
  }
  return lines.join('\n');
}

// ═══════════════════════════════════════════════
// PlantUML Export function
// ═══════════════════════════════════════════════
function exportPlantUML(parsed) {
  let lines = ['@startuml'];

  // Build set of initial/final pseudo-state IDs for transition mapping
  const initialIds = new Set(parsed.pseudoStates.filter(p => p.type === 'initial').map(p => p.id));
  const finalIds = new Set(parsed.pseudoStates.filter(p => p.type === 'final').map(p => p.id));
  const choiceIds = new Set(parsed.pseudoStates.filter(p => p.type === 'choice').map(p => p.id));

  // Render states recursively
  function renderState(st, indent) {
    const pad = '  '.repeat(indent);
    if (st.children.length > 0) {
      lines.push(pad + 'state "' + st.label + '" as ' + st.id + ' {');
      for (const childId of st.children) {
        const child = parsed.stateMap[childId];
        if (child) renderState(child, indent + 1);
      }
      lines.push(pad + '}');
    } else {
      lines.push(pad + 'state "' + st.label + '" as ' + st.id);
    }
  }

  // Root-level states
  for (const st of parsed.states.filter(s => s.parent === null)) {
    renderState(st, 0);
  }

  // Choice pseudo-states
  for (const ps of parsed.pseudoStates.filter(p => p.type === 'choice')) {
    lines.push('state ' + ps.id + ' <<choice>>');
  }

  lines.push('');

  // Transitions
  for (const tr of parsed.transitions) {
    const from = initialIds.has(tr.from) ? '[*]' : tr.from;
    const to = finalIds.has(tr.to) ? '[*]' : tr.to;
    let label = '';
    if (tr.event || tr.guard || tr.action) {
      const parts = [];
      if (tr.event) parts.push(tr.event);
      if (tr.guard) parts.push('[' + tr.guard + ']');
      if (tr.action) parts.push('/ ' + tr.action);
      label = ' : ' + parts.join(' ');
    }
    lines.push(from + ' --> ' + to + label);
  }

  lines.push('@enduml');
  return lines.join('\n');
}

// Excel export data structure tests
// ═══════════════════════════════════════════════
function buildExcelData(parsed) {
  if (!parsed) return [];
  const rows = [];
  // Header row
  const leafStates = parsed.states.filter(s => s.children.length === 0);
  const headers = ['Event', 'Guard', 'Action'];
  for (const st of leafStates) headers.push(st.label || st.id);
  rows.push(headers);

  // Entry/Do/Exit rows
  for (const field of ['entry', 'do', 'exit']) {
    const row = [field, '', ''];
    for (const st of leafStates) row.push(st[field] || '');
    rows.push(row);
  }

  // Transition rows grouped by event
  const events = [...new Set(parsed.transitions.filter(t => t.event).map(t => t.event))];
  for (const ev of events) {
    const trs = parsed.transitions.filter(t => t.event === ev);
    for (const tr of trs) {
      const row = [ev, tr.guard || '', tr.action || ''];
      for (const st of leafStates) {
        row.push(st.id === tr.from ? (parsed.stateMap[tr.to] ? parsed.stateMap[tr.to].label || tr.to : tr.to) : '');
      }
      rows.push(row);
    }
  }
  return rows;
}

// ═══════════════════════════════════════════════
// hitTest function (copied from stablestate.html) + dependencies
// ═══════════════════════════════════════════════
let annotationMode = false;

function getAbsolutePos(element, parsed) {
  let ox = 0, oy = 0;
  let pid = element.parent;
  while (pid) {
    const p = parsed.stateMap[pid];
    if (p) { ox += p.x; oy += p.y; pid = p.parent; }
    else break;
  }
  return { x: (element.x + ox) * parsed.canvas.grid, y: (element.y + oy) * parsed.canvas.grid };
}

function hitTest(px, py, parsed) {
  if (!parsed) return null;
  const g = parsed.canvas.grid;

  if (!annotationMode) {
    for (let i = parsed.states.length - 1; i >= 0; i--) {
      const st = parsed.states[i];
      const abs = getAbsolutePos(st, parsed);
      if (px >= abs.x && px <= abs.x + st.w * g && py >= abs.y && py <= abs.y + st.h * g) {
        return { id: st.id, type: 'state', element: st };
      }
    }
    for (const ps of parsed.pseudoStates) {
      const abs = getAbsolutePos(ps, parsed);
      if (Math.hypot(px - abs.x, py - abs.y) < 15) {
        return { id: ps.id, type: ps.type, element: ps };
      }
    }
    for (let i = parsed.groups.length - 1; i >= 0; i--) {
      const grp = parsed.groups[i];
      const x = grp.x * g, y = grp.y * g;
      if (px >= x && px <= x + grp.w * g && py >= y && py <= y + grp.h * g) {
        return { id: grp.id, type: 'group', element: grp };
      }
    }
  }

  if (annotationMode) {
    for (const n of parsed.notes) {
      const x = n.x * g, y = n.y * g;
      if (px >= x && px <= x + n.w * g && py >= y && py <= y + n.h * g) {
        return { id: n.id, type: 'note', element: n };
      }
    }
  }

  return null;
}

  const dsl = `@canvas width=960 height=600 grid=20

  // Click inside state: should hit state
  const hit1 = hitTest(60, 80, r); // (2+1)*20=60, (3+1)*20=80 → inside idle
  assert(hit1 !== null && hit1.id === 'idle', 'hitTest normal: state hit');

  // Click inside note: should NOT hit (notes invisible in normal mode)
  const hit2 = hitTest(60, 220, r); // (2+1)*20=60, (10+1)*20=220 → inside note
  assert(hit2 === null, 'hitTest normal: note not hit');
}

function test_hitTest_annotation_mode() {
  const dsl = `@canvas width=960 height=600 grid=20
state idle "Idle" at 2,3 size 8x4
note tip "Tip" at 2,10 size 8x2`;
  const r = parseDSL(dsl);

  annotationMode = true;
  // Click inside state: should NOT hit (states locked in annotation mode)
  const hit1 = hitTest(60, 80, r);
  assert(hit1 === null, 'hitTest annotation: state not hit');

  // Click inside note: should hit
  const hit2 = hitTest(60, 220, r);
  assert(hit2 !== null && hit2.id === 'tip', 'hitTest annotation: note hit');

  annotationMode = false; // reset
}

function test_hitTest_annotation_empty() {
  const dsl = `@canvas width=960 height=600 grid=20
state idle "Idle" at 2,3 size 8x4`;
  const r = parseDSL(dsl);

  annotationMode = true;
  // No notes exist, click anywhere: should return null
  const hit = hitTest(60, 80, r);
  assert(hit === null, 'hitTest annotation: no notes → null');

  annotationMode = false; // reset
}

runTest('test_hitTest_normal_mode', test_hitTest_normal_mode);
runTest('test_hitTest_annotation_mode', test_hitTest_annotation_mode);
runTest('test_hitTest_annotation_empty', test_hitTest_annotation_empty);

// Summary
const summaryClass = failedTests === 0 ? 'all-pass' : 'has-fail';
outputEl.innerHTML += '<div class="summary ' + summaryClass + '">' +
  'Total: ' + totalTests + ' | ' +
  '<span class="pass">Passed: ' + passedTests + '</span> | ' +
  '<span class="fail">Failed: ' + failedTests + '</span>' +
  '</div>';
</script>
</body>
</html>
