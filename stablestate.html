<!--
  StableState — Browser-Based UML State Machine Diagram Editor
  Single-file standalone editor. Open in any browser, no build step needed.

  Structure:
    <style>       CSS (dark theme, toolbar, 3-pane layout, property panel)
    <div#header>  Toolbar (tabs, diagram tools, export)
    <div#body>    Main layout: DSL editor (left) + Diagram/Table (center) + Property panel (right)
    <script>      All application logic:
      - parseDSL()       DSL text → parsed data
      - renderSVG()      Parsed data → SVG diagram
      - renderTable()    Parsed data → state transition table
      - renderProps()    Property panel for selection
      - refresh()        Main update pipeline
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StableState - UML State Machine Editor</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #1a1a2e; --editor: #0f0f23; --panel: #16213e; --border: #2a2a4a;
  --text: #E2E8F0; --muted: #64748B; --dim: #475569;
  --accent: #818CF8; --accent2: #4338CA; --accent-bg: #312E81;
  --green: #22C55E; --amber: #F59E0B; --red: #EF4444;
}
body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans','Noto Sans JP',sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ─── Header ─── */
#header { display:flex; align-items:center; justify-content:space-between; padding:6px 12px; border-bottom:1px solid var(--border); flex-shrink:0; background:var(--panel); }
#header .logo { display:flex; align-items:center; gap:8px; }
#header .logo-icon { width:24px; height:24px; border-radius:5px; background:linear-gradient(135deg,#818CF8,#4338CA); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#fff; }
#header .logo-text { font-weight:700; font-size:14px; }
#header .badge { font-size:9px; color:#A5B4FC; font-weight:600; background:var(--accent-bg); padding:2px 7px; border-radius:10px; }

/* Tabs */
.tab-group { display:flex; gap:2px; margin:0 12px; }
.tab-btn { padding:4px 14px; font-size:11px; font-weight:600; border:1px solid var(--border); border-radius:5px; cursor:pointer; background:transparent; color:var(--muted); font-family:inherit; transition:all 0.15s; }
.tab-btn:hover { background:var(--accent-bg); color:#A5B4FC; }
.tab-btn.active { background:var(--accent2); color:#fff; border-color:var(--accent); }

/* Toolbar */
.toolbar { display:flex; gap:4px; align-items:center; }
.tb { padding:4px 10px; font-size:11px; font-weight:600; border:1px solid var(--border); border-radius:5px; cursor:pointer; background:transparent; color:#94A3B8; font-family:inherit; transition:all 0.15s; }
.tb:hover { background:#334155; }
.tb.active { background:var(--accent2); color:#fff; border-color:var(--accent); }
.tb-accent { border-color:var(--accent); color:#A5B4FC; }
.tb-green { border-color:var(--green); color:#86EFAC; }
.sep { width:1px; height:14px; background:var(--border); margin:0 4px; }

/* ─── Body ─── */
#body { flex:1; display:flex; overflow:hidden; }

/* ─── Editor Panel (Left) ─── */
#editor-panel { width:320px; min-width:180px; max-width:60vw; display:flex; flex-direction:column; border-right:none; background:var(--editor); }
#splitter { width:5px; cursor:col-resize; background:var(--border); flex-shrink:0; }
#splitter:hover, #splitter.dragging { background:var(--accent); }
.panel-label { padding:4px 10px; font-size:10px; font-weight:600; color:var(--muted); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:4px; text-transform:uppercase; letter-spacing:0.05em; }
.panel-label .dot { font-size:10px; }
#error-bar { padding:4px 10px; background:#7F1D1D; color:#FCA5A5; font-size:10px; display:none; border-top:1px solid #DC2626; max-height:100px; overflow-y:auto; font-family:'IBM Plex Mono',monospace; }
#editor-wrap { flex:1; display:flex; overflow:hidden; background:var(--editor); }
#line-nums { width:40px; padding:12px 4px 12px 0; text-align:right; font-family:'IBM Plex Mono',monospace; font-size:12px; line-height:20px; color:var(--dim); user-select:none; overflow:hidden; flex-shrink:0; }
#editor-container { flex:1; position:relative; overflow:hidden; display:flex; }
#editor {
  flex:1; width:100%; height:100%;
  padding:12px 12px 12px 4px; margin:0; border:0;
  font-family:'IBM Plex Mono',monospace; font-size:12px; line-height:20px;
  white-space:pre; tab-size:2; box-sizing:border-box;
  background:transparent; color:var(--text); caret-color:#e0e0e0;
  outline:none; resize:none; overflow:auto;
}

/* Syntax highlighting */
/* Syntax highlighting classes removed (ECN-030: overlay removed for cursor accuracy) */

/* ─── Center Panel ─── */
#center-panel { flex:1; display:flex; flex-direction:column; overflow:hidden; }

/* Diagram view */
#diagram-view { flex:1; display:flex; flex-direction:column; overflow:hidden; }
#diagram-area { flex:1; overflow:auto; padding:12px; background:repeating-conic-gradient(var(--panel) 0% 25%, var(--bg) 0% 50%) 0 0/24px 24px; }
#svg-wrap { background:#fff; border-radius:8px; display:inline-block; line-height:0; }
#svg-wrap svg { cursor:default; }

/* Table view — single table with sticky header */
#table-view { flex:1; display:none; flex-direction:column; overflow:hidden; }
#table-wrap { flex:1; overflow:auto; }
.st-table { border-collapse:separate; border-spacing:0; font-size:12px; }
.st-table th, .st-table td { border-bottom:1px solid var(--border); border-right:1px solid var(--border); padding:4px 8px; text-align:left; }
.st-table th:first-child, .st-table td:first-child { border-left:1px solid var(--border); position:sticky; left:0; z-index:1; }
.st-table thead tr:first-child th { border-top:1px solid var(--border); }
.st-table th { background:var(--panel); color:var(--accent); font-weight:600; font-size:10px; text-transform:uppercase; }
.st-table thead th:first-child { z-index:2; }
.st-table thead { position:relative; z-index:1; }
.st-table td { background:var(--editor); color:var(--text); }
.st-table td:first-child { background:var(--panel); }
.st-table .ev-header td { background:#2a2233; }
.st-table .ev-header td:first-child { background:#2a2233; }
.st-table .ev-row td:first-child { background:var(--panel); }
#table-empty { display:flex; align-items:center; justify-content:center; height:100%; color:var(--muted); font-size:13px; }

/* ─── Property Panel (Right) ─── */
#prop-panel { width:220px; min-width:140px; max-width:40vw; border-left:none; display:flex; flex-direction:column; overflow:hidden; background:var(--panel); }
#splitter-right { width:5px; cursor:col-resize; background:var(--border); flex-shrink:0; }
#splitter-right:hover, #splitter-right.dragging { background:var(--accent); }
#prop-content { flex:1; overflow-y:auto; padding:12px; }
.prop-section { margin-bottom:12px; }
.prop-label { font-size:10px; color:var(--muted); font-weight:600; margin-bottom:2px; text-transform:uppercase; letter-spacing:0.05em; }
.prop-row { display:flex; gap:6px; margin-bottom:6px; }
.prop-input { background:var(--editor); border:1px solid var(--border); border-radius:4px; color:var(--text); padding:4px 8px; font-size:12px; width:100%; outline:none; font-family:'IBM Plex Mono',monospace; }
.prop-input:focus { border-color:var(--accent); }
.prop-sub { font-size:9px; color:var(--dim); }
.prop-select { background:var(--editor); border:1px solid var(--border); border-radius:4px; color:var(--text); padding:4px 8px; font-size:12px; width:100%; outline:none; font-family:'IBM Plex Mono',monospace; }
.prop-select:focus { border-color:var(--accent); }
.prop-checkbox { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
.prop-checkbox input[type="checkbox"] { accent-color:var(--accent); }
.prop-checkbox label { font-size:11px; color:var(--text); }
.prop-warning { font-size:10px; color:var(--amber); background:#422006; border:1px solid var(--amber); border-radius:4px; padding:4px 8px; margin-top:4px; }

/* Color palette */
.color-grid { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px; }
.color-dot { width:20px; height:20px; border-radius:4px; cursor:pointer; border:2px solid transparent; }
.color-dot.active { border-color:#fff; box-shadow:0 0 0 1px var(--accent); }

/* Style buttons */
.style-btn { padding:3px 10px; font-size:11px; font-weight:600; border:1px solid var(--border); border-radius:5px; cursor:pointer; background:transparent; color:#94A3B8; font-family:inherit; }
.style-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }

/* ─── Status ─── */
#status { display:flex; gap:14px; padding:3px 12px; border-top:1px solid var(--border); font-size:10px; color:var(--dim); flex-shrink:0; background:var(--panel); }

input[type=number] { -moz-appearance:textfield; }
input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; }
</style>
</head>
<body>

<!-- ═══ Header ═══ -->
<div id="header">
  <div class="logo">
    <div class="logo-icon">S</div>
    <span class="logo-text">StableState</span>
    <span class="badge">v0.1.0</span>
  </div>

  <div class="tab-group">
    <button class="tab-btn active" id="tab-diagram" onclick="switchTab('diagram')">Diagram</button>
    <button class="tab-btn" id="tab-table" onclick="switchTab('table')">Table</button>
  </div>

  <div class="toolbar" id="diagram-toolbar">
    <button class="tb active" id="tool-select" onclick="setTool('select')">Select</button>
    <button class="tb" id="tool-state" onclick="setTool('state')">+State</button>
    <button class="tb" id="tool-group" onclick="setTool('group')">+Group</button>
    <button class="tb" id="tool-initial" onclick="setTool('initial')">&#9679;Initial</button>
    <button class="tb" id="tool-final" onclick="setTool('final')">&#9678;Final</button>
    <button class="tb" id="tool-connect" onclick="setTool('connect')" title="Click source element, then click target element to create a transition">&#8599;Connect</button>
    <div class="sep"></div>
    <button class="tb" id="btn-actions" onclick="toggleActions()">Actions</button>
    <button class="tb" id="btn-annotations" onclick="toggleAnnotations()">Notes</button>
    <button class="tb" id="btn-highlight" onclick="toggleHighlight()" title="Highlight connected (H)">&#9678; HL</button>
    <button class="tb" onclick="autoRoute()" title="遷移線の交差を最小化">AutoRoute</button>
    <div class="sep"></div>
    <button class="tb tb-accent" onclick="exportSVG()">SVG</button>
    <button class="tb tb-accent" onclick="exportPNG()">PNG</button>
    <button class="tb tb-accent" onclick="copyPNG()" title="クリップボードにコピー">Copy</button>
    <button class="tb tb-accent" onclick="exportPlantUML()" title="PlantUML形式でエクスポート">PUML</button>
    <button class="tb tb-accent" onclick="exportDSL()" title="DSLファイルをダウンロード">Save</button>
    <label class="tb tb-accent" style="cursor:pointer" title="DSLファイルを読み込み">Open<input type="file" accept=".sstate,.txt" style="display:none" onchange="importDSL(this)"></label>
    <div class="sep"></div>
    <button class="tb" onclick="setZoom(-1)">&minus;</button>
    <span id="zoom-label" style="font-size:11px;color:#94A3B8;min-width:36px;text-align:center">100%</span>
    <button class="tb" onclick="setZoom(1)">+</button>
    <div class="sep"></div>
    <input type="text" id="search-input" placeholder="Search..." style="width:120px;padding:2px 6px;font-size:11px;background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:4px" oninput="applySearchFilter()" onkeydown="if(event.key==='Escape'){clearSearchFilter();this.blur();}">
    <button class="tb" onclick="clearSearchFilter()" title="Clear search" style="padding:2px 6px">&times;</button>
  </div>

  <div class="toolbar" id="table-toolbar" style="display:none">
    <button class="tb" onclick="addEvent()">+Event</button>
    <div class="sep"></div>
    <button class="tb tb-accent" onclick="exportSVG()">SVG</button>
    <button class="tb tb-accent" onclick="exportPNG()">PNG</button>
    <button class="tb tb-accent" onclick="copyPNG()" title="クリップボードにコピー">Copy</button>
    <button class="tb tb-accent" onclick="exportExcel()" title="Excel形式でエクスポート">Excel</button>
    <button class="tb tb-accent" onclick="exportPlantUML()" title="PlantUML形式でエクスポート">PUML</button>
    <button class="tb tb-accent" onclick="exportDSL()" title="DSLファイルをダウンロード">Save</button>
    <label class="tb tb-accent" style="cursor:pointer" title="DSLファイルを読み込み">Open<input type="file" accept=".sstate,.txt" style="display:none" onchange="importDSL(this)"></label>
    <div class="sep"></div>
    <span style="font-size:10px;color:#64748B">Zoom</span>
    <button class="tb" onclick="setTableZoom(-1)">&minus;</button>
    <span id="table-zoom-label" style="font-size:11px;color:#94A3B8;min-width:36px;text-align:center">100%</span>
    <button class="tb" onclick="setTableZoom(1)">+</button>
    <div class="sep"></div>
    <span style="font-size:10px;color:#64748B">Cell W</span>
    <button class="tb" onclick="setTableCellWidth(-1)">&minus;</button>
    <span id="table-cw-label" style="font-size:11px;color:#94A3B8;min-width:36px;text-align:center">80px</span>
    <button class="tb" onclick="setTableCellWidth(1)">+</button>
  </div>
</div>

<!-- ═══ Body ═══ -->
<div id="body">

  <!-- Left: DSL Editor -->
  <div id="editor-panel">
    <div class="panel-label"><span class="dot" style="color:var(--accent)">&#9679;</span> DSL</div>
    <div id="editor-wrap">
      <div id="line-nums"></div>
      <div id="editor-container">
        <textarea id="editor" spellcheck="false">@canvas width=960 height=600 grid=20
@config transition=local

group sys "System" at 0,0 size 46x28 color=#1a1a3e border=#3a3a5a

initial ini at 1,5
state idle "Idle" at 3,3 size 8x5 entry=IdleEntry
state active "Active" at 15,1 size 24x14 entry=ActiveEntry exit=ActiveExit {
  state accel "Accel" at 1,3 size 9x5 entry=AccelEntry do=AccelDo
  state cruise "Cruise" at 13,3 size 9x5 entry=CruiseEntry
}
state error "Error" at 3,18 size 8x5 color=#7F1D1D border=#DC2626
choice c1 at 12,14
final fin at 40,14

ini -> idle
idle -> active : EvStart [IsReady] / ActInit
active.accel -> active.cruise : EvSpeedOk
active.cruise -> active.accel : EvBrake
active -> idle : EvStop / ActStop
active -> c1 : EvError
c1 -> error : [IsCritical]
c1 -> idle :
error -> fin : EvShutdown</textarea>
      </div>
    </div>
    <div id="error-bar"></div>
  </div>

  <div id="splitter"></div>

  <!-- Center: Diagram / Table -->
  <div id="center-panel">
    <div id="diagram-view">
      <div class="panel-label">
        <span class="dot" style="color:var(--green)">&#9679;</span> DIAGRAM
        <span style="margin-left:auto;color:var(--dim);font-weight:400">ドラッグで移動・リサイズ</span>
      </div>
      <div id="diagram-area"><div id="svg-wrap"></div></div>
    </div>
    <div id="table-view">
      <div class="panel-label">
        <span class="dot" style="color:var(--green)">&#9679;</span> TABLE
        <span style="margin-left:auto;color:var(--dim);font-weight:400">セルをクリックして編集</span>
      </div>
      <div id="table-empty">DSLをパースして状態遷移表を生成します</div>
      <div id="table-wrap"><table id="state-table" class="st-table"></table></div>
    </div>
  </div>

  <div id="splitter-right"></div>

  <!-- Right: Property Panel -->
  <div id="prop-panel">
    <div class="panel-label"><span class="dot" style="color:var(--amber)">&#9679;</span> <span id="prop-title">プロパティ</span></div>
    <div id="prop-content"></div>
  </div>

</div>

<!-- ═══ Status bar ═══ -->
<div id="status">
  <span id="status-states">States: 0</span>
  <span id="status-transitions">Transitions: 0</span>
  <span id="status-errors">Errors: 0</span>
</div>

<script>
// ═══════════════════════════════════════════════
// VSCode environment detection
// ═══════════════════════════════════════════════
let vscodeApi = null;
try { vscodeApi = acquireVsCodeApi(); } catch(e) {}
const isVSCode = !!vscodeApi;
let _vscode_dsl = null;
let _suppressVscodeSync = false;
if (isVSCode) { _vscode_dsl = __INITIAL_DSL__; }

// ═══════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════
let parsed = null;
let currentTab = 'diagram';
let currentTool = 'select';
let connectFrom = null; // first element ID in connect mode
let showActions = false;
let zoomLevel = 100;
let sel = []; // [{type, id}, ...] — StableBlock compatible
function isSel(id) { return sel.some(s => s.id === id); }
function isSelected(id) { return isSel(id); } // renderSVG compat wrapper

function getItem(si) {
  if (!parsed) return null;
  if (si.type === 'state') return parsed.stateMap[si.id] || null;
  if (si.type === 'group') return parsed.groupMap[si.id] || null;
  if (si.type === 'note') return parsed.noteMap[si.id] || null;
  return parsed.pseudoMap[si.id] || null;
}

function resolveSelType(id) {
  if (!parsed) return 'state';
  if (parsed.stateMap[id]) return 'state';
  if (parsed.pseudoMap[id]) return parsed.pseudoMap[id].type;
  if (parsed.groupMap[id]) return 'group';
  if (parsed.noteMap[id]) return 'note';
  return 'state';
}

// Build dot-path reference for a state/pseudo (e.g. "active.accel")
function stateDotPath(id) {
  if (!parsed) return id;
  const el = parsed.stateMap[id] || parsed.pseudoMap[id];
  if (!el || !el.parent) return id;
  // Walk up parent chain
  const parts = [id];
  let pid = el.parent;
  while (pid) {
    parts.unshift(pid);
    const p = parsed.stateMap[pid];
    pid = p ? p.parent : null;
  }
  return parts.join('.');
}

// Interaction state
let annotationMode = false; // annotation mode: notes visible + editable, normal elements dimmed + non-interactive
// dragState/resizeState replaced by setupInteractions() closures
let undoHistory = [];      // undo stack (DSL snapshots)
let redoFuture = [];       // redo stack
const MAX_HISTORY = 100;
let clipboard = null;      // copied DSL lines
let zoom = 1.0;
let tableZoom = 1.0;
let tableCellWidth = 80;
let snapGuides = [];       // [{axis:'x'|'y', pos:number}] for rendering
let searchFilter = '';     // ADR-026: search/filter string
let searchMatchIds = null; // Set of matching IDs, or null if no filter
let highlight = false;

function getConnectedIds() {
  if (!parsed) return new Set();
  const ids = new Set();
  for (const t of parsed.transitions) {
    const fromEl = resolveStateRef(t.from, parsed);
    const toEl = resolveStateRef(t.to, parsed);
    if (fromEl) ids.add(fromEl.id);
    if (toEl) ids.add(toEl.id);
  }
  return ids;
}

function toggleHighlight() {
  highlight = !highlight;
  const btn = document.getElementById('btn-highlight');
  if (btn) btn.classList.toggle('active', highlight);
  refresh();
}

// ═══════════════════════════════════════════════
// Tab Switching
// ═══════════════════════════════════════════════
function switchTab(name) {
  currentTab = name;

  // Tab buttons
  document.getElementById('tab-diagram').classList.toggle('active', name === 'diagram');
  document.getElementById('tab-table').classList.toggle('active', name === 'table');

  // Views
  document.getElementById('diagram-view').style.display = name === 'diagram' ? 'flex' : 'none';
  document.getElementById('table-view').style.display = name === 'table' ? 'flex' : 'none';

  // Toolbars
  document.getElementById('diagram-toolbar').style.display = name === 'diagram' ? 'flex' : 'none';
  document.getElementById('table-toolbar').style.display = name === 'table' ? 'flex' : 'none';
}

// ═══════════════════════════════════════════════
// Tool Selection
// ═══════════════════════════════════════════════
function setTool(name) {
  currentTool = name;
  const tools = ['select','state','group','initial','final','connect'];
  tools.forEach(t => {
    const el = document.getElementById('tool-' + t);
    if (el) el.classList.toggle('active', t === name);
  });
  updateStatus();
}

// ═══════════════════════════════════════════════
// Table Zoom
// ═══════════════════════════════════════════════
function setTableZoom(delta) {
  tableZoom = Math.max(0.25, Math.min(3, tableZoom + delta * 0.25));
  document.getElementById('table-zoom-label').textContent = Math.round(tableZoom * 100) + '%';
  const tableEl = document.getElementById('state-table');
  if (tableEl) tableEl.style.zoom = tableZoom;
}

document.getElementById('table-wrap').addEventListener('wheel', function(e) {
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    setTableZoom(e.deltaY < 0 ? 1 : -1);
  }
}, { passive: false });

function setTableCellWidth(delta) {
  tableCellWidth = Math.max(40, Math.min(240, tableCellWidth + delta * 20));
  document.getElementById('table-cw-label').textContent = tableCellWidth + 'px';
  if (parsed) renderTable(parsed);
}

// Actions Toggle
// ═══════════════════════════════════════════════
function toggleActions() {
  showActions = !showActions;
  document.getElementById('btn-actions').classList.toggle('active', showActions);
  refresh();
}

// ═══════════════════════════════════════════════
// Zoom
// ═══════════════════════════════════════════════
function setZoom(delta) {
  zoom = Math.max(0.25, Math.min(3, zoom + delta * 0.25));
  document.getElementById('zoom-label').textContent = Math.round(zoom * 100) + '%';
  document.getElementById('svg-wrap').innerHTML = renderSVG(parsed);
  setupInteractions();
}

// ═══════════════════════════════════════════════
// Parser
// ═══════════════════════════════════════════════
// ═══════════════════════════════════════════════
// @include Preprocessor
// ═══════════════════════════════════════════════
const includeCache = {};
async function preprocessInclude(text) {
  const lines = text.split('\n'), out = [];
  for (const line of lines) {
    const m = line.trim().match(/^@include\s+"([^"]+)"/);
    if (m) {
      const path = m[1];
      try {
        if (!includeCache[path]) {
          const r = await fetch(path);
          if (r.ok) includeCache[path] = await r.text();
          else includeCache[path] = `# include error: ${path} not found`;
        }
        out.push(includeCache[path]);
      } catch (e) { out.push(`# include error: ${path}`); }
    } else { out.push(line); }
  }
  return out.join('\n');
}

function parseDSL(text) {
  const result = {
    canvas: { width: 960, height: 600, grid: 20 },
    config: { transition: 'local', orthogonal: false, history: false },
    states: [],
    pseudoStates: [],
    groups: [],
    regions: [],
    regionMap: {},
    transitions: [],
    notes: [],
    noteConnections: [],
    errors: [],
    stateMap: {},
    pseudoMap: {},
    groupMap: {},
    noteMap: {}
  };

  const lines = text.split('\n');
  const nestingStack = []; // stack of {type:'state'|'region', id}
  let currentRegion = null; // current region ID (for assigning states to regions)

  for (let i = 0; i < lines.length; i++) {
    const lineNum = i + 1;
    const raw = lines[i];
    const trimmed = raw.trim();

    // Skip empty lines and comments
    if (trimmed === '' || trimmed.startsWith('#')) continue;

    // ─── Closing brace ───
    if (/^\}/.test(trimmed)) {
      if (nestingStack.length === 0) {
        result.errors.push({ line: lineNum, msg: 'Unexpected closing brace }' });
        continue;
      }
      const popped = nestingStack.pop();
      if (popped.type === 'region') {
        currentRegion = null;
      } else {
        // Parse trailing props on the closing brace line: } entry=Foo exit=Bar
        const afterBrace = trimmed.slice(1).trim();
        if (afterBrace && result.stateMap[popped.id]) {
          parseProps(afterBrace, result.stateMap[popped.id]);
        }
      }
      continue;
    }

    // ─── @include ───
    const includeMatch = trimmed.match(/^@include\s+"([^"]+)"/);
    if (includeMatch) {
      result.errors.push({ line: lineNum, msg: `@include "${includeMatch[1]}" — use preprocessInclude() to resolve before parsing` });
      continue;
    }

    // ─── @canvas ───
    const canvasMatch = trimmed.match(/^@canvas\s+(.+)$/);
    if (canvasMatch) {
      const propsStr = canvasMatch[1];
      const wm = propsStr.match(/width=(\d+)/);
      const hm = propsStr.match(/height=(\d+)/);
      const gm = propsStr.match(/grid=(\d+)/);
      if (wm) result.canvas.width = parseInt(wm[1], 10);
      if (hm) result.canvas.height = parseInt(hm[1], 10);
      if (gm) result.canvas.grid = parseInt(gm[1], 10);
      continue;
    }

    // ─── @config ───
    const configMatch = trimmed.match(/^@config\s+(\w+)=(\S+)$/);
    if (configMatch) {
      const key = configMatch[1];
      const val = configMatch[2];
      if (key === 'transition') {
        result.config.transition = val;
      } else if (key === 'orthogonal') {
        result.config.orthogonal = val === 'true';
      } else if (key === 'history') {
        result.config.history = val === 'true';
      }
      continue;
    }

    // ─── Pseudo-states ───
    const pseudoTypes = ['initial', 'final', 'choice', 'history', 'deephistory', 'fork', 'join'];
    const pseudoMatch = trimmed.match(/^(initial|final|choice|history|deephistory|fork|join)\s+(\S+)\s+at\s+(-?[\d.]+)\s*,\s*(-?[\d.]+)(?:\s+size\s+(-?[\d.]+)\s*x\s*(-?[\d.]+))?/);
    if (pseudoMatch) {
      const id = pseudoMatch[2];
      // Duplicate ID check across all maps
      if (checkDuplicate(id, lineNum, result)) continue;
      const ps = {
        type: pseudoMatch[1],
        id: id,
        x: parseFloat(pseudoMatch[3]),
        y: parseFloat(pseudoMatch[4]),
        w: pseudoMatch[5] ? parseFloat(pseudoMatch[5]) : null,
        h: pseudoMatch[6] ? parseFloat(pseudoMatch[6]) : null,
        parent: nestingStack.length > 0 ? nestingStack.findLast(e => e.type === 'state')?.id || null : null,
        line: lineNum
      };
      result.pseudoStates.push(ps);
      result.pseudoMap[id] = ps;
      continue;
    }

    // ─── region (orthogonal) ───
    const regionMatch = trimmed.match(/^region\s+(\S+)\s+"([^"]*)"\s*\{?\s*$/);
    if (regionMatch) {
      const regionId = regionMatch[1];
      const regionLabel = regionMatch[2];
      const parentState = nestingStack.length > 0 ? nestingStack.findLast(e => e.type === 'state')?.id || null : null;
      const region = {
        id: regionId,
        label: regionLabel,
        parent: parentState,
        line: lineNum
      };
      result.regions.push(region);
      result.regionMap[regionId] = region;
      currentRegion = regionId;
      if (trimmed.endsWith('{')) {
        nestingStack.push({ type: 'region', id: regionId });
      }
      continue;
    }

    // ─── state ───
    const stateMatch = trimmed.match(/^state\s+(\S+)\s+"([^"]*)"\s+at\s+(-?[\d.]+)\s*,\s*(-?[\d.]+)\s+size\s+(-?[\d.]+)\s*x\s*(-?[\d.]+)(.*)$/);
    if (stateMatch) {
      const id = stateMatch[1];
      if (checkDuplicate(id, lineNum, result)) continue;
      const rest = stateMatch[7].trim();
      // Check if composite (ends with {)
      const isComposite = rest.endsWith('{');
      const propsStr = isComposite ? rest.slice(0, -1).trim() : rest;

      const st = {
        type: 'state',
        id: id,
        label: stateMatch[2],
        x: parseFloat(stateMatch[3]),
        y: parseFloat(stateMatch[4]),
        w: parseFloat(stateMatch[5]),
        h: parseFloat(stateMatch[6]),
        color: null,
        textColor: null,
        borderColor: null,
        round: null,
        style: null,
        entry: null,
        do: null,
        exit: null,
        parent: nestingStack.length > 0 ? nestingStack.findLast(e => e.type === 'state')?.id || null : null,
        region: currentRegion,
        children: [],
        isInitial: false,
        line: lineNum
      };

      // Parse props
      if (propsStr) parseProps(propsStr, st);

      result.states.push(st);
      result.stateMap[id] = st;

      // Add to parent's children
      if (st.parent && result.stateMap[st.parent]) {
        result.stateMap[st.parent].children.push(id);
      }

      // Push onto nesting stack if composite
      if (isComposite) {
        nestingStack.push({ type: 'state', id: id });
      }
      continue;
    }

    // ─── group ───
    const groupMatch = trimmed.match(/^group\s+(\S+)\s+"([^"]*)"\s+at\s+(-?[\d.]+)\s*,\s*(-?[\d.]+)\s+size\s+(-?[\d.]+)\s*x\s*(-?[\d.]+)(.*)$/);
    if (groupMatch) {
      const id = groupMatch[1];
      if (checkDuplicate(id, lineNum, result)) continue;
      const rest = groupMatch[7].trim();
      const g = {
        type: 'group',
        id: id,
        label: groupMatch[2],
        x: parseFloat(groupMatch[3]),
        y: parseFloat(groupMatch[4]),
        w: parseFloat(groupMatch[5]),
        h: parseFloat(groupMatch[6]),
        color: null,
        borderColor: null,
        textColor: null,
        style: null,
        line: lineNum
      };
      if (rest) parseProps(rest, g);
      result.groups.push(g);
      result.groupMap[id] = g;
      continue;
    }

    // ─── note ───
    const noteMatch = trimmed.match(/^note\s+(\S+)\s+"([^"]*)"\s+at\s+(-?[\d.]+)\s*,\s*(-?[\d.]+)\s+size\s+(-?[\d.]+)\s*x\s*(-?[\d.]+)(.*)$/);
    if (noteMatch) {
      const id = noteMatch[1];
      if (checkDuplicate(id, lineNum, result)) continue;
      const rest = noteMatch[7].trim();
      const n = {
        type: 'note',
        id: id,
        label: noteMatch[2],
        x: parseFloat(noteMatch[3]),
        y: parseFloat(noteMatch[4]),
        w: parseFloat(noteMatch[5]),
        h: parseFloat(noteMatch[6]),
        color: null,
        textColor: null,
        line: lineNum
      };
      if (rest) parseProps(rest, n);
      result.notes.push(n);
      result.noteMap[id] = n;
      continue;
    }

    // ─── Transition / Note connection ───
    const transMatch = trimmed.match(/^(\S+)\s*->\s*(\S+)(.*)$/);
    if (transMatch) {
      const from = transMatch[1];
      const to = transMatch[2];
      const rest = transMatch[3].trim();

      // If source is in noteMap, it's a note connection
      if (result.noteMap[from]) {
        result.noteConnections.push({
          noteId: from,
          targetId: to,
          line: lineNum
        });
        continue;
      }

      // Parse optional : Event [Guard] / Action @kind width=N style=S color=C
      let event = null, guard = null, action = null, kind = null, width = null, style = null, color = null;
      if (rest.startsWith(':')) {
        const detail = rest.slice(1).trim();
        let remaining = detail;
        // Parse trailing key=value attributes (width, style, color) from the end
        const attrRe = /\b(width|style|color)=(\S+)/g;
        let attrMatch;
        while ((attrMatch = attrRe.exec(remaining)) !== null) {
          if (attrMatch[1] === 'width') width = parseFloat(attrMatch[2]);
          else if (attrMatch[1] === 'style') style = attrMatch[2];
          else if (attrMatch[1] === 'color') color = attrMatch[2];
        }
        // Strip all key=value attrs from remaining
        remaining = remaining.replace(/\b(width|style|color)=\S+/g, '').trim();
        // Parse @kind from the end
        const kindMatch = remaining.match(/@(local|external|internal)\s*$/);
        if (kindMatch) {
          kind = kindMatch[1];
          remaining = remaining.slice(0, remaining.lastIndexOf('@' + kind)).trim();
        }
        // Parse / Action
        const slashIdx = remaining.indexOf('/');
        if (slashIdx !== -1) {
          action = remaining.slice(slashIdx + 1).trim() || null;
          remaining = remaining.slice(0, slashIdx).trim();
        }
        // Parse [Guard]
        const guardMatch = remaining.match(/\[([^\]]*)\]/);
        if (guardMatch) {
          guard = guardMatch[1].trim() || null;
          remaining = remaining.slice(0, remaining.indexOf('[')).trim();
        }
        // Remaining is the event
        event = remaining.trim() || null;
      }

      result.transitions.push({
        from: from,
        to: to,
        event: event,
        guard: guard,
        action: action,
        kind: kind || result.config.transition,
        width: width,
        style: style,
        color: color,
        label: rest.startsWith(':') ? rest.slice(1).trim() : null,
        line: lineNum
      });
      continue;
    }

    // ─── Unrecognized line ───
    result.errors.push({ line: lineNum, msg: 'Unrecognized syntax: ' + trimmed });
  }

  // Check for unclosed braces
  if (nestingStack.length > 0) {
    result.errors.push({ line: lines.length, msg: 'Unclosed composite state: ' + nestingStack.join(', ') });
  }

  return result;
}

/** Parse key=value props and apply them to target object */
function parseProps(propsStr, target) {
  // Match key=value pairs where value can be #HEX, word, or quoted
  const propRe = /(\w+)=(\S+)/g;
  let m;
  while ((m = propRe.exec(propsStr)) !== null) {
    const key = m[1];
    const val = m[2];
    switch (key) {
      case 'entry': target.entry = val; break;
      case 'do': target.do = val; break;
      case 'exit': target.exit = val; break;
      case 'color': target.color = val; break;
      case 'text': target.textColor = val; break;
      case 'border': target.borderColor = val; break;
      case 'round': target.round = parseFloat(val); break;
      case 'style': target.style = val; break;
    }
  }
}

/** Check if an ID already exists in any map; push error if duplicate */
function checkDuplicate(id, lineNum, result) {
  if (result.stateMap[id] || result.pseudoMap[id] || result.groupMap[id] || result.noteMap[id]) {
    result.errors.push({ line: lineNum, msg: 'Duplicate ID: ' + id });
    return true;
  }
  return false;
}

// ═══════════════════════════════════════════════
// Resolve dot-path state references
// ═══════════════════════════════════════════════
function resolveStateRef(dotPath, parsed) {
  if (parsed.stateMap[dotPath]) return parsed.stateMap[dotPath];
  if (parsed.pseudoMap[dotPath]) return parsed.pseudoMap[dotPath];
  const parts = dotPath.split('.');
  const leafId = parts[parts.length - 1];
  // Search states and pseudo-states for dot-path match
  const candidates = [
    ...parsed.states.filter(s => s.id === leafId),
    ...parsed.pseudoStates.filter(s => s.id === leafId)
  ];
  for (const c of candidates) {
    let match = true, cur = c;
    for (let i = parts.length - 2; i >= 0; i--) {
      if (!cur.parent || cur.parent !== parts[i]) { match = false; break; }
      cur = parsed.stateMap[cur.parent];
    }
    if (match) return c;
  }
  return null;
}

// ═══════════════════════════════════════════════
// Validation
// ═══════════════════════════════════════════════
function validate(result) {
  // Helper: collect all defined IDs (states + pseudos) for reference checking
  const allIds = new Set([
    ...Object.keys(result.stateMap),
    ...Object.keys(result.pseudoMap)
  ]);

  // Helper: check if a reference (possibly dot-notation) resolves
  function refExists(ref) {
    if (allIds.has(ref)) return true;
    return resolveStateRef(ref, result) !== null;
  }

  // ─── Transition references: from/to must reference defined state/pseudo IDs ───
  for (const t of result.transitions) {
    if (!refExists(t.from)) {
      result.errors.push({ line: t.line, msg: 'Undefined state reference: ' + t.from });
    }
    if (!refExists(t.to)) {
      result.errors.push({ line: t.line, msg: 'Undefined state reference: ' + t.to });
    }
  }

  // ─── Initial state required at each hierarchy level ───
  // Check root level
  const rootInitials = result.pseudoStates.filter(p => p.type === 'initial' && p.parent === null);
  const rootStates = result.states.filter(s => s.parent === null);
  if (rootStates.length > 0 && rootInitials.length === 0) {
    result.errors.push({ line: 1, msg: 'Warning: No initial pseudo-state at root level' });
  }
  // Check each composite state
  for (const s of result.states) {
    if (s.children.length > 0) {
      const childInitials = result.pseudoStates.filter(p => p.type === 'initial' && p.parent === s.id);
      if (childInitials.length === 0) {
        result.errors.push({ line: s.line, msg: 'Warning: No initial pseudo-state inside composite state ' + s.id });
      }
    }
  }

  // ─── Initial pseudo-state must have exactly 1 outgoing transition, with no event/guard ───
  for (const ps of result.pseudoStates) {
    if (ps.type !== 'initial') continue;
    const outgoing = result.transitions.filter(t => t.from === ps.id);
    if (outgoing.length === 0) {
      result.errors.push({ line: ps.line, msg: 'initial pseudo-state ' + ps.id + ' must have exactly 1 outgoing transition (has 0)' });
    } else if (outgoing.length > 1) {
      result.errors.push({ line: ps.line, msg: 'initial pseudo-state ' + ps.id + ' must have exactly 1 outgoing transition (has ' + outgoing.length + ')' });
    }
    for (const t of outgoing) {
      if (t.event) {
        result.errors.push({ line: t.line, msg: 'initial pseudo-state transition must not have an event (found: ' + t.event + ')' });
      }
      if (t.guard) {
        result.errors.push({ line: t.line, msg: 'initial pseudo-state transition must not have a guard (found: [' + t.guard + '])' });
      }
    }
  }

  // ─── Choice branches: must be guard-only (no event), max 1 guard-less (else/default) ───
  for (const ps of result.pseudoStates) {
    if (ps.type !== 'choice') continue;
    const outgoing = result.transitions.filter(t => t.from === ps.id);
    let guardlessCount = 0;
    for (const t of outgoing) {
      if (t.event) {
        result.errors.push({ line: t.line, msg: 'choice pseudo-state transition must not have an event (found: ' + t.event + ')' });
      }
      if (!t.guard) {
        guardlessCount++;
      }
    }
    if (guardlessCount > 1) {
      result.errors.push({ line: ps.line, msg: 'choice pseudo-state ' + ps.id + ' has ' + guardlessCount + ' guard-less transitions (max 1 allowed as else/default)' });
    }
  }

  // ─── Config constraints ───
  // region/fork/join used without orthogonal=true → warning
  const needsOrthogonal = result.pseudoStates.filter(p => ['fork', 'join'].includes(p.type));
  if (needsOrthogonal.length > 0 && !result.config.orthogonal) {
    for (const ps of needsOrthogonal) {
      result.errors.push({ line: ps.line, msg: 'Warning: ' + ps.type + ' pseudo-state ' + ps.id + ' used without @config orthogonal=true' });
    }
  }
  if (result.regions.length > 0 && !result.config.orthogonal) {
    for (const r of result.regions) {
      result.errors.push({ line: r.line || 1, msg: 'Warning: region used without @config orthogonal=true' });
    }
  }
  // history/deephistory without history=true → warning
  const needsHistory = result.pseudoStates.filter(p => ['history', 'deephistory'].includes(p.type));
  if (needsHistory.length > 0 && !result.config.history) {
    for (const ps of needsHistory) {
      result.errors.push({ line: ps.line, msg: 'Warning: ' + ps.type + ' pseudo-state ' + ps.id + ' used without @config history=true' });
    }
  }

  // ─── Nesting bounds: child state coords+size exceeding parent bounds → warning ───
  for (const s of result.states) {
    if (!s.parent) continue;
    const parent = result.stateMap[s.parent];
    if (!parent) continue;
    // Child coords are relative to parent
    if (s.x + s.w > parent.w || s.y + s.h > parent.h || s.x < 0 || s.y < 0) {
      result.errors.push({ line: s.line, msg: 'Warning: state ' + s.id + ' exceeds bounds of parent ' + parent.id });
    }
  }
}

// ═══════════════════════════════════════════════
// DSL Updaters (Bidirectional Sync Foundation)
// ═══════════════════════════════════════════════

// Update position (at X,Y) for a given element type and id
function updatePos(type, id, nx, ny, dsl) {
  const re = new RegExp(`^(\\s*${type}\\s+${id}\\s+(?:"[^"]*"\\s+)?at\\s+)[\\d.]+,[\\d.]+(.*$)`, 'm');
  return dsl.replace(re, `$1${nx},${ny}$2`);
}

// Update size (size WxH) for a given element type and id
function updateSize(type, id, nw, nh, dsl) {
  const re = new RegExp(`^(\\s*${type}\\s+${id}\\s+.*\\bsize\\s+)[\\d.]+x[\\d.]+(.*$)`, 'm');
  return dsl.replace(re, `$1${nw}x${nh}$2`);
}

// Add or replace a property (key=value) on an element line
function updateProp(type, id, prop, val, dsl) {
  // First try to replace existing prop
  const reExist = new RegExp(`^(\\s*${type}\\s+${id}\\s+.*)\\b${prop}=\\S+(.*$)`, 'm');
  if (reExist.test(dsl)) {
    return dsl.replace(reExist, `$1${prop}=${val}$2`);
  }
  // Prop doesn't exist — append before trailing { or at end of line
  const reLine = new RegExp(`^(\\s*${type}\\s+${id}\\s+.+)$`, 'm');
  return dsl.replace(reLine, function(wholeLine) {
    const trimEnd = wholeLine.trimEnd();
    if (trimEnd.endsWith('{')) {
      return trimEnd.slice(0, -1).trimEnd() + ` ${prop}=${val} {`;
    }
    return trimEnd + ` ${prop}=${val}`;
  });
}

// Change the quoted label for an element
function updateLabel(type, id, newLabel, dsl) {
  const re = new RegExp(`^(\\s*${type}\\s+${id}\\s+)"[^"]*"(.*)$`, 'm');
  return dsl.replace(re, `$1"${newLabel}"$2`);
}

// Append a new transition line to the DSL
function addTransition(from, to, event, guard, action, kind, dsl) {
  // Determine default transition kind from @config
  let defaultKind = 'local';
  const configMatch = dsl.match(/^@config\s+transition=(\S+)/m);
  if (configMatch) defaultKind = configMatch[1];

  let line = `${from} -> ${to}`;
  const hasEvent = event != null && event !== '';
  const hasGuard = guard != null && guard !== '';
  const hasAction = action != null && action !== '';
  const hasKind = kind != null && kind !== '' && kind !== defaultKind;

  if (hasEvent || hasGuard || hasAction || hasKind) {
    line += ' :';
    if (hasEvent) line += ` ${event}`;
    if (hasGuard) line += ` [${guard}]`;
    if (hasAction) line += ` / ${action}`;
    if (hasKind) line += ` @${kind}`;
  }

  return dsl + '\n' + line;
}

// Remove a matching transition line (match by from, to, event, guard)
function removeTransition(from, to, event, guard, dsl) {
  const lines = dsl.split('\n');
  const result = [];
  for (const line of lines) {
    const trimmed = line.trim();
    const m = trimmed.match(/^(\S+)\s*->\s*(\S+)(.*)$/);
    if (m && m[1] === from && m[2] === to) {
      // Parse the rest to extract event and guard
      const rest = m[3].trim();
      let lineEvent = null, lineGuard = null;
      if (rest.startsWith(':')) {
        let detail = rest.slice(1).trim();
        // Remove @kind
        detail = detail.replace(/@(local|external|internal)\s*$/, '').trim();
        // Remove action
        const slashIdx = detail.indexOf('/');
        if (slashIdx !== -1) detail = detail.slice(0, slashIdx).trim();
        // Extract guard
        const gm = detail.match(/\[([^\]]*)\]/);
        if (gm) {
          lineGuard = gm[1].trim() || null;
          detail = detail.slice(0, detail.indexOf('[')).trim();
        }
        lineEvent = detail || null;
      }
      // Match event and guard
      const eMatch = (event == null || event === '') ? (lineEvent == null || lineEvent === '') : lineEvent === event;
      const gMatch = (guard == null || guard === '') ? (lineGuard == null || lineGuard === '') : lineGuard === guard;
      if (eMatch && gMatch) continue; // skip this line (remove it)
    }
    result.push(line);
  }
  return result.join('\n');
}

// Replace a matching transition line in-place (preserves DSL order)
function replaceTransition(oldFrom, oldTo, oldEvent, oldGuard, newFrom, newTo, newEvent, newGuard, newAction, newKind, dsl) {
  // Build the new transition line (same logic as addTransition)
  let defaultKind = 'local';
  const configMatch = dsl.match(/^@config\s+transition=(\S+)/m);
  if (configMatch) defaultKind = configMatch[1];

  let newLine = `${newFrom} -> ${newTo}`;
  const hasEvent = newEvent != null && newEvent !== '';
  const hasGuard = newGuard != null && newGuard !== '';
  const hasAction = newAction != null && newAction !== '';
  const hasKind = newKind != null && newKind !== '' && newKind !== defaultKind;

  if (hasEvent || hasGuard || hasAction || hasKind) {
    newLine += ' :';
    if (hasEvent) newLine += ` ${newEvent}`;
    if (hasGuard) newLine += ` [${newGuard}]`;
    if (hasAction) newLine += ` / ${newAction}`;
    if (hasKind) newLine += ` @${newKind}`;
  }

  // Find and replace the matching line (same matching logic as removeTransition)
  const lines = dsl.split('\n');
  let replaced = false;
  for (let i = 0; i < lines.length; i++) {
    const trimmed = lines[i].trim();
    const m = trimmed.match(/^(\S+)\s*->\s*(\S+)(.*)$/);
    if (m && m[1] === oldFrom && m[2] === oldTo) {
      const rest = m[3].trim();
      let lineEvent = null, lineGuard = null;
      if (rest.startsWith(':')) {
        let detail = rest.slice(1).trim();
        detail = detail.replace(/@(local|external|internal)\s*$/, '').trim();
        const slashIdx = detail.indexOf('/');
        if (slashIdx !== -1) detail = detail.slice(0, slashIdx).trim();
        const gm = detail.match(/\[([^\]]*)\]/);
        if (gm) {
          lineGuard = gm[1].trim() || null;
          detail = detail.slice(0, detail.indexOf('[')).trim();
        }
        lineEvent = detail || null;
      }
      const eMatch = (oldEvent == null || oldEvent === '') ? (lineEvent == null || lineEvent === '') : lineEvent === oldEvent;
      const gMatch = (oldGuard == null || oldGuard === '') ? (lineGuard == null || lineGuard === '') : lineGuard === oldGuard;
      if (eMatch && gMatch) {
        lines[i] = newLine;
        replaced = true;
        break;
      }
    }
  }

  if (replaced) return lines.join('\n');
  // Fallback: append (same as addTransition)
  return dsl + '\n' + newLine;
}

// Parse if/else action syntax into branch array
// Returns null if not if/else with transitions, or { branches: [{guard, target, action}], hasTransition: bool }
function parseIfElseAction(text) {
  if (!text) return null;
  const lines = text.split('\n');
  if (!lines[0].trim().startsWith('if [')) return null;

  function getIndent(line) { const m = line.match(/^( *)/); return m ? m[1].length : 0; }

  function parseLevel(startIdx, baseIndent) {
    const branches = [];
    let i = startIdx;
    while (i < lines.length) {
      const indent = getIndent(lines[i]);
      if (indent < baseIndent) break;
      if (indent > baseIndent) { i++; continue; }
      const line = lines[i].trim();
      let guard = null;

      if (line.startsWith('if [') || line.startsWith('elif [') || line.startsWith('else if [')) {
        const gm = line.match(/\[([^\]]*)\]/);
        guard = gm ? gm[1].trim() : null;
      } else if (line === 'else') {
        guard = null;
      } else {
        i++;
        continue;
      }

      // Collect body lines (indented deeper than keyword)
      i++;
      const bodyLines = [];
      while (i < lines.length && (getIndent(lines[i]) > baseIndent || lines[i].trim() === '')) {
        bodyLines.push(lines[i].trim());
        i++;
      }

      // Parse body: find -> target and collect actions
      let target = null;
      let targetAction = null;
      const actions = [];
      for (const bl of bodyLines) {
        if (bl === '') continue;
        const tm = bl.match(/^->\s*(\S+)(?:\s*\/\s*(.*))?$/);
        if (tm) {
          target = tm[1];
          targetAction = tm[2] ? tm[2].trim() : null;
        } else {
          actions.push(bl);
        }
      }

      // Combine actions: body actions + target action (if any)
      const allActions = [...actions];
      if (targetAction) allActions.push(targetAction);
      const actionStr = allActions.length > 0 ? allActions.join('\\n') : null;

      branches.push({ guard: guard, target: target, action: actionStr });
    }
    return branches;
  }

  const branches = parseLevel(0, 0);
  if (branches.length === 0) return null;

  // Check if any branch has a transition (->)
  const hasTransition = branches.some(b => b.target !== null);
  return { branches: branches, hasTransition: hasTransition };
}

// Apply if/else branches as choice pseudo-state + transitions in DSL
function applyChoiceBranches(stateId, evName, branches, defaultTarget, parsed, dsl) {
  const ev = evName === '(none)' ? null : evName;
  const fromPath = stateDotPath(stateId);

  // Find next auto ID
  let maxAuto = 0;
  for (const ps of parsed.pseudoStates) {
    const am = ps.id.match(/^c_auto_(\d+)$/);
    if (am) maxAuto = Math.max(maxAuto, parseInt(am[1]));
  }
  // Also scan DSL text for c_auto_ IDs (covers IDs added during this call)
  const dslAutoMatches = dsl.matchAll(/c_auto_(\d+)/g);
  for (const m of dslAutoMatches) {
    maxAuto = Math.max(maxAuto, parseInt(m[1]));
  }

  // Search for existing choice from this state+event
  let choiceId = null;
  for (const t of parsed.transitions) {
    const fromEl = resolveStateRef(t.from, parsed);
    if (fromEl && fromEl.id === stateId && (t.event || null) === ev) {
      if (parsed.pseudoMap[t.to] && parsed.pseudoMap[t.to].type === 'choice') {
        choiceId = t.to;
        break;
      }
    }
  }

  if (choiceId) {
    // Existing choice: remove all outgoing transitions
    const choiceOutgoing = parsed.transitions.filter(t => t.from === choiceId);
    for (const t of choiceOutgoing) {
      dsl = removeTransition(t.from, t.to, t.event, t.guard, dsl);
    }
  } else {
    // New choice
    maxAuto++;
    choiceId = 'c_auto_' + maxAuto;
    const srcState = parsed.stateMap[stateId];
    const choiceX = srcState ? srcState.x + srcState.w + 2 : 10;
    const choiceY = srcState ? srcState.y + Math.floor(srcState.h / 2) : 10;
    dsl = dsl.trimEnd() + '\nchoice ' + choiceId + ' at ' + choiceX + ',' + choiceY + '\n';

    // Point source transition to the choice
    const existingTrans = parsed.transitions.find(t => {
      const fromEl = resolveStateRef(t.from, parsed);
      return fromEl && fromEl.id === stateId && (t.event || null) === ev;
    });
    if (existingTrans) {
      dsl = replaceTransition(existingTrans.from, existingTrans.to, existingTrans.event, existingTrans.guard,
        fromPath, choiceId, ev, null, null, null, dsl);
    } else {
      dsl = addTransition(fromPath, choiceId, ev, null, null, null, dsl);
    }
  }

  // Add branch transitions from choice
  let hasElse = false;
  for (const b of branches) {
    if (!b.guard) hasElse = true;
    if (b.target) {
      const targetPath = stateDotPath(b.target);
      dsl = addTransition(choiceId, targetPath, null, b.guard, b.action, null, dsl);
    } else if (defaultTarget) {
      // Branch without -> but has actions: use defaultTarget
      const targetPath = stateDotPath(defaultTarget);
      dsl = addTransition(choiceId, targetPath, null, b.guard, b.action, null, dsl);
    }
  }

  // Add fallback (implicit else) from defaultTarget if no explicit else
  if (!hasElse && defaultTarget) {
    const targetPath = stateDotPath(defaultTarget);
    dsl = addTransition(choiceId, targetPath, null, null, null, null, dsl);
  }

  return dsl;
}

// Reverse-convert choice branches to if/else action text
function actionToIfElse(transitionTo, parsed) {
  const ps = parsed.pseudoMap[transitionTo];
  if (!ps || ps.type !== 'choice') return null;

  const outgoing = parsed.transitions.filter(t => t.from === transitionTo);
  if (outgoing.length === 0) return null;

  const parts = [];
  let isFirst = true;
  for (const t of outgoing) {
    const tgtEl = resolveStateRef(t.to, parsed);
    const targetLabel = tgtEl ? tgtEl.id : t.to;

    let keyword;
    if (t.guard) {
      keyword = isFirst ? 'if' : 'elif';
      keyword += ' [' + t.guard + ']';
    } else {
      keyword = 'else';
    }

    // Build body lines
    const bodyLines = [];
    if (t.action) {
      const actionParts = t.action.split('\\n');
      for (const ap of actionParts) bodyLines.push('  ' + ap);
    }
    bodyLines.push('  -> ' + targetLabel);

    parts.push(keyword + '\n' + bodyLines.join('\n'));
    isFirst = false;
  }

  return parts.join('\n');
}

// Update a specific field of a matching transition line
function updateTransition(from, to, event, guard, field, val, dsl) {
  const lines = dsl.split('\n');
  for (let i = 0; i < lines.length; i++) {
    const trimmed = lines[i].trim();
    const m = trimmed.match(/^(\S+)\s*->\s*(\S+)(.*)$/);
    if (!m || m[1] !== from || m[2] !== to) continue;

    const rest = m[3].trim();
    let lineEvent = null, lineGuard = null, lineAction = null, lineKind = null;
    if (rest.startsWith(':')) {
      let detail = rest.slice(1).trim();
      const km = detail.match(/@(local|external|internal)\s*$/);
      if (km) {
        lineKind = km[1];
        detail = detail.slice(0, detail.lastIndexOf('@' + lineKind)).trim();
      }
      const slashIdx = detail.indexOf('/');
      if (slashIdx !== -1) {
        lineAction = detail.slice(slashIdx + 1).trim() || null;
        detail = detail.slice(0, slashIdx).trim();
      }
      const gm = detail.match(/\[([^\]]*)\]/);
      if (gm) {
        lineGuard = gm[1].trim() || null;
        detail = detail.slice(0, detail.indexOf('[')).trim();
      }
      lineEvent = detail || null;
    }

    // Match by event and guard
    const eMatch = (event == null || event === '') ? (lineEvent == null || lineEvent === '') : lineEvent === event;
    const gMatch = (guard == null || guard === '') ? (lineGuard == null || lineGuard === '') : lineGuard === guard;
    if (!eMatch || !gMatch) continue;

    // Apply the field update
    if (field === 'guard') lineGuard = val;
    else if (field === 'action') lineAction = val;
    else if (field === 'kind') lineKind = val;
    else continue;

    // Determine default kind
    let defaultKind = 'local';
    const cfgM = dsl.match(/^@config\s+transition=(\S+)/m);
    if (cfgM) defaultKind = cfgM[1];

    // Rebuild the line
    let rebuilt = `${from} -> ${to}`;
    const hasEvent = lineEvent != null && lineEvent !== '';
    const hasGuard = lineGuard != null && lineGuard !== '';
    const hasAction = lineAction != null && lineAction !== '';
    const hasKind = lineKind != null && lineKind !== '' && lineKind !== defaultKind;

    if (hasEvent || hasGuard || hasAction || hasKind) {
      rebuilt += ' :';
      if (hasEvent) rebuilt += ` ${lineEvent}`;
      if (hasGuard) rebuilt += ` [${lineGuard}]`;
      if (hasAction) rebuilt += ` / ${lineAction}`;
      if (hasKind) rebuilt += ` @${lineKind}`;
    }

    // Preserve leading whitespace
    const leadingWs = lines[i].match(/^(\s*)/)[1];
    lines[i] = leadingWs + rebuilt;
    break;
  }
  return lines.join('\n');
}

// ═══════════════════════════════════════════════
// Error Bar Display
// ═══════════════════════════════════════════════
function updateErrorBar(result) {
  const bar = document.getElementById('error-bar');
  if (!result || result.errors.length === 0) {
    bar.style.display = 'none';
    bar.innerHTML = '';
    return;
  }
  bar.style.display = 'block';
  bar.innerHTML = result.errors
    .map(e => '<div>L' + e.line + ': ' + e.msg.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>')
    .join('');
}

// ═══════════════════════════════════════════════
// HTML Escape Helper
// ═══════════════════════════════════════════════
function esc(s) {
  return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '';
}

// ═══════════════════════════════════════════════
// Coordinate Helper — absolute pixel position
// ═══════════════════════════════════════════════
function getAbsolutePos(element, parsed) {
  let ox = 0, oy = 0;
  let pid = element.parent;
  while (pid) {
    const p = parsed.stateMap[pid];
    if (p) { ox += p.x; oy += p.y; pid = p.parent; }
    else break;
  }
  return { x: (element.x + ox) * parsed.canvas.grid, y: (element.y + oy) * parsed.canvas.grid };
}

// ═══════════════════════════════════════════════
// SVG Renderer
// ═══════════════════════════════════════════════
function renderSVG(parsed) {
  if (!parsed) return '';
  const { canvas } = parsed;
  const g = canvas.grid;
  const hlIds = highlight ? getConnectedIds() : null;
  const sans = "'IBM Plex Sans','Noto Sans JP',sans-serif";
  const mono = "'IBM Plex Mono',monospace";
  const shadow = 'filter="drop-shadow(2px 2px 4px rgba(0,0,0,0.4))"';

  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${canvas.width*zoom}" height="${canvas.height*zoom}" viewBox="0 0 ${canvas.width} ${canvas.height}">`;

  // ─── 1. Grid pattern ───
  svg += `<defs>`;
  svg += `<pattern id="gridPat" width="${g}" height="${g}" patternUnits="userSpaceOnUse">`;
  svg += `<circle cx="${g/2}" cy="${g/2}" r="0.8" fill="#2a2a4a"/></pattern>`;
  svg += `</defs>`;
  svg += `<rect width="${canvas.width}" height="${canvas.height}" fill="#1a1a2e"/>`;
  svg += `<rect width="${canvas.width}" height="${canvas.height}" fill="url(#gridPat)"/>`;

  // ─── 2. Groups ───
  for (const grp of parsed.groups) {
    const px = grp.x * g;
    const py = grp.y * g;
    const pw = grp.w * g;
    const ph = grp.h * g;
    const fill = grp.color || '#1a1a3e';
    const border = grp.borderColor || '#3a3a5a';
    const textClr = grp.textColor || '#888888';
    const dimGrpSearch = searchMatchIds && !searchMatchIds.has(grp.id) ? 0.2 : null;
    const dimGrpHl = hlIds && !hlIds.has(grp.id) ? 0.15 : null;
    const dimGrpVal = dimGrpSearch || dimGrpHl;
    const dimGrp = dimGrpVal ? ` opacity="${dimGrpVal}"` : '';
    const grpShadow = isSelected(grp.id) ? 'filter="drop-shadow(0 4px 12px rgba(99,102,241,0.5))"' : '';
    svg += `<g data-type="group" data-id="${grp.id}" style="cursor:${annotationMode?'default':'grab'}"${dimGrp}>`;
    svg += `<rect x="${px}" y="${py}" width="${pw}" height="${ph}" rx="6" ry="6" fill="${esc(fill)}" fill-opacity="0.3" stroke="${esc(border)}" stroke-width="1" ${grpShadow}/>`;
    svg += `<text x="${px + 10}" y="${py + 16}" font-family="${sans}" font-size="11" font-weight="600" fill="${esc(textClr)}" style="pointer-events:none">${esc(grp.label)}</text>`;
    svg += `</g>`;
  }

  // ─── 3. Composite states (states with children) ───
  for (const st of parsed.states.filter(s => s.children.length > 0)) {
    const pos = getAbsolutePos(st, parsed);
    const pw = st.w * g;
    const ph = st.h * g;
    const fill = st.color || 'rgba(99,102,241,0.08)';
    const border = st.borderColor || '#6366F1';
    const textClr = st.textColor || '#e0e0e0';
    const round = st.round != null ? st.round : 10;
    const elSel = isSelected(st.id);
    const strokeClr = elSel ? 'white' : border;
    const strokeW = elSel ? 2.5 : 1.5;
    const dashAttr = st.style === 'dashed' ? ' stroke-dasharray="6 3"' : '';
    const dimStSearch = searchMatchIds && !searchMatchIds.has(st.id) ? 0.2 : null;
    const dimStHl = hlIds && !hlIds.has(st.id) ? 0.15 : null;
    const dimStVal = dimStSearch || dimStHl;
    const dimSt = dimStVal ? ` opacity="${dimStVal}"` : '';
    const stShadow = elSel ? 'filter="drop-shadow(0 4px 12px rgba(99,102,241,0.5))"' : shadow;

    svg += `<g data-type="state" data-id="${st.id}" style="cursor:${annotationMode?'default':'grab'}"${dimSt}>`;
    svg += `<rect x="${pos.x}" y="${pos.y}" width="${pw}" height="${ph}" rx="${round}" ry="${round}" fill="${esc(fill)}" stroke="${esc(strokeClr)}" stroke-width="${strokeW}"${dashAttr} ${stShadow}/>`;
    svg += `<text x="${pos.x + 10}" y="${pos.y + 18}" font-family="${sans}" font-size="12" font-weight="600" fill="${esc(textClr)}" style="pointer-events:none">${esc(st.label)}</text>`;

    // If showActions and composite has actions, render them below label
    if (showActions && (st.entry || st.do || st.exit)) {
      let ay = pos.y + 32;
      if (st.entry) {
        svg += `<text x="${pos.x + 10}" y="${ay}" font-family="${mono}" font-size="10" fill="#888888" style="pointer-events:none">entry / ${esc(st.entry)}</text>`;
        ay += 14;
      }
      if (st.do) {
        svg += `<text x="${pos.x + 10}" y="${ay}" font-family="${mono}" font-size="10" fill="#888888" style="pointer-events:none">do / ${esc(st.do)}</text>`;
        ay += 14;
      }
      if (st.exit) {
        svg += `<text x="${pos.x + 10}" y="${ay}" font-family="${mono}" font-size="10" fill="#888888" style="pointer-events:none">exit / ${esc(st.exit)}</text>`;
      }
    }
    // Region separators (dashed horizontal lines between orthogonal regions)
    const stRegions = parsed.regions.filter(r => r.parent === st.id);
    if (stRegions.length > 1) {
      const regionH = ph / stRegions.length;
      for (let ri = 1; ri < stRegions.length; ri++) {
        const sepY = pos.y + regionH * ri;
        svg += `<line x1="${pos.x + 4}" y1="${sepY}" x2="${pos.x + pw - 4}" y2="${sepY}" stroke="${esc(border)}" stroke-width="1" stroke-dasharray="8,4" opacity="0.6"/>`;
      }
      // Region labels
      for (let ri = 0; ri < stRegions.length; ri++) {
        const ry = pos.y + regionH * ri + 14;
        svg += `<text x="${pos.x + pw - 6}" y="${ry}" text-anchor="end" font-family="${sans}" font-size="9" font-style="italic" fill="${esc(border)}" opacity="0.7" style="pointer-events:none">${esc(stRegions[ri].label)}</text>`;
      }
    }
    svg += `</g>`;
  }

  // ─── 4. Leaf states (states without children) ───
  for (const st of parsed.states.filter(s => s.children.length === 0)) {
    const pos = getAbsolutePos(st, parsed);
    const pw = st.w * g;
    const ph = st.h * g;
    const fill = st.color || '#1e293b';
    const border = st.borderColor || '#818CF8';
    const textClr = st.textColor || '#e0e0e0';
    const round = st.round != null ? st.round : 10;
    const elSel = isSelected(st.id);
    const strokeClr = elSel ? 'white' : border;
    const strokeW = elSel ? 2.5 : 1.5;
    const dashAttr = st.style === 'dashed' ? ' stroke-dasharray="6 3"' : '';
    const hasActions = showActions && (st.entry || st.do || st.exit);
    const dimStSearch = searchMatchIds && !searchMatchIds.has(st.id) ? 0.2 : null;
    const dimStHl = hlIds && !hlIds.has(st.id) ? 0.15 : null;
    const dimStVal = dimStSearch || dimStHl;
    const dimSt = dimStVal ? ` opacity="${dimStVal}"` : '';
    const stShadow = elSel ? 'filter="drop-shadow(0 4px 12px rgba(99,102,241,0.5))"' : shadow;

    svg += `<g data-type="state" data-id="${st.id}" style="cursor:${annotationMode?'default':'grab'}"${dimSt}>`;
    svg += `<rect x="${pos.x}" y="${pos.y}" width="${pw}" height="${ph}" rx="${round}" ry="${round}" fill="${esc(fill)}" stroke="${esc(strokeClr)}" stroke-width="${strokeW}"${dashAttr} ${stShadow}/>`;

    if (hasActions) {
      // Label at top
      svg += `<text x="${pos.x + pw/2}" y="${pos.y + 20}" text-anchor="middle" font-family="${sans}" font-size="13" font-weight="600" fill="${esc(textClr)}" style="pointer-events:none">${esc(st.label)}</text>`;
      // Separator line
      const sepY = pos.y + 28;
      svg += `<line x1="${pos.x + 4}" y1="${sepY}" x2="${pos.x + pw - 4}" y2="${sepY}" stroke="${esc(border)}" stroke-width="0.5" opacity="0.5"/>`;
      // Action text
      let ay = sepY + 16;
      if (st.entry) {
        svg += `<text x="${pos.x + 8}" y="${ay}" font-family="${mono}" font-size="10" fill="#888888" style="pointer-events:none">entry / ${esc(st.entry)}</text>`;
        ay += 14;
      }
      if (st.do) {
        svg += `<text x="${pos.x + 8}" y="${ay}" font-family="${mono}" font-size="10" fill="#888888" style="pointer-events:none">do / ${esc(st.do)}</text>`;
        ay += 14;
      }
      if (st.exit) {
        svg += `<text x="${pos.x + 8}" y="${ay}" font-family="${mono}" font-size="10" fill="#888888" style="pointer-events:none">exit / ${esc(st.exit)}</text>`;
      }
    } else {
      // Centered label only
      svg += `<text x="${pos.x + pw/2}" y="${pos.y + ph/2 + 5}" text-anchor="middle" font-family="${sans}" font-size="13" font-weight="600" fill="${esc(textClr)}" style="pointer-events:none">${esc(st.label)}</text>`;
    }
    svg += `</g>`;
  }

  // ─── 5. Pseudo-states ───
  for (const ps of parsed.pseudoStates) {
    const pos = getAbsolutePos(ps, parsed);
    const dimPsSearch = searchMatchIds && !searchMatchIds.has(ps.id) ? 0.2 : null;
    const dimPsHl = hlIds && !hlIds.has(ps.id) ? 0.15 : null;
    const dimPsVal = dimPsSearch || dimPsHl;
    const dimPs = dimPsVal ? ` opacity="${dimPsVal}"` : '';
    const psSel = isSelected(ps.id);
    const psShadow = psSel ? 'filter="drop-shadow(0 4px 12px rgba(99,102,241,0.5))"' : shadow;
    svg += `<g data-type="${ps.type}" data-id="${ps.id}" style="cursor:grab"${dimPs}>`;

    // Selection highlight ring
    if (psSel) {
      const selR = ps.type === 'initial' ? 14 : ps.type === 'final' ? 16 : 20;
      svg += `<circle cx="${pos.x}" cy="${pos.y}" r="${selR}" fill="none" stroke="white" stroke-width="2" stroke-dasharray="4,2"/>`;
    }

    switch (ps.type) {
      case 'initial': {
        svg += `<circle cx="${pos.x}" cy="${pos.y}" r="10" fill="#e0e0e0" ${psShadow}/>`;
        break;
      }
      case 'final': {
        svg += `<circle cx="${pos.x}" cy="${pos.y}" r="12" fill="none" stroke="#e0e0e0" stroke-width="2" ${psShadow}/>`;
        svg += `<circle cx="${pos.x}" cy="${pos.y}" r="7" fill="#e0e0e0"/>`;
        break;
      }
      case 'choice': {
        const cx = pos.x;
        const cy = pos.y;
        svg += `<polygon points="${cx},${cy-10} ${cx+10},${cy} ${cx},${cy+10} ${cx-10},${cy}" fill="#1e293b" stroke="${psSel ? 'white' : '#818CF8'}" stroke-width="${psSel ? 2.5 : 1.5}" ${psShadow}/>`;
        break;
      }
      case 'history': {
        svg += `<circle cx="${pos.x}" cy="${pos.y}" r="16" fill="#1e293b" stroke="${psSel ? 'white' : '#818CF8'}" stroke-width="${psSel ? 2.5 : 1.5}" ${psShadow}/>`;
        svg += `<text x="${pos.x}" y="${pos.y + 5}" text-anchor="middle" font-family="${sans}" font-size="14" font-weight="700" fill="#e0e0e0" style="pointer-events:none">H</text>`;
        break;
      }
      case 'deephistory': {
        svg += `<circle cx="${pos.x}" cy="${pos.y}" r="16" fill="#1e293b" stroke="${psSel ? 'white' : '#818CF8'}" stroke-width="${psSel ? 2.5 : 1.5}" ${psShadow}/>`;
        svg += `<text x="${pos.x}" y="${pos.y + 5}" text-anchor="middle" font-family="${sans}" font-size="14" font-weight="700" fill="#e0e0e0" style="pointer-events:none">H*</text>`;
        break;
      }
      case 'fork':
      case 'join': {
        const pw = ps.w != null ? ps.w * g : 6;
        const ph = ps.h != null ? ps.h * g : 40;
        svg += `<rect x="${pos.x - pw/2}" y="${pos.y - ph/2}" width="${pw}" height="${ph}" rx="2" ry="2" fill="${psSel ? 'white' : '#e0e0e0'}" ${psShadow}/>`;
        break;
      }
    }
    svg += `</g>`;
  }


  // ─── 6. Transitions ───
  // Arrow markers: one per unique transition color
  const _arrowColors = new Set();
  for (const tr of parsed.transitions) _arrowColors.add(tr.color || '#89DDFF');
  svg += `<defs>`;
  for (const c of _arrowColors) {
    const mid = 'ah_' + c.replace(/[^a-zA-Z0-9]/g, '');
    svg += `<marker id="${mid}" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="${c}"/></marker>`;
  }
  svg += `</defs>`;

  // Helper: get bounding box {x, y, w, h} in pixels for a state or pseudo-state
  function getBox(ref) {
    const el = resolveStateRef(ref, parsed);
    if (!el) return null;
    const pos = getAbsolutePos(el, parsed);
    if (el.type === 'state') {
      return { x: pos.x, y: pos.y, w: el.w * g, h: el.h * g };
    }
    // Pseudo-states
    switch (el.type) {
      case 'initial':
        return { x: pos.x - 10, y: pos.y - 10, w: 20, h: 20 };
      case 'final':
        return { x: pos.x - 12, y: pos.y - 12, w: 24, h: 24 };
      case 'choice':
        return { x: pos.x - 12, y: pos.y - 12, w: 24, h: 24 };
      case 'history':
      case 'deephistory':
        return { x: pos.x - 16, y: pos.y - 16, w: 32, h: 32 };
      case 'fork':
      case 'join': {
        const pw = el.w != null ? el.w * g : 6;
        const ph = el.h != null ? el.h * g : 40;
        return { x: pos.x - pw / 2, y: pos.y - ph / 2, w: pw, h: ph };
      }
      default:
        return { x: pos.x - 10, y: pos.y - 10, w: 20, h: 20 };
    }
  }

  // Helper: determine which side of source/target to connect
  // ADR-006: Edge-gap algorithm instead of angle-based
  function computePortSide(srcBox, tgtBox) {
    // Containment detection: parent-child transitions use same-side (U-shape) routing
    const srcContainsTgt = srcBox.x <= tgtBox.x && srcBox.y <= tgtBox.y &&
      srcBox.x + srcBox.w >= tgtBox.x + tgtBox.w && srcBox.y + srcBox.h >= tgtBox.y + tgtBox.h;
    const tgtContainsSrc = tgtBox.x <= srcBox.x && tgtBox.y <= srcBox.y &&
      tgtBox.x + tgtBox.w >= srcBox.x + srcBox.w && tgtBox.y + tgtBox.h >= srcBox.y + srcBox.h;

    if (srcContainsTgt) {
      const dTop = tgtBox.y - srcBox.y;
      const dBottom = (srcBox.y + srcBox.h) - (tgtBox.y + tgtBox.h);
      const dLeft = tgtBox.x - srcBox.x;
      const dRight = (srcBox.x + srcBox.w) - (tgtBox.x + tgtBox.w);
      const minD = Math.min(dTop, dBottom, dLeft, dRight);
      if (minD === dTop) return { srcSide: 'top', tgtSide: 'top' };
      if (minD === dBottom) return { srcSide: 'bottom', tgtSide: 'bottom' };
      if (minD === dLeft) return { srcSide: 'left', tgtSide: 'left' };
      return { srcSide: 'right', tgtSide: 'right' };
    }
    if (tgtContainsSrc) {
      const dTop = srcBox.y - tgtBox.y;
      const dBottom = (tgtBox.y + tgtBox.h) - (srcBox.y + srcBox.h);
      const dLeft = srcBox.x - tgtBox.x;
      const dRight = (tgtBox.x + tgtBox.w) - (srcBox.x + srcBox.w);
      const minD = Math.min(dTop, dBottom, dLeft, dRight);
      if (minD === dTop) return { srcSide: 'top', tgtSide: 'top' };
      if (minD === dBottom) return { srcSide: 'bottom', tgtSide: 'bottom' };
      if (minD === dLeft) return { srcSide: 'left', tgtSide: 'left' };
      return { srcSide: 'right', tgtSide: 'right' };
    }

    // Non-overlapping boxes: use gap-based algorithm
    const gapR = tgtBox.x - (srcBox.x + srcBox.w);
    const gapL = srcBox.x - (tgtBox.x + tgtBox.w);
    const gapB = tgtBox.y - (srcBox.y + srcBox.h);
    const gapT = srcBox.y - (tgtBox.y + tgtBox.h);
    const hBest = Math.max(gapR, gapL);
    const vBest = Math.max(gapB, gapT);
    if (vBest >= hBest) {
      return gapB >= gapT
        ? { srcSide: 'bottom', tgtSide: 'top' }
        : { srcSide: 'top', tgtSide: 'bottom' };
    } else {
      return gapR >= gapL
        ? { srcSide: 'right', tgtSide: 'left' }
        : { srcSide: 'left', tgtSide: 'right' };
    }
  }

  // Helper: get port point on a box edge, distributed for multiple ports
  function getPortPoint(box, side, portIndex, portCount) {
    const pad = portCount <= 2 ? 0.4 : portCount <= 4 ? 0.25 : 0.15;
    const t = portCount <= 1 ? 0.5 : pad + (1 - 2 * pad) * portIndex / (portCount - 1);
    switch (side) {
      case 'top': return { x: box.x + box.w * t, y: box.y };
      case 'bottom': return { x: box.x + box.w * t, y: box.y + box.h };
      case 'left': return { x: box.x, y: box.y + box.h * t };
      case 'right': return { x: box.x + box.w, y: box.y + box.h * t };
    }
    return { x: box.x + box.w / 2, y: box.y + box.h / 2 };
  }

  // Helper: build orthogonal route between two points
  // channelOffset: pixel offset for the intermediate channel to avoid overlap
  //   when multiple transitions share the same routing corridor
  function buildRoute(fromPt, toPt, fromSide, toSide, channelOffset, routeIndex) {
    const points = [fromPt];
    const margin = 20;
    const co = channelOffset || 0; // channel offset in pixels
    const ri = (routeIndex || 0) * 30; // extra spread per route for U-shape legs (30px ≈ multi-line label height)

    // same-axis opposite sides
    if (fromSide === 'right' && toSide === 'left') {
      if (Math.abs(fromPt.y - toPt.y) < 2 && Math.abs(co) < 1) {
        points.push(toPt);
      } else {
        const midX = (fromPt.x + toPt.x) / 2 + co;
        points.push({ x: midX, y: fromPt.y });
        points.push({ x: midX, y: toPt.y });
        points.push(toPt);
      }
    } else if (fromSide === 'left' && toSide === 'right') {
      if (Math.abs(fromPt.y - toPt.y) < 2 && Math.abs(co) < 1) {
        points.push(toPt);
      } else {
        const midX = (fromPt.x + toPt.x) / 2 + co;
        points.push({ x: midX, y: fromPt.y });
        points.push({ x: midX, y: toPt.y });
        points.push(toPt);
      }
    } else if (fromSide === 'bottom' && toSide === 'top') {
      if (Math.abs(fromPt.x - toPt.x) < 2 && Math.abs(co) < 1) {
        points.push(toPt);
      } else {
        const midY = (fromPt.y + toPt.y) / 2 + co;
        points.push({ x: fromPt.x, y: midY });
        points.push({ x: toPt.x, y: midY });
        points.push(toPt);
      }
    } else if (fromSide === 'top' && toSide === 'bottom') {
      if (Math.abs(fromPt.x - toPt.x) < 2 && Math.abs(co) < 1) {
        points.push(toPt);
      } else {
        const midY = (fromPt.y + toPt.y) / 2 + co;
        points.push({ x: fromPt.x, y: midY });
        points.push({ x: toPt.x, y: midY });
        points.push(toPt);
      }
    }
    // same sides — U-shape (ri spreads legs for multiple routes)
    else if (fromSide === 'right' && toSide === 'right') {
      const outX = Math.max(fromPt.x, toPt.x) + margin + ri;
      points.push({ x: outX, y: fromPt.y });
      points.push({ x: outX, y: toPt.y });
      points.push(toPt);
    } else if (fromSide === 'left' && toSide === 'left') {
      const outX = Math.min(fromPt.x, toPt.x) - margin - ri;
      points.push({ x: outX, y: fromPt.y });
      points.push({ x: outX, y: toPt.y });
      points.push(toPt);
    } else if (fromSide === 'top' && toSide === 'top') {
      const outY = Math.min(fromPt.y, toPt.y) - margin - ri;
      points.push({ x: fromPt.x, y: outY });
      points.push({ x: toPt.x, y: outY });
      points.push(toPt);
    } else if (fromSide === 'bottom' && toSide === 'bottom') {
      const outY = Math.max(fromPt.y, toPt.y) + margin + ri;
      points.push({ x: fromPt.x, y: outY });
      points.push({ x: toPt.x, y: outY });
      points.push(toPt);
    }
    // adjacent sides — L-shape (offset applied to the corner point)
    else if (fromSide === 'right' && toSide === 'top') {
      points.push({ x: toPt.x + co, y: fromPt.y });
      points.push({ x: toPt.x + co, y: toPt.y });
      points.push(toPt);
    } else if (fromSide === 'right' && toSide === 'bottom') {
      points.push({ x: toPt.x + co, y: fromPt.y });
      points.push({ x: toPt.x + co, y: toPt.y });
      points.push(toPt);
    } else if (fromSide === 'left' && toSide === 'top') {
      points.push({ x: toPt.x + co, y: fromPt.y });
      points.push({ x: toPt.x + co, y: toPt.y });
      points.push(toPt);
    } else if (fromSide === 'left' && toSide === 'bottom') {
      points.push({ x: toPt.x + co, y: fromPt.y });
      points.push({ x: toPt.x + co, y: toPt.y });
      points.push(toPt);
    } else if (fromSide === 'top' && toSide === 'right') {
      points.push({ x: fromPt.x, y: toPt.y + co });
      points.push({ x: toPt.x, y: toPt.y + co });
      points.push(toPt);
    } else if (fromSide === 'top' && toSide === 'left') {
      points.push({ x: fromPt.x, y: toPt.y + co });
      points.push({ x: toPt.x, y: toPt.y + co });
      points.push(toPt);
    } else if (fromSide === 'bottom' && toSide === 'right') {
      points.push({ x: fromPt.x, y: toPt.y + co });
      points.push({ x: toPt.x, y: toPt.y + co });
      points.push(toPt);
    } else if (fromSide === 'bottom' && toSide === 'left') {
      points.push({ x: fromPt.x, y: toPt.y + co });
      points.push({ x: toPt.x, y: toPt.y + co });
      points.push(toPt);
    } else {
      // fallback: simple L
      points.push({ x: toPt.x + co, y: fromPt.y });
      points.push({ x: toPt.x + co, y: toPt.y });
      points.push(toPt);
    }
    return points;
  }

  // Helper: build self-transition loop
  function buildSelfRoute(box) {
    const margin = 30;
    return [
      { x: box.x + box.w, y: box.y + box.h / 2 },
      { x: box.x + box.w + margin, y: box.y + box.h / 2 },
      { x: box.x + box.w + margin, y: box.y - margin },
      { x: box.x + box.w / 2, y: box.y - margin },
      { x: box.x + box.w / 2, y: box.y }
    ];
  }

  // Helper: segment intersection
  function segmentIntersection(a1, a2, b1, b2) {
    const d1x = a2.x - a1.x, d1y = a2.y - a1.y;
    const d2x = b2.x - b1.x, d2y = b2.y - b1.y;
    const cross = d1x * d2y - d1y * d2x;
    if (Math.abs(cross) < 0.001) return null;
    const t = ((b1.x - a1.x) * d2y - (b1.y - a1.y) * d2x) / cross;
    const u = ((b1.x - a1.x) * d1y - (b1.y - a1.y) * d1x) / cross;
    if (t >= 0.01 && t <= 0.99 && u >= 0.01 && u <= 0.99) {
      return { x: a1.x + t * d1x, y: a1.y + t * d1y };
    }
    return null;
  }

  // Helper: find midpoint along a polyline route
  function routeMidpoint(points) {
    let totalLen = 0;
    for (let i = 1; i < points.length; i++)
      totalLen += Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
    let target = totalLen / 2, acc = 0;
    for (let i = 1; i < points.length; i++) {
      const segLen = Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
      if (acc + segLen >= target) {
        const t = segLen > 0 ? (target - acc) / segLen : 0;
        return {
          x: points[i - 1].x + t * (points[i].x - points[i - 1].x),
          y: points[i - 1].y + t * (points[i].y - points[i - 1].y)
        };
      }
      acc += segLen;
    }
    return points[Math.floor(points.length / 2)];
  }

  // Collect all polyline routes for crossing detection
  const allRoutes = [];

  // Pre-compute port distribution
  // UNIFIED edge groups: merge incoming and outgoing transitions on the same edge
  // so they share the same port space and don't overlap at the connection point.
  const edgeGroups = {}; // key: "stateId:side" -> [{ti, dir:'src'|'tgt'}]
  const transitionSides = []; // per-transition: {srcSide, tgtSide, srcBox, tgtBox, isSelf, isReverse}

  // Build bidirectional pair lookup: detect A→B / B→A pairs
  const pairKey = (a, b) => [a, b].sort().join('\u2194');
  const pairMap = {}; // pairKey → [ti, ...]
  for (let ti = 0; ti < parsed.transitions.length; ti++) {
    const tr = parsed.transitions[ti];
    const pk = pairKey(tr.from, tr.to);
    if (!pairMap[pk]) pairMap[pk] = [];
    pairMap[pk].push(ti);
  }
  // Mark reverse-direction transitions for alternate routing.
  // For each state pair, find the "forward" direction (first encountered),
  // then mark ALL transitions in the opposite direction as reverse.
  const reverseSet = new Set();
  for (const pk of Object.keys(pairMap)) {
    const indices = pairMap[pk];
    if (indices.length < 2) continue;
    // Determine forward direction from first transition
    const t0 = parsed.transitions[indices[0]];
    const fwdFrom = t0.from, fwdTo = t0.to;
    for (let i = 1; i < indices.length; i++) {
      const ti2 = parsed.transitions[indices[i]];
      // Opposite direction → reverse
      if (ti2.from === fwdTo && ti2.to === fwdFrom) {
        reverseSet.add(indices[i]);
      }
    }
  }

  // First pass: compute sides for all transitions and build unified edge groups
  for (let ti = 0; ti < parsed.transitions.length; ti++) {
    const tr = parsed.transitions[ti];
    // Skip @internal transitions — they have no visual representation in diagram
    if (tr.kind === 'internal') { transitionSides.push(null); continue; }
    const srcBox = getBox(tr.from);
    const tgtBox = getBox(tr.to);
    if (!srcBox || !tgtBox) {
      transitionSides.push(null);
      continue;
    }
    const isSelf = tr.from === tr.to;
    const isReverse = reverseSet.has(ti);
    let srcSide, tgtSide;
    if (isSelf) {
      srcSide = 'right';
      tgtSide = 'top';
    } else if (isReverse) {
      const fwdSides = computePortSide(srcBox, tgtBox);
      if (fwdSides.srcSide === 'right' || fwdSides.srcSide === 'left') {
        srcSide = 'bottom';
