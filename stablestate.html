  return { sx: parsed.canvas.width / r.width, sy: parsed.canvas.height / r.height };
}

// ═══════════════════════════════════════════════
// Snap Guide Computation
// ═══════════════════════════════════════════════
// ADR-011: Select only the nearest snap candidate per axis to prevent jitter
function computeSnapGuides(dragItems) {
  if (!parsed) return [];
  const g = parsed.canvas.grid;
  const threshold = 0.5 * g;

  const dragIds = new Set(dragItems.map(it => it.id));
  const otherEdges = { x: [], y: [] };

  for (const st of parsed.states) {
    if (dragIds.has(st.id)) continue;
    const abs = getAbsolutePos(st, parsed);
    otherEdges.x.push(abs.x, abs.x + st.w * g);
    otherEdges.y.push(abs.y, abs.y + st.h * g);
  }
  for (const grp of parsed.groups) {
    if (dragIds.has(grp.id)) continue;
    otherEdges.x.push(grp.x * g, (grp.x + grp.w) * g);
    otherEdges.y.push(grp.y * g, (grp.y + grp.h) * g);
  }

  let bestX = null, bestXDist = Infinity;
  let bestY = null, bestYDist = Infinity;

  for (const item of dragItems) {
    const el = parsed.stateMap[item.id] || parsed.groupMap[item.id] || parsed.noteMap[item.id];
    if (!el || el.w == null) continue;
    const abs = getAbsolutePos(el, parsed);
    const edges = {
      x: [abs.x, abs.x + el.w * g],
      y: [abs.y, abs.y + el.h * g]
    };
    for (const ex of edges.x) {
      for (const ox of otherEdges.x) {
        const dist = Math.abs(ex - ox);
        if (dist < threshold && dist < bestXDist) {
          bestXDist = dist;
          bestX = ox;
        }
      }
    }
    for (const ey of edges.y) {
      for (const oy of otherEdges.y) {
        const dist = Math.abs(ey - oy);
        if (dist < threshold && dist < bestYDist) {
          bestYDist = dist;
          bestY = oy;
        }
      }
    }
  }

  const guides = [];
  if (bestX !== null) guides.push({ axis: 'x', pos: bestX });
  if (bestY !== null) guides.push({ axis: 'y', pos: bestY });
  return guides;
}

// ═══════════════════════════════════════════════
// Undo / Redo
// ═══════════════════════════════════════════════
function getDsl() {
  if (isVSCode) return _vscode_dsl;
  return document.getElementById('editor').value;
}

function setDsl(text) {
  if (isVSCode) {
    _vscode_dsl = text;
    if (!_suppressVscodeSync) vscodeApi.postMessage({ type: 'dslUpdate', dsl: text });
  } else {
    document.getElementById('editor').value = text;
  }
}

function pushHistory() {
  undoHistory.push(getDsl());
  if (undoHistory.length > MAX_HISTORY) undoHistory.shift();
  redoFuture = [];
}

function undo() {
  if (!undoHistory.length) return;
  redoFuture.push(getDsl());
  setDsl(undoHistory.pop());
  refresh();
}

function redo() {
  if (!redoFuture.length) return;
  undoHistory.push(getDsl());
  setDsl(redoFuture.pop());
  refresh();
}

// ═══════════════════════════════════════════════
// DOM-based Interaction Setup (StableBlock pattern)
// ═══════════════════════════════════════════════
function setupInteractions() {
  const svgWrap = document.getElementById('svg-wrap');
  if (!svgWrap || !parsed) return;
  const g = parsed.canvas.grid;

  // ─── a) Resize handlers on [data-resize] elements ───
  svgWrap.querySelectorAll('[data-resize]').forEach(function(handle) {
    handle.addEventListener('mousedown', function(e) {
      if (e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      const edge = handle.dataset.resize;
      const rid = handle.dataset.rid;
      const rtype = handle.dataset.rtype;
      const el = parsed.stateMap[rid] || parsed.groupMap[rid] || parsed.noteMap[rid];
      if (!el) return;
      pushHistory();
      const origX = el.x, origY = el.y, origW = el.w, origH = el.h;
      const sc = getSvgScale();
      const startMX = e.clientX, startMY = e.clientY;

      function onMove(ev) {
        const dx = (ev.clientX - startMX) * sc.sx;
        const dy = (ev.clientY - startMY) * sc.sy;
        const dxGrid = Math.round(dx / g);
        const dyGrid = Math.round(dy / g);

        let newX = origX, newY = origY, newW = origW, newH = origH;
        if (edge.includes('w')) { newX = origX + dxGrid; newW = origW - dxGrid; }
        if (edge.includes('e') && !edge.includes('w')) { newW = origW + dxGrid; }
        if (edge.includes('n')) { newY = origY + dyGrid; newH = origH - dyGrid; }
        if (edge.includes('s') && !edge.includes('n')) { newH = origH + dyGrid; }

        newW = Math.max(1, newW);
        newH = Math.max(1, newH);
        if (newW === 1 && edge.includes('w')) newX = origX + origW - 1;
        if (newH === 1 && edge.includes('n')) newY = origY + origH - 1;

        let dsl = getDsl();
        dsl = updatePos(rtype, rid, newX, newY, dsl);
        dsl = updateSize(rtype, rid, newW, newH, dsl);
        setDsl(dsl);
        parsed = parseDSL(getDsl());
        document.getElementById('svg-wrap').innerHTML = renderSVG(parsed);
        setupInteractions();
      }
      function onUp() {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        refresh();
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });

  // ─── b) Drag handlers on g[data-id] elements ───
  svgWrap.querySelectorAll('g[data-id]').forEach(function(gEl) {
    gEl.addEventListener('mousedown', function(e) {
      if (e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      const id = gEl.dataset.id;
      const type = gEl.dataset.type;

      // Annotation mode filter
      if (annotationMode && type !== 'note') return;
      if (!annotationMode && type === 'note') return;

      // Connect mode handling
      if (currentTool === 'connect') {
        if (!connectFrom) {
          connectFrom = id;
          sel = [{type: resolveSelType(id), id: id}];
          document.getElementById('svg-wrap').innerHTML = renderSVG(parsed);
          setupInteractions();
          renderProps();
          updateStatus();
          return;
        } else {
          if (id !== connectFrom) {
            const isPseudo = parsed && (parsed.pseudoMap[connectFrom] || parsed.pseudoMap[id]);
            const evName = isPseudo ? null : prompt('Event name (optional):');
            if (!isPseudo && evName === null) { connectFrom = null; setTool('select'); refresh(); return; }
            pushHistory();
            let dsl = getDsl();
            dsl = addTransition(stateDotPath(connectFrom), stateDotPath(id), evName || null, null, null, null, dsl);
            setDsl(dsl);
          }
          connectFrom = null;
          sel = [];
          setTool('select');
          refresh();
          return;
        }
      }

      // Selection logic
      if (e.shiftKey) {
        if (isSel(id)) {
          sel = sel.filter(s => s.id !== id);
        } else {
          sel.push({type: resolveSelType(id), id: id});
        }
        document.getElementById('svg-wrap').innerHTML = renderSVG(parsed);
        setupInteractions();
        renderProps();
        return;
      }

      if (!isSel(id)) {
        sel = [{type: resolveSelType(id), id: id}];
        document.getElementById('svg-wrap').innerHTML = renderSVG(parsed);
        setupInteractions();
        renderProps();
      }

      // Collect drag set
      pushHistory();
      const dragItems = [];
      for (const si of sel) {
        const el = parsed.stateMap[si.id] || parsed.pseudoMap[si.id] || parsed.groupMap[si.id] || parsed.noteMap[si.id];
        if (!el) continue;
        let elType;
        if (parsed.stateMap[si.id]) elType = 'state';
        else if (parsed.pseudoMap[si.id]) elType = el.type;
        else if (parsed.groupMap[si.id]) elType = 'group';
        else if (parsed.noteMap[si.id]) elType = 'note';
        else elType = 'state';
        dragItems.push({ id: si.id, type: elType, origX: el.x, origY: el.y, parent: el.parent || null, w: el.w, h: el.h });
      }
      // Groups drag contained states
      for (const si of sel) {
        const grp = parsed.groupMap[si.id];
        if (!grp) continue;
        for (const st of parsed.states) {
          const cx = st.x + (st.w || 0) / 2, cy = st.y + (st.h || 0) / 2;
          if (cx >= grp.x && cx <= grp.x + grp.w && cy >= grp.y && cy <= grp.y + grp.h) {
            if (!dragItems.some(it => it.id === st.id)) {
              dragItems.push({ id: st.id, type: 'state', origX: st.x, origY: st.y, parent: st.parent, w: st.w, h: st.h });
            }
          }
        }
      }
      // NOTE: Composite state children use RELATIVE coordinates,
      // so they move automatically when the parent moves — do NOT add them to dragItems.

      const sc = getSvgScale();
      const startMX = e.clientX, startMY = e.clientY;
      let lastDxGrid = 0, lastDyGrid = 0;
      let moved = false;

      function onMove(ev) {
        const dx = (ev.clientX - startMX) * sc.sx;
        const dy = (ev.clientY - startMY) * sc.sy;
        const isPseudo = dragItems.length === 1 && parsed.pseudoMap[dragItems[0].id];
        const snapUnit = isPseudo ? g / 2 : g;
        const dxGrid = Math.round(dx / snapUnit) * (isPseudo ? 0.5 : 1);
        const dyGrid = Math.round(dy / snapUnit) * (isPseudo ? 0.5 : 1);
        if (dxGrid === lastDxGrid && dyGrid === lastDyGrid) return;
        lastDxGrid = dxGrid;
        lastDyGrid = dyGrid;
        moved = true;

        let dsl = getDsl();
        for (const item of dragItems) {
          const elType = item.type === 'state' ? 'state' :
                         item.type === 'group' ? 'group' :
                         item.type === 'note' ? 'note' : item.type;
          if (item.parent) {
            const parentSt = parsed.stateMap[item.parent];
            if (parentSt) {
              const newX = Math.max(0, Math.min(parentSt.w - (item.w || 1), item.origX + dxGrid));
              const newY = Math.max(0, Math.min(parentSt.h - (item.h || 1), item.origY + dyGrid));
              dsl = updatePos(elType, item.id, newX, newY, dsl);
            } else {
              dsl = updatePos(elType, item.id, item.origX + dxGrid, item.origY + dyGrid, dsl);
            }
          } else {
            const newX = Math.max(0, item.origX + dxGrid);
            const newY = Math.max(0, item.origY + dyGrid);
            dsl = updatePos(elType, item.id, newX, newY, dsl);
          }
        }
        setDsl(dsl);
        parsed = parseDSL(getDsl());
        snapGuides = computeSnapGuides(dragItems);
        document.getElementById('svg-wrap').innerHTML = renderSVG(parsed);
        setupInteractions();
      }

      function onUp() {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        if (!moved) {
          undoHistory.pop(); // nothing changed, pop the history
        }
        snapGuides = [];
        refresh();
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });

  // ─── c) Blank click deselect on SVG element ───
  const svgEl = svgWrap.querySelector('svg');
  if (svgEl) {
    svgEl.addEventListener('mousedown', function(e) {
      if (e.button !== 0) return;
      // Only trigger if clicked directly on svg or a background rect not inside g[data-id]
      const target = e.target;
      if (target.closest('g[data-id]') || target.closest('[data-resize]')) return;

      // Cancel connect mode if active
      if (currentTool === 'connect') {
        connectFrom = null;
        setTool('select');
      }

      sel = [];
      snapGuides = [];
      refresh();
    });
  }
}

// ═══════════════════════════════════════════════
// Zoom (mouse wheel on SVG area — attached ONCE)
// ═══════════════════════════════════════════════
document.getElementById('svg-wrap').addEventListener('wheel', function(e) {
  e.preventDefault();
  setZoom(e.deltaY > 0 ? -1 : 1);
}, { passive: false });

// ═══════════════════════════════════════════════
// Connect Selected
// ═══════════════════════════════════════════════
function connectSelected() {
  if (sel.length !== 2) return;
  const a = stateDotPath(sel[0].id);
  const b = stateDotPath(sel[1].id);
  const isPseudo = parsed && (parsed.pseudoMap[sel[0].id] || parsed.pseudoMap[sel[1].id]);
  const event = isPseudo ? null : prompt('Event name (optional):');
  if (!isPseudo && event === null) return;
  pushHistory();
  let dsl = getDsl();
  dsl = addTransition(a, b, event || null, null, null, null, dsl);
  setDsl(dsl);
  refresh();
}

// ═══════════════════════════════════════════════
// Delete Selected
// ═══════════════════════════════════════════════
function removeDSLElement(id, dsl) {
  const lines = dsl.split('\n');
  const result = [];
  let skipNesting = 0;
  for (const line of lines) {
    const trimmed = line.trim();
    // Check if this line defines the element
    if (trimmed.match(new RegExp(`^(state|group|note|initial|final|choice|history|deephistory|fork|join)\\s+${id}\\b`))) {
      if (trimmed.endsWith('{')) skipNesting = 1;
      continue; // skip this line
    }
    if (skipNesting > 0) {
      if (trimmed === '}' || trimmed.startsWith('}')) {
        skipNesting--;
        if (skipNesting === 0) continue;
      }
      if (trimmed.endsWith('{')) skipNesting++;
      continue;
    }
    // Remove transitions referencing this ID (as source or target)
    if (trimmed.match(new RegExp(`^${id}\\s*->`)) || trimmed.match(new RegExp(`->\\s*${id}(\\s|$)`))) {
      continue;
    }
    // Also handle dot-path references like parent.id or id.child
    if (trimmed.match(new RegExp(`^\\S*\\.${id}\\s*->|^${id}\\.\\S+\\s*->|->\\s*\\S*\\.${id}(\\s|$)|->\\s*${id}\\.\\S+`))) {
      continue;
    }
    result.push(line);
  }
  // Clean up empty composite states: "state X ... {" followed by "}" → remove braces
  let changed = true;
  while (changed) {
    changed = false;
    for (let i = 0; i < result.length - 1; i++) {
      if (result[i].trim().match(/^state\s+\S+\s+.*\{$/) && result[i + 1].trim() === '}') {
        result[i] = result[i].replace(/\s*\{$/, '');
        result.splice(i + 1, 1);
        changed = true;
        break;
      }
    }
  }
  return result.join('\n');
}

function deleteSelected() {
  if (!sel.length) return;
  pushHistory();
  let dsl = getDsl();
  for (const si of sel) {
    dsl = removeDSLElement(si.id, dsl);
  }
  sel = [];
  setDsl(dsl);
  refresh();
}

// ═══════════════════════════════════════════════
// Batch Operations
// ═══════════════════════════════════════════════
function batchNudge(axis, delta) {
  pushHistory();
  let dsl = getDsl();
  sel.forEach(si => {
    const it = getItem(si); if (!it) return;
    const step = parsed.pseudoMap && parsed.pseudoMap[si.id] ? 0.5 : 1;
    const d = delta * step;
    const nx = Math.max(0, it.x + (axis === 'x' ? d : 0));
    const ny = Math.max(0, it.y + (axis === 'y' ? d : 0));
    dsl = updatePos(si.type, si.id, nx, ny, dsl);
  });
  setDsl(dsl);
  refresh();
}

function batchNudgeSz(axis, delta) {
  pushHistory();
  let dsl = getDsl();
  sel.forEach(si => {
    const it = getItem(si); if (!it || it.w == null) return;
    const nw = axis === 'w' ? Math.max(1, it.w + delta) : it.w;
    const nh = axis === 'h' ? Math.max(1, it.h + delta) : it.h;
    dsl = updateSize(si.type, si.id, nw, nh, dsl);
  });
  setDsl(dsl);
  refresh();
}

function batchProp(prop, val) {
  pushHistory();
  let dsl = getDsl();
  sel.forEach(si => {
    dsl = updateProp(si.type, si.id, prop, val, dsl);
  });
  setDsl(dsl);
  refresh();
}

function batchDelete() {
  pushHistory();
  let dsl = getDsl();
  sel.forEach(si => { dsl = removeDSLElement(si.id, dsl); });
  sel = [];
  setDsl(dsl);
  refresh();
}

function nudge(axis, delta) {
  if (!sel.length) return;
  pushHistory();
  const si = sel[0];
  const it = getItem(si); if (!it) return;
  const step = parsed.pseudoMap && parsed.pseudoMap[si.id] ? 0.5 : 1;
  const d = delta * step;
  let dsl = getDsl();
  dsl = updatePos(si.type, si.id, Math.max(0, it.x + (axis === 'x' ? d : 0)), Math.max(0, it.y + (axis === 'y' ? d : 0)), dsl);
  setDsl(dsl);
  refresh();
}

function nudgeSz(axis, delta) {
  if (!sel.length) return;
  pushHistory();
  const si = sel[0];
  const it = getItem(si); if (!it || it.w == null) return;
  let dsl = getDsl();
  dsl = updateSize(si.type, si.id, axis === 'w' ? Math.max(1, it.w + delta) : it.w, axis === 'h' ? Math.max(1, it.h + delta) : it.h, dsl);
  setDsl(dsl);
  refresh();
}

// ═══════════════════════════════════════════════
// Transition Management
// ═══════════════════════════════════════════════
function findTransBetween(a, b) {
  if (!parsed) return [];
  // Match by bare ID or dot-path (e.g. "accel" matches "active.accel")
  const dpA = stateDotPath(a), dpB = stateDotPath(b);
  function match(tRef, id) {
    return tRef === id || tRef === stateDotPath(id) || tRef.endsWith('.' + id);
  }
  return parsed.transitions.filter(t =>
    (match(t.from, a) && match(t.to, b)) || (match(t.from, b) && match(t.to, a))
  );
}

function connectTwo(a, b) {
  // Skip event prompt for pseudo-states (initial, final, choice, etc.)
  const isPseudo = parsed && (parsed.pseudoMap[a] || parsed.pseudoMap[b]);
  const event = isPseudo ? null : prompt('Event name (optional):');
  if (!isPseudo && event === null) return; // user cancelled prompt
  pushHistory();
  let dsl = getDsl();
  dsl = addTransition(stateDotPath(a), stateDotPath(b), event || null, null, null, null, dsl);
  setDsl(dsl);
  refresh();
}

function removeTrans(a, b) {
  pushHistory();
  let dsl = getDsl();
  const lines = dsl.split('\n');
  dsl = lines.filter(l => {
    const m = l.trim().match(/^(\S+)\s*->\s*(\S+)/);
    if (!m) return true;
    return !((m[1] === a && m[2] === b) || (m[1] === b && m[2] === a));
  }).join('\n');
  setDsl(dsl);
  refresh();
}

// Remove a transition by DSL line number (1-based)
function removeTransByLine(lineNum) {
  pushHistory();
  let dsl = getDsl();
  const lines = dsl.split('\n');
  lines.splice(lineNum - 1, 1);
  setDsl(lines.join('\n'));
  refresh();
}

// Flip a transition by DSL line number (1-based)
function flipTransByLine(lineNum) {
  pushHistory();
  let dsl = getDsl();
  const lines = dsl.split('\n');
  const idx = lineNum - 1;
  const m = lines[idx].trim().match(/^(\S+)(\s*->\s*)(\S+)(.*)/);
  if (m) lines[idx] = lines[idx].replace(/^(\s*)(\S+)(\s*->\s*)(\S+)/, `$1${m[3]}$3${m[1]}`);
  setDsl(lines.join('\n'));
  refresh();
}

function setTransProp(a, b, prop, val) {
  pushHistory();
  let dsl = getDsl();
  const lines = dsl.split('\n');
  const re = new RegExp(prop + '=\\S+');
  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].trim().match(/^(\S+)\s*->\s*(\S+)/);
    if (!m) continue;
    if ((m[1] === a && m[2] === b) || (m[1] === b && m[2] === a)) {
      if (re.test(lines[i])) {
        lines[i] = lines[i].replace(re, `${prop}=${val}`);
      } else {
        // Ensure there's a : section for transition attributes
        const hasColon = lines[i].match(/^[^#]*->[^:]*:/);
        if (hasColon) {
          lines[i] = lines[i].trimEnd() + ` ${prop}=${val}`;
        } else {
          lines[i] = lines[i].trimEnd() + ` : ${prop}=${val}`;
        }
      }
      break;
    }
  }
  setDsl(lines.join('\n'));
  refresh();
}

// Set property on a transition by DSL line number (1-based)
function setTransPropByLine(lineNum, prop, val) {
  pushHistory();
  let dsl = getDsl();
  const lines = dsl.split('\n');
  const idx = lineNum - 1;
  if (idx < 0 || idx >= lines.length) return;
  const re = new RegExp(prop + '=\\S+');
  if (re.test(lines[idx])) {
    lines[idx] = lines[idx].replace(re, `${prop}=${val}`);
  } else {
    const hasColon = lines[idx].match(/^[^#]*->[^:]*:/);
    if (hasColon) lines[idx] = lines[idx].trimEnd() + ` ${prop}=${val}`;
    else lines[idx] = lines[idx].trimEnd() + ` : ${prop}=${val}`;
  }
  setDsl(lines.join('\n'));
  refresh();
}

// Update event/guard/action on a transition by DSL line number (1-based)
function updateTransFieldByLine(lineNum, field, newVal) {
  pushHistory();
  let dsl = getDsl();
  const lines = dsl.split('\n');
  const idx = lineNum - 1;
  if (idx < 0 || idx >= lines.length) return;
  const t = lines[idx].trim();
  const m = t.match(/^(\S+)\s*->\s*(\S+)\s*(.*)/);
  if (!m) return;
  const from = m[1], to = m[2], rest = m[3];
  let le = '', lg = '', la = '', lk = '', attrs = '';
  if (rest.startsWith(':')) {
    const d = rest.slice(1).trim();
    const em = d.match(/^(\S*)/); if (em) le = em[1];
    const gm = d.match(/\[([^\]]*)\]/); if (gm) lg = gm[1];
    const am = d.match(/\/\s*(\S+)/); if (am) la = am[1];
    const km = d.match(/@(\S+)/); if (km) lk = km[1];
    const attrMatch = d.match(/((?:color|width|style)=\S+(?:\s+(?:color|width|style)=\S+)*)\s*$/);
    if (attrMatch) attrs = attrMatch[1];
  }
  if (field === 'event') le = newVal || '';
  if (field === 'guard') lg = newVal || '';
  if (field === 'action') la = newVal || '';
  const prefix = lines[idx].match(/^(\s*)/)[1];
  let newLine = `${prefix}${from} -> ${to}`;
  if (le || lg || la || lk || attrs) {
    newLine += ' :';
    if (le) newLine += ' ' + le;
    if (lg) newLine += ' [' + lg + ']';
    if (la) newLine += ' / ' + la;
    if (lk) newLine += ' @' + lk;
    if (attrs) newLine += ' ' + attrs;
  }
  lines[idx] = newLine;
  setDsl(lines.join('\n'));
  refresh();
}

// ═══════════════════════════════════════════════
// Copy / Paste (basic)
// ═══════════════════════════════════════════════
function copySelection() {
  if (!sel.length) return;
  clipboard = [];
  const dsl = getDsl();
  const lines = dsl.split('\n');
  for (const si of sel) {
    const id = si.id;
    // Find the DSL lines that define this element
    let collecting = false;
    let nestDepth = 0;
    const collected = [];
    for (const line of lines) {
      const trimmed = line.trim();
      if (!collecting) {
        if (trimmed.match(new RegExp(`^(state|group|note|initial|final|choice|history|deephistory|fork|join)\\s+${id}\\b`))) {
          collecting = true;
          collected.push(line);
          if (trimmed.endsWith('{')) nestDepth = 1;
          else { collecting = false; }
        }
      } else {
        collected.push(line);
        if (trimmed.endsWith('{')) nestDepth++;
        if (trimmed === '}' || trimmed.startsWith('}')) {
          nestDepth--;
          if (nestDepth === 0) collecting = false;
        }
      }
    }
    if (collected.length > 0) {
      clipboard.push(...collected);
    }
  }
}

function cutSelection() {
  if (!sel.length) return;
  copySelection();
  pushHistory();
  let dsl = getDsl();
  sel.forEach(si => {
    dsl = removeDSLElement(si.id, dsl);
  });
  sel = [];
  setDsl(dsl);
  refresh();
}

function pasteSelection() {
  if (!clipboard || !clipboard.length) return;
  pushHistory();
  const newSel = [];
  const pastedLines = clipboard.map(line => {
    const newId = `__new_${addCounter++}`;
    const idMatch = line.match(/^(\s*(?:state|group|note|initial|final|choice|history|deephistory|fork|join))\s+(\S+)/);
    if (!idMatch) return line;
    const oldId = idMatch[2];
    let result = line.replace(new RegExp(`^(\\s*(?:state|group|note|initial|final|choice|history|deephistory|fork|join)\\s+)${oldId.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}`), `$1${newId}`);
    result = result.replace(/\bat\s+([\d.]+)\s*,\s*([\d.]+)/g, (m, x, y) => `at ${parseFloat(x) + 2},${parseFloat(y) + 2}`);
    const type = idMatch[1].trim();
    newSel.push({type: type === 'state' ? 'state' : type, id: newId});
    return result;
  });
  let dsl = getDsl();
  dsl = dsl.trimEnd() + '\n' + pastedLines.join('\n') + '\n';
  setDsl(dsl);
  sel = newSel;
  refresh();
}

// ═══════════════════════════════════════════════
// Add Element Buttons
// ═══════════════════════════════════════════════
let addCounter = 1; // StableBlock compatible: single counter

// Auto-Route: optimize transition port assignments to minimize crossings
function autoRoute() {
  if (!parsed || parsed.transitions.length < 2) return;
  // Current implementation uses computePortSide (edge-gap) which is deterministic.
  // Auto-route tries alternate side assignments and picks the one with fewest crossings.
  const g = parsed.canvas.grid;

  function countCrossings(routes) {
    let count = 0;
    for (let i = 0; i < routes.length; i++) {
      for (let j = i + 1; j < routes.length; j++) {
        const ri = routes[i], rj = routes[j];
        for (let si = 0; si < ri.length - 1; si++) {
          for (let sj = 0; sj < rj.length - 1; sj++) {
            if (segmentIntersection(ri[si], ri[si + 1], rj[sj], rj[sj + 1])) count++;
          }
        }
      }
    }
    return count;
  }

  // Current routes
  const currentRoutes = [];
  for (const tr of parsed.transitions) {
    const srcBox = getBox(tr.from);
    const tgtBox = getBox(tr.to);
    if (!srcBox || !tgtBox) { currentRoutes.push([]); continue; }
    if (tr.from === tr.to) { currentRoutes.push(buildSelfRoute(srcBox)); continue; }
    const sides = computePortSide(srcBox, tgtBox);
    const fromPt = getPortPoint(srcBox, sides.srcSide, 0, 1);
    const toPt = getPortPoint(tgtBox, sides.tgtSide, 0, 1);
    currentRoutes.push(buildRoute(fromPt, toPt, sides.srcSide, sides.tgtSide));
  }

  const currentCrossings = countCrossings(currentRoutes);
  if (currentCrossings === 0) return; // Already optimal

  // Simple optimization: try flipping each transition's sides and keep if fewer crossings
  let bestRoutes = currentRoutes;
  let bestCount = currentCrossings;
  const allSides = ['top', 'bottom', 'left', 'right'];

  for (let ti = 0; ti < parsed.transitions.length; ti++) {
    const tr = parsed.transitions[ti];
    const srcBox = getBox(tr.from);
    const tgtBox = getBox(tr.to);
    if (!srcBox || !tgtBox || tr.from === tr.to) continue;

    for (const ss of allSides) {
      for (const ts of allSides) {
        if (ss === ts && (ss === 'left' || ss === 'right')) continue; // Same horizontal = overlap
        const fromPt = getPortPoint(srcBox, ss, 0, 1);
        const toPt = getPortPoint(tgtBox, ts, 0, 1);
        const newRoute = buildRoute(fromPt, toPt, ss, ts);
        const trial = [...bestRoutes];
        trial[ti] = newRoute;
        const c = countCrossings(trial);
        if (c < bestCount) {
          bestCount = c;
          bestRoutes = trial;
        }
      }
    }
  }

  // If improved, refresh (the current rendering already uses computePortSide, so we can't persist
  // side overrides without DSL changes. For now, just report the result.)
  if (bestCount < currentCrossings) {
    alert(`Auto-Route: ${currentCrossings} → ${bestCount} crossings. (Visual optimization only — refresh to revert)`);
  } else {
    alert('Auto-Route: routing is already optimal.');
  }
}

function groupSelected() {
  if (!parsed || sel.length < 2) return;
  const g = parsed.canvas.grid;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const si of sel) {
    const id = si.id;
    const el = parsed.stateMap[id] || parsed.pseudoMap[id] || parsed.groupMap[id];
    if (!el) continue;
    const abs = getAbsolutePos(el, parsed);
    const w = (el.w || 1) * g;
    const h = (el.h || 1) * g;
    minX = Math.min(minX, abs.x);
    minY = Math.min(minY, abs.y);
    maxX = Math.max(maxX, abs.x + w);
    maxY = Math.max(maxY, abs.y + h);
  }
  if (minX === Infinity) return;
  // Add 1-grid padding
  const pad = g;
  const gx = Math.max(0, Math.floor((minX - pad) / g));
  const gy = Math.max(0, Math.floor((minY - pad) / g));
  const gw = Math.ceil((maxX + pad) / g) - gx;
  const gh = Math.ceil((maxY + pad) / g) - gy;

  const grpId = `__new_${addCounter++}`;
  const line = `group ${grpId} "Group" at ${gx},${gy} size ${gw}x${gh}`;

  pushHistory();
  let dsl = getDsl();
  // Insert group before the first selected element's line
  dsl = dsl + '\n' + line;
  setDsl(dsl);
  refresh();
}

function labelToId(label) {
  if (!label) return '';
  return label.toLowerCase().replace(/[^a-z0-9_\s]/g, '').trim().replace(/\s+/g, '_').slice(0, 30);
}

function fixIds() {
  if (!parsed) return;
  pushHistory();
  let dsl = getDsl();
  // Collect all elements: states, groups, notes, AND pseudo-states
  const allElements = [...parsed.states, ...parsed.groups, ...parsed.notes];
  const pseudoElements = [...parsed.pseudoStates];

  // Fix states/groups/notes by label
  for (const el of allElements) {
    const newId = labelToId(el.label);
    if (!newId || newId === el.id) continue;
    if (parsed.stateMap[newId] || parsed.pseudoMap[newId] || parsed.groupMap[newId] || parsed.noteMap[newId]) continue;
    const idRe = new RegExp('\\b' + el.id.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'g');
    dsl = dsl.replace(idRe, newId);
  }

  // Fix pseudo-states by type prefix (ini, fin, choice, h, dh, fork, join)
  const pseudoPrefix = { initial: 'ini', final: 'fin', choice: 'choice', history: 'h', deephistory: 'dh', fork: 'fork', join: 'join' };
  const usedIds = new Set();
  // Collect currently used IDs after state/group/note rename
  const tmpParsed = parseDSL(dsl);
  for (const s of tmpParsed.states) usedIds.add(s.id);
  for (const p of tmpParsed.pseudoStates) usedIds.add(p.id);
  for (const g of tmpParsed.groups) usedIds.add(g.id);
  for (const n of tmpParsed.notes) usedIds.add(n.id);

  for (const ps of pseudoElements) {
    if (!ps.id.startsWith('__new_')) continue;
    const base = pseudoPrefix[ps.type] || ps.type;
    let newId = base;
    let n = 1;
    while (usedIds.has(newId)) { newId = base + '_' + n; n++; }
    usedIds.add(newId);
    const idRe = new RegExp('\\b' + ps.id.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'g');
    dsl = dsl.replace(idRe, newId);
  }

  setDsl(dsl);
  refresh();
}

function addNewElement(type) {
  pushHistory();
  let dsl = getDsl();
  let line = '';

  // Check if a state is selected — new element goes inside it
  // If not yet composite, convert it by appending { ... }
  let parentState = null;
  if (parsed && sel.length === 1 && sel[0].type === 'state' && type !== 'group' && type !== 'note') {
    const selId = sel[0].id;
    const st = parsed.stateMap[selId];
    if (st) {
      const dslLines = dsl.split('\n');
      const escapedId = selId.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp('^(\\s*state\\s+' + escapedId + '\\s+.*)$');
      const defIdx = dslLines.findIndex(l => re.test(l));
      if (defIdx >= 0) {
        const defLine = dslLines[defIdx];
        if (defLine.trim().endsWith('{')) {
          // Already composite
          parentState = st;
        } else {
          // Convert to composite: append { and add closing }
          dslLines[defIdx] = defLine + ' {';
          dslLines.splice(defIdx + 1, 0, '}');
          dsl = dslLines.join('\n');
          parentState = st;
        }
      }
    }
  }

  // Default position: inside parent (relative) or root
  const defX = parentState ? 1 : 10;
  const defY = parentState ? 2 : 10;

  switch (type) {
    case 'state': {
      const id = `__new_${addCounter++}`;
      line = `state ${id} "New State" at ${defX},${defY} size 8x4`;
      break;
    }
    case 'group': {
      const id = `__new_${addCounter++}`;
      line = `group ${id} "New Group" at 8,8 size 20x12`;
      break;
    }
    case 'initial': {
      const id = `__new_${addCounter++}`;
      line = `initial ${id} at ${parentState ? 0.5 : 5},${parentState ? defY : 5}`;
      break;
    }
    case 'final': {
      const id = `__new_${addCounter++}`;
      line = `final ${id} at ${parentState ? parentState.w - 1 : 30},${parentState ? defY : 5}`;
      break;
    }
    case 'note': {
      const id = `__new_${addCounter++}`;
      line = `note ${id} "Annotation" at 5,5 size 8x2 color=#FEF3C7`;
      break;
    }
  }

  if (line) {
    if (parentState && type !== 'group' && type !== 'note') {
      // Insert inside the composite state's { } block
      const indent = '  ';
      const lines = dsl.split('\n');
      // Find the closing } for this composite state by tracking nesting
      let depth = 0;
      let insertIdx = -1;
      for (let i = 0; i < lines.length; i++) {
        const t = lines[i].trim();
        if (t.match(new RegExp('^state\\s+' + parentState.id + '\\s+')) && t.endsWith('{')) {
          depth = 1;
          continue;
        }
        if (depth > 0) {
          if (t.endsWith('{')) depth++;
          if (t.startsWith('}')) {
            depth--;
            if (depth === 0) { insertIdx = i; break; }
          }
        }
      }
      if (insertIdx >= 0) {
        lines.splice(insertIdx, 0, indent + line);
        dsl = lines.join('\n');
      } else {
        dsl = dsl + '\n' + line;
      }
    } else {
      dsl = dsl + '\n' + line;
    }
    setDsl(dsl);
    // Auto-enable annotation mode when adding a note
    if (type === 'note' && !annotationMode) {
      annotationMode = true;
      const btn = document.getElementById('btn-annotations');
      if (btn) { btn.classList.add('active'); btn.textContent = 'Notes (Edit)'; }
    }
    refresh();
  }
}

// ═══════════════════════════════════════════════
// Toggle Annotations
// ═══════════════════════════════════════════════
function toggleAnnotations() {
  annotationMode = !annotationMode;
  // Filter selection on mode change
  if (annotationMode) {
    const noteIds = new Set(parsed ? parsed.notes.map(n => n.id) : []);
    sel = sel.filter(s => noteIds.has(s.id));
  } else {
    const noteIds = new Set(parsed ? parsed.notes.map(n => n.id) : []);
    sel = sel.filter(s => !noteIds.has(s.id));
  }
  const btn = document.getElementById('btn-annotations');
  if (btn) {
    btn.classList.toggle('active', annotationMode);
    btn.textContent = annotationMode ? 'Notes (Edit)' : 'Notes';
  }
  refresh();
}

// ═══════════════════════════════════════════════
// ADR-026: Search / Filter
// ═══════════════════════════════════════════════
function applySearchFilter() {
  const input = document.getElementById('search-input');
  searchFilter = (input ? input.value : '').trim().toLowerCase();
  if (!searchFilter) {
    searchMatchIds = null;
    refresh();
    return;
  }
  if (!parsed) return;
  const matched = new Set();
  // Match states by id, label, entry, do, exit
  for (const st of parsed.states) {
    if (st.id.toLowerCase().includes(searchFilter) ||
        (st.label && st.label.toLowerCase().includes(searchFilter)) ||
        (st.entry && st.entry.toLowerCase().includes(searchFilter)) ||
        (st.do && st.do.toLowerCase().includes(searchFilter)) ||
        (st.exit && st.exit.toLowerCase().includes(searchFilter))) {
      matched.add(st.id);
    }
  }
  // Match pseudo-states by id
  for (const ps of parsed.pseudoStates) {
    if (ps.id.toLowerCase().includes(searchFilter)) matched.add(ps.id);
  }
  // Match groups by id, label
  for (const grp of parsed.groups) {
    if (grp.id.toLowerCase().includes(searchFilter) ||
        (grp.label && grp.label.toLowerCase().includes(searchFilter))) {
      matched.add(grp.id);
    }
  }
  // Match transitions by event, guard, action — add both endpoints
  for (const tr of parsed.transitions) {
    if ((tr.event && tr.event.toLowerCase().includes(searchFilter)) ||
        (tr.guard && tr.guard.toLowerCase().includes(searchFilter)) ||
        (tr.action && tr.action.toLowerCase().includes(searchFilter))) {
      matched.add(tr.from);
      matched.add(tr.to);
    }
  }
  searchMatchIds = matched;
  refresh();
}

function clearSearchFilter() {
  const input = document.getElementById('search-input');
  if (input) input.value = '';
  searchFilter = '';
  searchMatchIds = null;
  refresh();
}

// ═══════════════════════════════════════════════
// Keyboard Shortcuts
// ═══════════════════════════════════════════════
document.addEventListener('keydown', function(e) {
  const ta = document.getElementById('editor');
  const ae = document.activeElement;

  // Ctrl+Z: Undo (always works)
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
  // Ctrl+Y or Ctrl+Shift+Z: Redo
  if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) { e.preventDefault(); redo(); return; }
  // Ctrl+Shift+Z uppercase fallback
  if ((e.ctrlKey || e.metaKey) && e.key === 'Z' && e.shiftKey) { e.preventDefault(); redo(); return; }

  // Don't intercept while editing DSL
  if (ae === ta) return;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT' || ae.tagName === 'TEXTAREA')) {
    return;
  }

  // Ctrl+C: Copy
  if ((e.ctrlKey || e.metaKey) && e.key === 'c') { e.preventDefault(); copySelection(); return; }
  // Ctrl+X: Cut
  if ((e.ctrlKey || e.metaKey) && e.key === 'x') { e.preventDefault(); cutSelection(); return; }
  // Ctrl+V: Paste
  if ((e.ctrlKey || e.metaKey) && e.key === 'v') { e.preventDefault(); pasteSelection(); return; }
  // Delete / Backspace
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelected(); return; }
  // Ctrl+A: Select all
  if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
    e.preventDefault();
    if (!parsed) return;
    if (annotationMode) {
      sel = parsed.notes.map(n => ({type: 'note', id: n.id}));
    } else {
      sel = [
        ...parsed.states.map(s => ({type: 'state', id: s.id})),
        ...parsed.pseudoStates.map(p => ({type: p.type, id: p.id})),
        ...parsed.groups.map(g => ({type: 'group', id: g.id}))
      ];
    }
    refresh();
    return;
  }
  // Arrow keys: move selected
  if (sel.length && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
    e.preventDefault();
    const ax = (e.key === 'ArrowLeft' || e.key === 'ArrowRight') ? 'x' : 'y';
    const d = (e.key === 'ArrowRight' || e.key === 'ArrowDown') ? 1 : -1;
    if (sel.length > 1) batchNudge(ax, d); else nudge(ax, d);
    return;
  }
  // H: Toggle highlight
  if (e.key === 'h' || e.key === 'H') { e.preventDefault(); toggleHighlight(); return; }
  // N: Toggle annotations
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); toggleAnnotations(); return; }
});

// ═══════════════════════════════════════════════
// Wire up toolbar buttons for tool-based actions
// ═══════════════════════════════════════════════
(function setupToolbarActions() {
  // Override setTool to handle tool-based element creation
  const origSetTool = setTool;
  setTool = function(name) {
    if (name === 'connect') {
      // Enter connect mode: user clicks source, then target
      connectFrom = null;
      origSetTool(name);
      return;
    }
    if (name === 'state' || name === 'group' || name === 'initial' || name === 'final') {
      addNewElement(name);
      origSetTool('select');
      return;
    }
    connectFrom = null; // clear connect state when switching tools
    origSetTool(name);
  };
})();

// ═══════════════════════════════════════════════
// VSCode webview message handler
// ═══════════════════════════════════════════════
if (isVSCode) {
  window.addEventListener('message', function(e) {
    var msg = e.data;
    if (msg.type === 'dslUpdate') {
      _suppressVscodeSync = true;
      _vscode_dsl = msg.dsl;
      refresh();
      _suppressVscodeSync = false;
    }
    if (msg.type === 'exportSVG') {
      var svgEl = document.querySelector('#svg-wrap svg');
      if (svgEl) {
        var svgStr = new XMLSerializer().serializeToString(svgEl);
        vscodeApi.postMessage({ type: 'exportSVG', data: btoa(unescape(encodeURIComponent(svgStr))) });
      }
    }
    if (msg.type === 'exportPNG') {
      var svgEl = document.querySelector('#svg-wrap svg');
      if (!svgEl || !parsed) return;
      var svgStr = new XMLSerializer().serializeToString(svgEl);
      var canvas = document.createElement('canvas');
      canvas.width = parsed.canvas.width;
      canvas.height = parsed.canvas.height;
      var ctx = canvas.getContext('2d');
      var img = new Image();
      img.onload = function() {
        ctx.drawImage(img, 0, 0);
        var dataUrl = canvas.toDataURL('image/png');
        vscodeApi.postMessage({ type: 'exportPNG', data: dataUrl.split(',')[1] });
      };
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
    }
    if (msg.type === 'undo') { undo(); }
    if (msg.type === 'redo') { redo(); }
    if (msg.type === 'copy') { copySelection(); }
    if (msg.type === 'cut') { cutSelection(); }
    if (msg.type === 'paste') { pasteSelection(); }
    if (msg.type === 'selectAll') {
      if (!parsed) return;
      sel = [...parsed.states.map(s => ({type:'state',id:s.id})), ...parsed.pseudoStates.map(p => ({type:p.type,id:p.id})), ...parsed.groups.map(g => ({type:'group',id:g.id}))];
      refresh();
    }
  });
}

if (isVSCode) {
  var ep = document.getElementById('editor-panel');
  if (ep) ep.style.display = 'none';
  var sp = document.getElementById('splitter');
  if (sp) sp.style.display = 'none';
}

refresh();
